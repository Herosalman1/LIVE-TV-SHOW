<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live TV Admin Dashboard ⚡</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0f1319; 
            background-image: radial-gradient(circle at top right, #1a1a2e, #0f1319);
            color: #c9d1d9; font-family: 'Poppins', sans-serif; 
            display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; padding: 20px;
        }
        .admin-box { 
            background: #161b22; padding: 35px 25px; border-radius: 16px; width: 100%; max-width: 550px; 
            border: 1px solid #ff003c; text-align: center; box-shadow: 0 15px 35px rgba(255, 0, 60, 0.15); position: relative; overflow: hidden;
        }
        .admin-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #ff003c, #00ea77, #ff003c);
        }
        h2, h3 { color: #fff; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
        h2 i, h3 i { color: #ff003c; margin-right: 8px; }
        .subtitle { color: #8b949e; font-size: 13px; font-weight: 500; margin-bottom: 20px; font-family: 'Inter', sans-serif; }
        .input-pro, select.input-pro { 
            width: 100%; padding: 14px 18px; margin-bottom: 15px; background: #010409; color: #fff; 
            border: 1px solid #30363d; border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif; transition: all 0.3s ease;
        }
        select.input-pro {
            appearance: none; background-image: url("data:image/svg+xml;utf8,<svg fill='%238b949e' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat; background-position: right 15px center; padding-right: 45px; cursor: pointer;
        }
        .input-pro:focus { border-color: #ff003c; box-shadow: 0 0 12px rgba(255, 0, 60, 0.2); outline: none; }
        select.input-pro option { background: #161b22; color: #fff; }
        .cat-group { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; width: 100%; }
        .cat-group select.input-pro, .cat-group input.input-pro { margin-bottom: 0; flex: 1; }
        .add-cat-btn { 
            padding: 0 18px; height: 48px; background: #21262d; color: #fff; border: 1px solid #30363d; 
            border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.3s; white-space: nowrap; display: flex; align-items: center; justify-content: center;
        }
        .add-cat-btn:hover { background: #30363d; border-color: #ff003c; color: #ff003c; }
        .btn-pro { 
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; margin-bottom: 15px;
            border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 15px; transition: all 0.3s ease; text-transform: uppercase; font-family: 'Poppins', sans-serif;
        }
        .btn-green { background: #00ea77; color: #000; box-shadow: 0 4px 15px rgba(0, 234, 119, 0.2); }
        .btn-green:hover { background: #00ff88; transform: translateY(-2px); }
        .btn-yellow { background: #d29922; color: #fff; box-shadow: 0 4px 15px rgba(210, 153, 34, 0.2); }
        .btn-yellow:hover { background: #e3b341; transform: translateY(-2px); }
        .btn-blue { background: #ff003c; color: #fff; box-shadow: 0 4px 15px rgba(255, 0, 60, 0.2); margin-bottom: 0;}
        .btn-blue:hover { background: #ff1a4d; transform: translateY(-2px); }
        .btn-logout { background: #da3633; color: #fff; margin-top: 10px; padding: 10px; font-size: 13px; }
        .btn-logout:hover { background: #f85149; }
        
        /* Drag & Drop List Styling */
        .category-folder { 
            margin-bottom: 10px; background: rgba(255,255,255,0.02); border-radius: 10px; overflow: hidden; border: 1px solid #30363d; 
            cursor: grab; transition: 0.2s;
        }
        .category-folder.dragging { opacity: 0.4; border: 1px dashed #00ea77; }
        .category-folder.drag-over { border-top: 3px solid #ff003c; }

        .category-header { 
            padding: 12px 15px; background: rgba(0,0,0,0.3); color: #fff; font-weight: 600; font-size: 13px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; 
        }
        .cat-count { font-size: 11px; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 20px; color: #00ea77;}
        .category-content { display: none; padding: 10px; background: rgba(0,0,0,0.15); }
        .category-content.open { display: block; }
        
        .list-item { 
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 10px 12px; 
            background: #0d1117; border-radius: 8px; border: 1px solid #21262d; text-align: left; cursor: grab; transition: 0.2s ease;
        }
        .list-item:active { cursor: grabbing; }
        .list-item.dragging { opacity: 0.4; background: #21262d; border: 1px dashed #00ea77; }
        .list-item.drag-over { border-top: 3px solid #ff003c; transform: scale(1.02); }
        .drag-icon { margin-right: 10px; color: #8b949e; font-size: 14px; cursor: grab; }

        .action-btns button { padding: 6px 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px; color: #fff; }
        .btn-edit { background: #9e6a03; margin-right: 6px; }
        .btn-delete { background: #da3633; }
        
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-content { background: #161b22; padding: 25px; border-radius: 16px; border: 1px solid #ff003c; width: 90%; max-width: 650px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 15px 50px rgba(0,0,0,0.6); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 12px; margin-bottom: 15px; }
        .close-btn { color: #da3633; font-size: 24px; font-weight: bold; cursor: pointer; background: none; border: none; }
        #projectList { overflow-y: auto; padding-right: 5px; flex-grow: 1; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="admin-box" id="loginSection">
        <h2><i class="fa-solid fa-shield-halved"></i> Live TV Admin</h2>
        <p class="subtitle">Secure Control Room for Herosalman1</p>
        <button class="btn-pro btn-green" style="margin-top: 15px;" onclick="loadData()">
            <i class="fa-solid fa-right-to-bracket"></i> ENTER ADMIN PANEL
        </button>
    </div>

    <div class="admin-box" id="editorSection" style="display:none; padding-top: 25px;">
        <h3 id="formTitle"><i class="fa-solid fa-plus-circle"></i> Add New Channel</h3>
        <p class="subtitle" style="margin-bottom: 15px;">Add, edit or drag-drop reorder folders & channels.</p>
        
        <input type="text" id="pName" class="input-pro" placeholder="Channel Name (e.g. Aaj Tak HD)">
        <input type="url" id="pLink" class="input-pro" placeholder="Stream URL (.m3u8 link)">
        
        <div class="cat-group">
            <select id="pCat" class="input-pro"></select>
            <input type="text" id="newCategoryInput" class="input-pro" placeholder="Custom category..." style="display: none;">
            <button class="add-cat-btn" id="catToggleBtn" onclick="toggleCatInput()">+ NEW</button>
        </div>
        
        <button id="actionBtn" class="btn-pro btn-green" onclick="processChannel()">
            <i class="fa-solid fa-plus"></i> ADD TO LIST
        </button>
        
        <hr style="border: none; border-top: 1px solid #30363d; margin: 20px 0;">

        <button class="btn-pro btn-yellow" onclick="openModal()">
            <i class="fa-solid fa-folder-tree"></i> VIEW FOLDERS & CHANNELS
        </button>
        
        <button class="btn-pro btn-blue" onclick="saveToGitHub()">
            <i class="fa-solid fa-cloud-arrow-up"></i> UPLOAD TO GITHUB
        </button>

        <button class="btn-pro btn-logout" onclick="logoutAdmin()">
            <i class="fa-solid fa-right-from-bracket"></i> LOGOUT
        </button>
    </div>

    <div id="listModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-folder-open"></i> DRAG & DROP REORDER LIST</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="subtitle" style="text-align: left; margin-top:-10px;">💡 Folders ko aur channels ko aapas mein drag karke upar-neeche set karein.</p>
            <div id="projectList"></div>
        </div>
    </div>

    <script>
        const TOKEN_PART_1 = "ghp_4c1hOQ3TUwZodG7zlVi"; 
        const TOKEN_PART_2 = "LqqEJ86fNlc453Mwx"; 
        const GIT_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
        
        const myRepo = "Herosalman1/LIVE-TV-SHOW"; 
        const fileName = "tools.json";
        
        let channelsArray = [];
        let fileSha = "";
        let editIndex = null; 
        let isCustomCat = false;
        let openFolders = new Set();
        
        const defaultCategories = ["NEWS", "MOVIE", "KIDS CARTOON", "MUSIC", "SPORTS", "SERIAL EPISODE", "OTHER"];
        let savedCategories = [...defaultCategories];

        // Check persistent login session on page load
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('tv_admin_logged_in') === 'true') {
                loadData(true);
            }
        });

        async function loadData(isAuto = false) {
            const loginBtn = document.querySelector('#loginSection .btn-green');
            if(!isAuto) loginBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> LOADING CHANNELS...";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/${fileName}`, {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                if(!response.ok) throw new Error("Key galat hai!");
                const data = await response.json();
                fileSha = data.sha;
                channelsArray = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                
                channelsArray.forEach(ch => {
                    const cat = ch.category || "OTHER";
                    if(!savedCategories.includes(cat)) savedCategories.push(cat);
                });

                renderCategoryDropdown();
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('editorSection').style.display = 'block';
                localStorage.setItem('tv_admin_logged_in', 'true');
            } catch (error) {
                if(!isAuto) alert("Error! Token ya repo check karo.");
                localStorage.removeItem('tv_admin_logged_in');
                loginBtn.innerHTML = "<i class='fa-solid fa-right-to-bracket'></i> ENTER ADMIN PANEL";
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('tv_admin_logged_in');
            document.getElementById('editorSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.querySelector('#loginSection .btn-green').innerHTML = "<i class='fa-solid fa-right-to-bracket'></i> ENTER ADMIN PANEL";
        }

        function renderCategoryDropdown() {
            const selectEl = document.getElementById('pCat');
            selectEl.innerHTML = '';
            savedCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat;
                selectEl.appendChild(opt);
            });
        }

        function toggleCatInput() {
            isCustomCat = !isCustomCat;
            const selectEl = document.getElementById('pCat');
            const inputEl = document.getElementById('newCategoryInput');
            const btnEl = document.getElementById('catToggleBtn');

            if (isCustomCat) {
                selectEl.style.display = 'none'; inputEl.style.display = 'block'; inputEl.focus(); btnEl.innerText = '✖ CANCEL';
            } else {
                selectEl.style.display = 'block'; inputEl.style.display = 'none'; inputEl.value = ''; btnEl.innerText = '+ NEW';
            }
        }

        function renderList() {
            const list = document.getElementById('projectList');
            list.innerHTML = "";
            if (channelsArray.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#8b949e; padding:20px;">No channels found.</div>';
                return;
            }

            // Extract categories in order of appearance or savedCategories
            const activeCategories = [];
            channelsArray.forEach(ch => {
                const cat = ch.category || "OTHER";
                if (!activeCategories.includes(cat)) activeCategories.push(cat);
            });
            savedCategories.forEach(cat => {
                if (!activeCategories.includes(cat)) activeCategories.push(cat);
            });

            activeCategories.forEach((cat, catIdx) => {
                const channelsInCat = channelsArray.map((ch, idx) => ({...ch, originalIndex: idx})).filter(c => (c.category || "OTHER") === cat);
                
                const catId = cat.replace(/\s+/g, '-').toLowerCase();
                const isOpen = openFolders.has(catId);

                const folderDiv = document.createElement('div');
                folderDiv.className = 'category-folder';
                folderDiv.setAttribute('draggable', 'true');
                folderDiv.setAttribute('data-cat-index', catIdx);
                folderDiv.setAttribute('data-cat-name', cat);
                
                folderDiv.innerHTML = `
                    <div class="category-header">
                        <span onclick="toggleFolder('${catId}')" style="flex:1; display:flex; align-items:center;">
                            <i class="fa-solid ${isOpen ? 'fa-folder-open' : 'fa-folder'}" style="margin-right:8px; color:#00ea77;"></i> ${cat} <span class="cat-count" style="margin-left:10px;">${channelsInCat.length}</span>
                        </span>
                        <span style="color: #8b949e; font-size:12px; cursor:grab;" title="Drag folder"><i class="fa-solid fa-grip-vertical"></i></span>
                    </div>
                    <div class="category-content ${isOpen ? 'open' : ''}" id="folder-${catId}"></div>
                `;
                list.appendChild(folderDiv);

                const contentEl = folderDiv.querySelector('.category-content');
                channelsInCat.forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'list-item';
                    item.setAttribute('draggable', 'true');
                    item.setAttribute('data-index', ch.originalIndex);
                    
                    item.innerHTML = `
                        <div style="display: flex; align-items: center; flex: 1; overflow: hidden; padding-right: 10px;">
                            <span class="drag-icon"><i class="fa-solid fa-grip-vertical"></i></span>
                            <span style="font-size: 13px; font-weight: 500; color: #fff;">📺 ${ch.name}</span>
                        </div>
                        <div class="action-btns" style="flex-shrink: 0;">
                            <button class="btn-edit" onclick="editChannel(${ch.originalIndex})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-delete" onclick="deleteChannel(${ch.originalIndex})"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `;
                    contentEl.appendChild(item);
                });
            });
            addDragAndDropListeners();
        }

        function addDragAndDropListeners() {
            let draggedType = null;
            let dragSourceIndex = null;

            // Folder Drag & Drop
            const folders = document.querySelectorAll('.category-folder');
            folders.forEach(folder => {
                folder.addEventListener('dragstart', function(e) {
                    if(e.target.classList.contains('list-item')) return;
                    draggedType = 'folder';
                    dragSourceIndex = +this.getAttribute('data-cat-index');
                    this.classList.add('dragging');
                    e.stopPropagation();
                });
                folder.addEventListener('dragover', function(e) { e.preventDefault(); });
                folder.addEventListener('dragenter', function(e) { e.preventDefault(); if(draggedType === 'folder') this.classList.add('drag-over'); });
                folder.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
                folder.addEventListener('drop', function(e) {
                    e.stopPropagation();
                    this.classList.remove('drag-over');
                    if(draggedType === 'folder') {
                        const targetIndex = +this.getAttribute('data-cat-index');
                        reorderCategories(dragSourceIndex, targetIndex);
                    }
                });
                folder.addEventListener('dragend', function() { this.classList.remove('dragging'); });
            });

            // Channel Item Drag & Drop
            const draggables = document.querySelectorAll('.list-item');
            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', function(e) {
                    draggedType = 'channel';
                    dragSourceIndex = +this.getAttribute('data-index');
                    this.classList.add('dragging');
                    e.stopPropagation();
                });
                draggable.addEventListener('dragover', function(e) { e.preventDefault(); });
                draggable.addEventListener('dragenter', function(e) { e.preventDefault(); if(draggedType === 'channel') this.classList.add('drag-over'); });
                draggable.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
                draggable.addEventListener('drop', function(e) {
                    e.stopPropagation();
                    this.classList.remove('drag-over');
                    if(draggedType === 'channel') {
                        const targetIndex = +this.getAttribute('data-index');
                        swapChannels(dragSourceIndex, targetIndex);
                    }
                });
                draggable.addEventListener('dragend', function() { this.classList.remove('dragging'); });
            });
        }

        function reorderCategories(fromCatIdx, toCatIdx) {
            const activeCategories = [];
            channelsArray.forEach(ch => {
                const cat = ch.category || "OTHER";
                if (!activeCategories.includes(cat)) activeCategories.push(cat);
            });
            savedCategories.forEach(cat => {
                if (!activeCategories.includes(cat)) activeCategories.push(cat);
            });

            const movedCat = activeCategories.splice(fromCatIdx, 1)[0];
            activeCategories.splice(toCatIdx, 0, movedCat);
            savedCategories = activeCategories;

            // Reorganize channelsArray based on new category order
            let newChannelsArray = [];
            savedCategories.forEach(cat => {
                const chans = channelsArray.filter(ch => (ch.category || "OTHER") === cat);
                newChannelsArray = newChannelsArray.concat(chans);
            });
            channelsArray = newChannelsArray;
            renderList();
        }

        function swapChannels(fromIndex, toIndex) {
            const itemToMove = channelsArray.splice(fromIndex, 1)[0];
            // If dropping onto another item, update its category to match target category
            itemToMove.category = channelsArray[toIndex].category || "OTHER";
            channelsArray.splice(toIndex, 0, itemToMove);
            renderList();
        }

        function toggleFolder(catId) {
            const content = document.getElementById('folder-' + catId);
            if (content.classList.contains('open')) {
                content.classList.remove('open'); openFolders.delete(catId);
            } else {
                content.classList.add('open'); openFolders.add(catId);
            }
        }

        function processChannel() {
            const name = document.getElementById('pName').value.trim();
            const link = document.getElementById('pLink').value.trim();
            let category = "OTHER";

            if (isCustomCat) {
                const customCat = document.getElementById('newCategoryInput').value.trim().toUpperCase();
                if (!customCat) return alert("Please enter custom category name!");
                category = customCat;
                if (!savedCategories.includes(category)) { savedCategories.push(category); renderCategoryDropdown(); }
                toggleCatInput();
            } else {
                category = document.getElementById('pCat').value;
            }
            
            if(!name || !link) return alert("Channel ka Naam aur Link dono daalna zaroori hai!");

            if(editIndex === null) {
                channelsArray.push({name, url: link, category});
            } else {
                channelsArray[editIndex] = {name, url: link, category};
                editIndex = null;
                document.getElementById('formTitle').innerHTML = "<i class='fa-solid fa-plus-circle'></i> Add New Channel";
                document.getElementById('actionBtn').innerHTML = "<i class='fa-solid fa-plus'></i> ADD TO LIST";
                document.getElementById('actionBtn').className = "btn-pro btn-green";
            }

            document.getElementById('pName').value = ""; document.getElementById('pLink').value = "";
            alert("Channel added! Click 'UPLOAD TO GITHUB' to save permanently.");
        }

        function editChannel(index) {
            editIndex = index;
            document.getElementById('pName').value = channelsArray[index].name || "";
            document.getElementById('pLink').value = channelsArray[index].url || "";
            document.getElementById('pCat').value = channelsArray[index].category || "OTHER";
            
            document.getElementById('formTitle').innerHTML = "<i class='fa-solid fa-pen-to-square'></i> Edit Channel";
            document.getElementById('actionBtn').innerHTML = "<i class='fa-solid fa-check-double'></i> UPDATE CHANNEL";
            document.getElementById('actionBtn').className = "btn-pro btn-yellow";
            closeModal();
        }

        function deleteChannel(index) {
            if(confirm("Pakka is channel ko delete karna hai?")) {
                channelsArray.splice(index, 1);
                renderList();
            }
        }

        async function saveToGitHub() {
            const updatedJson = JSON.stringify(channelsArray, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));
            const uploadBtn = document.querySelector('.btn-blue');
            
            uploadBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> SAVING...";
            uploadBtn.style.background = "#d29922";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GIT_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Updated via Admin Panel", content: encodedContent, sha: fileSha })
                });

                if(response.ok) {
                    const data = await response.json();
                    fileSha = data.content.sha;
                    uploadBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> UPLOAD DONE ✅";
                    uploadBtn.style.background = "#00ea77"; uploadBtn.style.color = "#000";
                    setTimeout(() => {
                        uploadBtn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> UPLOAD TO GITHUB";
                        uploadBtn.style.background = "#ff003c"; uploadBtn.style.color = "#fff";
                    }, 3000);
                } else throw new Error("Save error");
            } catch (error) {
                uploadBtn.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> FAILED ❌";
                uploadBtn.style.background = "#da3633";
            }
        }

        function openModal() { document.getElementById('listModal').style.display = 'flex'; renderList(); }
        function closeModal() { document.getElementById('listModal').style.display = 'none'; }
    </script>
</body>
</html>
