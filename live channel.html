<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Live TV Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-sidebar: rgba(17, 24, 39, 0.6);
            --bg-card: rgba(255, 255, 255, 0.03);
            --primary-gradient: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            --danger-gradient: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            --edit-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: radial-gradient(circle at top right, #1a233a, var(--bg-main)); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        .header { 
            background: rgba(11, 15, 25, 0.8); 
            backdrop-filter: blur(15px);
            padding: 15px 30px; 
            font-size: 22px; 
            font-weight: 700; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .header-title { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 10px;}
        .header-badge { font-size: 11px; background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3); padding: 4px 10px; border-radius: 20px; color: #00f2fe; letter-spacing: 1px; text-transform: uppercase; font-weight: 600;}

        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { 
            width: 550px; 
            min-width: 550px; 
            max-width: 50%; 
            flex-shrink: 0;
            background: var(--bg-sidebar); 
            backdrop-filter: blur(20px);
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid var(--border-color); 
            box-shadow: 5px 0 25px rgba(0,0,0,0.3);
            z-index: 5;
        }
        
        .add-channel-box { padding: 20px; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.2); }
        .add-channel-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; padding: 5px 0; }
        .add-channel-header h3 { font-size: 15px; font-weight: 600; color: #e2e8f0; display: flex; align-items: center; gap: 8px; margin: 0; }
        .toggle-icon { font-size: 12px; color: #00f2fe; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); background: rgba(0, 242, 254, 0.1); padding: 4px 8px; border-radius: 5px;}
        
        #addChannelForm { display: none; margin-top: 20px; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        input, select { 
            width: 100%; padding: 12px 15px; margin-bottom: 15px; 
            background: rgba(15, 23, 42, 0.9); 
            border: 1px solid var(--border-color); 
            color: #fff; border-radius: 8px; outline: none; font-size: 13px; 
            transition: all 0.3s ease; font-weight: 400;
        }
        
        select option { background-color: #0f172a; color: #fff; padding: 10px; }
        input:focus, select:focus { border-color: #00f2fe; box-shadow: var(--glow); background: rgba(15, 23, 42, 1); }
        input::placeholder { color: rgba(255,255,255,0.3); }
        
        .cat-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .cat-group select { margin-bottom: 0; flex: 1; }
        .cat-group input { margin-bottom: 0; flex: 1; display: none; }
        .add-cat-btn { padding: 0 15px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; transition: all 0.3s; white-space: nowrap; }
        .add-cat-btn:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        button.add-btn { 
            width: 100%; padding: 14px; background: var(--primary-gradient); 
            color: #000; border: none; border-radius: 8px; cursor: pointer; 
            font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }
        button.add-btn:hover { box-shadow: var(--glow); transform: translateY(-2px); }

        .backup-controls { display: flex; gap: 10px; margin-top: 20px; border-top: 1px dashed var(--border-color); padding-top: 20px; }
        .backup-controls button { 
            flex: 1; padding: 10px; font-size: 12px; font-weight: 600; border-radius: 8px; 
            cursor: pointer; border: 1px solid transparent; transition: all 0.3s; 
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-backup { background: rgba(16, 185, 129, 0.1); color: #10b981; border-color: rgba(16, 185, 129, 0.3); }
        .btn-backup:hover { background: #10b981; color: #fff; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-restore { background: rgba(139, 92, 246, 0.1); color: #8b5cf6; border-color: rgba(139, 92, 246, 0.3); }
        .btn-restore:hover { background: #8b5cf6; color: #fff; box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }

        .channel-list-container { flex: 1; overflow-y: auto; padding: 20px; }
        
        .category-folder { 
            margin-bottom: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; 
            overflow: hidden; border: 1px solid var(--border-color); transition: all 0.3s ease; 
        }
        .category-header { 
            padding: 14px 18px; background: rgba(0,0,0,0.2); color: #fff; font-weight: 600; font-size: 14px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; 
            user-select: none; transition: background 0.2s; 
        }
        .category-header:hover { background: rgba(0,0,0,0.4); }
        
        .cat-header-right { display: flex; align-items: center; gap: 12px; }
        .cat-count { font-size: 11px; background: rgba(255,255,255,0.1); padding: 3px 10px; border-radius: 20px; font-weight: 500;}
        .del-folder-btn { background: transparent; border: none; color: #f43f5e; font-size: 15px; cursor: pointer; transition: 0.2s; opacity: 0.6; }
        .del-folder-btn:hover { opacity: 1; transform: scale(1.2); }

        .category-content { display: none; padding: 12px; background: rgba(0,0,0,0.1); }
        .category-content.open { display: block; animation: slideDown 0.3s ease; }

        .category-folder.drag-over { border-color: #00f2fe; box-shadow: var(--glow); background: rgba(0, 242, 254, 0.05); }

        .channel-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--bg-card); padding: 10px 12px; margin-bottom: 8px; 
            border-radius: 8px; transition: all 0.2s; border-left: 3px solid transparent; 
            cursor: grab; border: 1px solid rgba(255,255,255,0.02);
            gap: 8px; position: relative;
        }
        .channel-item:active { cursor: grabbing; transform: scale(0.98); }
        .channel-item:last-child { margin-bottom: 0; }
        .channel-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); }
        
        .channel-item.active { background: rgba(0, 242, 254, 0.1); border-left: 3px solid #00f2fe; border-color: rgba(0, 242, 254, 0.2); }
        .channel-item.active .channel-name { color: #00f2fe; }

        .channel-item.drag-over-item {
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.5);
            transform: scale(1.02);
            z-index: 2;
            background: rgba(0, 242, 254, 0.15);
        }
        
        .channel-info { 
            display: flex; align-items: center; gap: 8px; flex: 1; 
            min-width: 0; 
            overflow: hidden; 
        }
        .drag-handle { color: rgba(255,255,255,0.3); font-size: 15px; cursor: grab; flex-shrink: 0; padding-bottom: 2px;}
        
        .channel-name { 
            font-weight: 500; 
            font-size: 14px; 
            color: #e2e8f0; 
            white-space: nowrap; 
            letter-spacing: 0.1px;
            overflow: visible;
        }
        
        .channel-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .channel-actions button { border: none; border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 10px; font-weight: 700; text-transform: uppercase; transition: all 0.3s; color: white;}
        .list-play-btn { background: rgba(16, 185, 129, 0.8); }
        .list-play-btn:hover { background: #10b981; transform: translateY(-1px); }
        .edit-btn { background: var(--edit-gradient); box-shadow: 0 2px 10px rgba(59, 130, 246, 0.1); }
        .edit-btn:hover { box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); transform: translateY(-1px); }
        .delete-btn { background: var(--danger-gradient); box-shadow: 0 2px 10px rgba(244, 63, 94, 0.1); }
        .delete-btn:hover { box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); transform: translateY(-1px); }
        
        .player-section { 
            flex: 1; 
            padding: 25px 40px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            height: 100%; 
        }
        .player-section::before {
            content: ''; position: absolute; width: 60%; height: 60%; background: #00f2fe;
            filter: blur(150px); opacity: 0.05; z-index: 0; pointer-events: none;
        }
        
        .now-playing { 
            width: 100%;
            max-width: 900px; 
            margin-bottom: 15px; 
            font-size: 16px; 
            color: #fff; 
            text-align: center; 
            font-weight: 500; 
            z-index: 1; 
            background: rgba(255,255,255,0.05); 
            padding: 12px 30px; 
            border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.1);
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .now-playing span { color: #00f2fe; font-weight: 700; text-transform: uppercase; }

        .video-container { 
            width: 100%; 
            max-width: 900px; 
            aspect-ratio: 16/9; 
            height: auto;
            max-height: 65vh; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.08); 
            z-index: 1; 
            position: relative;
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            outline: none; 
            background: #000; 
            object-fit: fill; 
            display: block;
            border-radius: 8px;
        }

        .player-controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px; 
            margin-top: 20px;
            background: #151b2b; 
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 40px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 1;
        }

        .control-btns { display: flex; align-items: center; gap: 20px; }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ctrl-btn svg { width: 14px; height: 14px; fill: #00f2fe; transition: fill 0.3s; }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }

        .ctrl-btn.main-play {
            background: var(--primary-gradient);
            color: #000;
            padding: 10px 35px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }
        .ctrl-btn.main-play svg { fill: #000; }
        .ctrl-btn.main-play:hover { box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5); transform: scale(1.05); }
        
        @media (max-width: 1200px) {
            .sidebar { min-width: 440px; width: 440px; }
        }
        @media (max-width: 900px) {
            .main-container { flex-direction: column-reverse; overflow-y: auto; }
            .player-section { flex: none; height: auto; padding: 15px; }
            .sidebar { max-width: 100%; min-width: 100%; width: auto; border-right: none; border-top: 1px solid var(--border-color); flex: none; }
            .player-controls-bar { flex-direction: column; gap: 10px; border-radius: 20px; padding: 15px; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">⚡ HeroSalman1 Is Live</div>
        <span class="header-badge">LIVE TV CHANNEL</span>
    </div>

    <div class="main-container">
        
        <div class="sidebar">
            <div class="add-channel-box">
                <div class="add-channel-header" onclick="toggleAddForm()">
                    <h3><span>⚙️</span> Manage Channels</h3>
                    <span class="toggle-icon" id="formToggleIcon">▼</span>
                </div>
                
                <div id="addChannelForm">
                    <input type="text" id="chName" placeholder="Channel Name (e.g. StarPlus HD)">
                    <input type="url" id="chUrl" placeholder="M3U8 Stream URL">
                    
                    <div class="cat-group">
                        <select id="chCategory"></select>
                        <input type="text" id="newCategoryInput" placeholder="Enter custom category...">
                        <button class="add-cat-btn" id="catToggleBtn" onclick="toggleCatInput()">+ NEW CAT</button>
                    </div>

                    <button class="add-btn" onclick="saveChannel()">Save to Database</button>

                    <div class="backup-controls">
                        <button class="btn-backup" onclick="backupData()">💾 Backup DB</button>
                        <button class="btn-restore" onclick="document.getElementById('restoreFile').click()">📂 Restore DB</button>
                        <input type="file" id="restoreFile" style="display:none" accept=".json" onchange="restoreData(event)">
                    </div>
                </div>
            </div>
            
            <div class="channel-list-container" id="channelList">
                <div style="text-align:center; color:#64748b; margin-top:20px; font-size: 13px;">Initializing Secure Database...</div>
            </div>
        </div>

        <div class="player-section">
            
            <div class="now-playing" id="nowPlayingText">Ready to stream...</div>

            <div class="video-container">
                <video id="tvPlayer" controls autoplay></video>
            </div>
            
            <div class="player-controls-bar">
                <div class="control-btns">
                    <button class="ctrl-btn" onclick="playPrevChannel()">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg> Prev
                    </button>
                    
                    <button class="ctrl-btn main-play" id="pausePlayBtn" onclick="togglePausePlay()">
                        <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> <span id="playPauseText">Pause</span>
                    </button>
                    
                    <button class="ctrl-btn" onclick="playNextChannel()">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg> Next
                    </button>
                </div>
            </div>

        </div>

    </div>

    <script>
        const video = document.getElementById('tvPlayer');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const channelListEl = document.getElementById('channelList');
        const categorySelectEl = document.getElementById('chCategory');
        const newCategoryInputEl = document.getElementById('newCategoryInput');
        const catToggleBtn = document.getElementById('catToggleBtn');
        const addChannelForm = document.getElementById('addChannelForm');
        const formToggleIcon = document.getElementById('formToggleIcon');
        
        const pausePlayBtn = document.getElementById('pausePlayBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const playPauseText = document.getElementById('playPauseText');

        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";
        const playPath = "M8 5v14l11-7z";
        
        let hlsInstance = null;
        let isCustomCat = false; 
        let draggedItemIndex = null; 
        let currentPlayingIndex = -1; 
        
        let openFolders = new Set();
        
        const defaultCategories = ["NEWS", "MOVIES", "KIDS & CARTOON", "MUSIC", "SPORTS", "SERIAL EPISODE", "OTHER"];
        let savedCategories = [];
        let savedChannels = [];

        const DB_NAME = "HERO_LIVE_01";
        const STORE_NAME = "tvData";
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e);
            });
        }

        function getDBData(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function putDBData(key, value) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.put(value, key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // --- NEW: AUTO A-Z ALPHABETICAL SORT ENGINE ---
        function sortSavedChannels() {
            let playingChannel = currentPlayingIndex !== -1 ? savedChannels[currentPlayingIndex] : null;
            
            // Ye array ko automatically A to Z sort kar dega
            savedChannels.sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true, sensitivity: 'base' }));
            
            if (playingChannel) {
                currentPlayingIndex = savedChannels.indexOf(playingChannel);
            }
        }

        async function bootApp() {
            try {
                await initDB();
                
                let dbCats = await getDBData('categories');
                let dbChans = await getDBData('channels');

                if (!dbCats && localStorage.getItem('myTvCategories')) dbCats = JSON.parse(localStorage.getItem('myTvCategories'));
                if (!dbChans && localStorage.getItem('myTvChannels')) dbChans = JSON.parse(localStorage.getItem('myTvChannels'));

                savedCategories = dbCats || defaultCategories;
                if(!savedCategories.includes("OTHER")) savedCategories.push("OTHER");

                savedChannels = dbChans || [];
                savedChannels = savedChannels.map(ch => ch.category ? ch : { ...ch, category: "OTHER" });
                
                sortSavedChannels(); // Initial Sort

                renderCategoryDropdown();
                renderChannels();
            } catch (err) {
                console.error("Database init failed", err);
                channelListEl.innerHTML = '<div style="color:#f43f5e; text-align:center; font-size:13px;">Database Error. Please refresh.</div>';
            }
        }
        bootApp();

        function toggleAddForm() {
            if (addChannelForm.style.display === 'none' || addChannelForm.style.display === '') {
                addChannelForm.style.display = 'block';
                formToggleIcon.style.transform = 'rotate(180deg)';
            } else {
                addChannelForm.style.display = 'none';
                formToggleIcon.style.transform = 'rotate(0deg)';
            }
        }

        function renderCategoryDropdown() {
            categorySelectEl.innerHTML = '';
            savedCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                categorySelectEl.appendChild(opt);
            });
        }

        function toggleCatInput() {
            isCustomCat = !isCustomCat;
            if (isCustomCat) {
                categorySelectEl.style.display = 'none';
                newCategoryInputEl.style.display = 'block';
                newCategoryInputEl.focus();
                catToggleBtn.innerHTML = '✖ CANCEL';
                catToggleBtn.style.background = 'transparent';
                catToggleBtn.style.border = '1px solid #f43f5e';
                catToggleBtn.style.color = '#f43f5e';
            } else {
                categorySelectEl.style.display = 'block';
                newCategoryInputEl.style.display = 'none';
                newCategoryInputEl.value = '';
                catToggleBtn.innerHTML = '+ NEW CAT';
                catToggleBtn.style.background = 'rgba(255,255,255,0.05)';
                catToggleBtn.style.border = '1px solid rgba(255,255,255,0.08)';
                catToggleBtn.style.color = '#fff';
            }
        }

        async function saveChannel() {
            const name = document.getElementById('chName').value.trim();
            const url = document.getElementById('chUrl').value.trim();
            let finalCategory = "";

            if (!name || !url) {
                alert("Please provide both Channel Name and URL.");
                return;
            }

            const duplicateChannel = savedChannels.find(ch => ch.url === url);
            if (duplicateChannel) {
                alert(`${duplicateChannel.name} DUPLICATE URL PLEASE CHECK\n\nYeh URL pehle se hi "${duplicateChannel.name}" channel mein saved hai. Duplicate URL allow nahi hai.`);
                return;
            }

            if (isCustomCat) {
                const newCatValue = newCategoryInputEl.value.trim();
                if (!newCatValue) return alert("Please enter a category name!");
                finalCategory = newCatValue.toUpperCase();
                
                if(!savedCategories.includes(finalCategory)) {
                    savedCategories.push(finalCategory);
                    await putDBData('categories', savedCategories);
                    renderCategoryDropdown();
                }
                toggleCatInput();
                categorySelectEl.value = finalCategory;
            } else {
                finalCategory = categorySelectEl.value;
            }

            savedChannels.push({ name: name, url: url, category: finalCategory });
            
            sortSavedChannels(); // Auto Sort after saving
            
            await putDBData('channels', savedChannels);
            
            document.getElementById('chName').value = '';
            document.getElementById('chUrl').value = '';
            
            const catId = finalCategory.replace(/\s+/g, '-').toLowerCase();
            openFolders.add(catId); 
            
            renderChannels();
        }

        async function editChannel(originalIndex, event) {
            event.stopPropagation();
            const currentName = savedChannels[originalIndex].name;
            const newName = prompt("Edit Channel Name:", currentName);
            
            if (newName !== null && newName.trim() !== "") {
                savedChannels[originalIndex].name = newName.trim();
                
                sortSavedChannels(); // Resort A-Z after rename
                await putDBData('channels', savedChannels);
                
                if (currentPlayingIndex !== -1) {
                    nowPlayingText.innerHTML = `Now Playing: <span>${savedChannels[currentPlayingIndex].name}</span>`;
                }
                
                renderChannels();
            }
        }

        async function deleteChannel(originalIndex, event) {
            event.stopPropagation();
            if(confirm("Delete this channel permanently?")) {
                savedChannels.splice(originalIndex, 1);
                if(currentPlayingIndex === originalIndex) currentPlayingIndex = -1;
                await putDBData('channels', savedChannels);
                renderChannels();
            }
        }

        async function deleteCategory(catName, event) {
            event.stopPropagation();
            if(catName === "OTHER") return alert("System folder 'OTHER' cannot be deleted.");

            if(confirm(`Delete folder "${catName}"?\nAll channels inside will be moved to 'OTHER'.`)) {
                savedChannels = savedChannels.map(ch => ch.category === catName ? { ...ch, category: "OTHER" } : ch);
                savedCategories = savedCategories.filter(c => c !== catName);
                
                sortSavedChannels(); // Auto sort just in case
                await putDBData('channels', savedChannels);
                await putDBData('categories', savedCategories);

                renderCategoryDropdown();
                renderChannels();
            }
        }

        function dragStart(event, index) {
            draggedItemIndex = index;
            event.target.style.opacity = "0.4";
            event.dataTransfer.effectAllowed = 'move';
        }
        function dragEnd(event) { event.target.style.opacity = "1"; }
        function dragOver(event) { event.preventDefault(); event.currentTarget.classList.add('drag-over'); }
        function dragLeave(event) { event.currentTarget.classList.remove('drag-over'); }

        async function dropChannel(event, targetCategory) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');

            if (draggedItemIndex !== null) {
                if (savedChannels[draggedItemIndex].category !== targetCategory) {
                    savedChannels[draggedItemIndex].category = targetCategory;
                    
                    sortSavedChannels(); // Auto sort after changing folder
                    await putDBData('channels', savedChannels);
                    
                    const catId = targetCategory.replace(/\s+/g, '-').toLowerCase();
                    openFolders.add(catId);
                    
                    renderChannels();
                }
                draggedItemIndex = null;
            }
        }

        function dragOverItem(event) {
            event.preventDefault();
            event.stopPropagation(); 
            event.currentTarget.classList.add('drag-over-item');
        }

        function dragLeaveItem(event) {
            event.currentTarget.classList.remove('drag-over-item');
        }

        async function dropOnItem(event, targetIndex) {
            event.preventDefault();
            event.stopPropagation(); 
            event.currentTarget.classList.remove('drag-over-item');

            if (draggedItemIndex !== null && draggedItemIndex !== targetIndex) {
                const targetCategory = savedChannels[targetIndex].category;
                savedChannels[draggedItemIndex].category = targetCategory;
                
                sortSavedChannels(); // Auto A-Z sort replaces manual positioning
                
                await putDBData('channels', savedChannels);
                
                const catId = targetCategory.replace(/\s+/g, '-').toLowerCase();
                openFolders.add(catId);

                draggedItemIndex = null;
                renderChannels();
            }
        }

        function toggleFolder(catId) {
            const content = document.getElementById('folder-' + catId);
            const icon = document.getElementById('icon-' + catId);
            if(content.classList.contains('open')) {
                content.classList.remove('open');
                icon.innerText = '📁';
                openFolders.delete(catId);
            } else {
                content.classList.add('open');
                icon.innerText = '📂';
                openFolders.add(catId);
            }
        }

        function autoShrinkChannelNames() {
            const items = document.querySelectorAll('.channel-item');
            
            items.forEach(item => {
                const infoContainer = item.querySelector('.channel-info');
                const nameSpan = item.querySelector('.channel-name');
                const actions = item.querySelector('.channel-actions');
                
                if (!nameSpan || !infoContainer || !actions || item.clientWidth === 0) return;

                nameSpan.style.fontSize = '14px';
                void nameSpan.offsetWidth;

                const availableWidth = item.clientWidth - actions.offsetWidth - 32; 

                if (nameSpan.offsetWidth > availableWidth && availableWidth > 0) {
                    let currentFont = 14;
                    while (nameSpan.offsetWidth > availableWidth && currentFont > 8) {
                        currentFont -= 0.5;
                        nameSpan.style.fontSize = currentFont + 'px';
                    }
                }
            });
        }

        window.addEventListener('load', () => {
            if (document.fonts) {
                document.fonts.ready.then(() => {
                    setTimeout(autoShrinkChannelNames, 50);
                });
            } else {
                setTimeout(autoShrinkChannelNames, 200);
            }
        });
        
        window.addEventListener('resize', autoShrinkChannelNames);

        function renderChannels() {
            channelListEl.innerHTML = '';
            
            if (savedChannels.length === 0 && savedCategories.length === 1 && savedCategories[0] === "OTHER") {
                channelListEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:30px; font-size:13px; font-weight: 300;">Playlist is empty. Add a channel to start streaming.</div>';
                return;
            }

            const groupedChannels = {};
            savedCategories.forEach(cat => groupedChannels[cat] = []);
            
            savedChannels.forEach((ch, index) => {
                const cat = groupedChannels[ch.category] ? ch.category : "OTHER";
                groupedChannels[cat].push({ ...ch, originalIndex: index });
            });

            for(const cat in groupedChannels) {
                if(groupedChannels[cat].length === 0 && cat === "OTHER") continue; 

                const catId = cat.replace(/\s+/g, '-').toLowerCase();
                const isFolderOpen = openFolders.has(catId);
                
                const folder = document.createElement('div');
                folder.className = 'category-folder';
                
                folder.setAttribute('ondragover', 'dragOver(event)');
                folder.setAttribute('ondragleave', 'dragLeave(event)');
                folder.setAttribute('ondrop', `dropChannel(event, '${cat}')`);
                
                const deleteBtnHtml = cat !== "OTHER" ? `<button class="del-folder-btn" onclick="deleteCategory('${cat}', event)" title="Delete Folder">🗑️</button>` : '';

                folder.innerHTML = `
                    <div class="category-header" onclick="toggleFolder('${catId}')">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <span id="icon-${catId}" style="font-size:16px;">${isFolderOpen ? '📂' : '📁'}</span> ${cat}
                        </span>
                        <div class="cat-header-right">
                            <span class="cat-count">${groupedChannels[cat].length}</span>
                            ${deleteBtnHtml}
                        </div>
                    </div>
                    <div class="category-content ${isFolderOpen ? 'open' : ''}" id="folder-${catId}"></div>
                `;
                channelListEl.appendChild(folder);

                const contentEl = folder.querySelector('.category-content');

                groupedChannels[cat].forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.setAttribute('data-index', ch.originalIndex); 
                    if (ch.originalIndex === currentPlayingIndex) item.classList.add('active');
                    
                    item.setAttribute('draggable', 'true');
                    item.setAttribute('ondragstart', `dragStart(event, ${ch.originalIndex})`);
                    item.setAttribute('ondragend', `dragEnd(event)`);
                    item.setAttribute('ondragover', `dragOverItem(event)`);
                    item.setAttribute('ondragleave', `dragLeaveItem(event)`);
                    item.setAttribute('ondrop', `dropOnItem(event, ${ch.originalIndex})`);

                    item.innerHTML = `
                        <div class="channel-info" title="${ch.name}">
                            <span class="drag-handle">⠿</span>
                            <span class="channel-name">📺 ${ch.name}</span>
                        </div>
                        <div class="channel-actions">
                            <button class="list-play-btn play-btn" onclick="playChannelByIndex(${ch.originalIndex}, event)">PLAY</button>
                            <button class="edit-btn" onclick="editChannel(${ch.originalIndex}, event)">EDIT</button>
                            <button class="delete-btn" onclick="deleteChannel(${ch.originalIndex}, event)">DEL</button>
                        </div>
                    `;
                    contentEl.appendChild(item);
                });
            }

            requestAnimationFrame(() => {
                setTimeout(autoShrinkChannelNames, 50);
            });
        }

        function playChannelByIndex(index, event) {
            if(event) event.stopPropagation();
            if(index < 0 || index >= savedChannels.length) return;
            
            currentPlayingIndex = index;
            const ch = savedChannels[index];
            
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.channel-item[data-index="${index}"]`);
            if(activeItem) activeItem.classList.add('active');
            
            const catId = ch.category.replace(/\s+/g, '-').toLowerCase();
            const folderContent = document.getElementById('folder-' + catId);
            const folderIcon = document.getElementById('icon-' + catId);
            if (folderContent && !folderContent.classList.contains('open')) {
                folderContent.classList.add('open');
                folderIcon.innerText = '📂';
                openFolders.add(catId);
            }

            playStream(ch.url, ch.name);
        }

        function playStream(url, name) {
            nowPlayingText.innerHTML = `Now Playing: <span>${name}</span>`;

            if (hlsInstance) hlsInstance.destroy();

            if (Hls.isSupported() && url.includes('.m3u8')) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(e => console.log("Auto-play blocked."));
                    setPauseIcon();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                    setPauseIcon();
                });
            } else {
                nowPlayingText.innerHTML = `<span style="color:#f43f5e;">Error: Format not supported.</span>`;
            }
        }

        function setPauseIcon() {
            playPauseIcon.querySelector('path').setAttribute('d', pausePath);
            playPauseText.innerText = "Pause";
        }

        function setPlayIcon() {
            playPauseIcon.querySelector('path').setAttribute('d', playPath);
            playPauseText.innerText = "Play";
        }

        function togglePausePlay() {
            if (savedChannels.length === 0) return;
            if (currentPlayingIndex === -1) {
                playChannelByIndex(0);
                return;
            }

            if (video.paused) {
                video.play();
                setPauseIcon();
            } else {
                video.pause();
                setPlayIcon();
            }
        }

        function playNextChannel() {
            if (savedChannels.length === 0) return;
            let nextIndex = currentPlayingIndex + 1;
            if (nextIndex >= savedChannels.length) nextIndex = 0; 
            playChannelByIndex(nextIndex);
        }

        function playPrevChannel() {
            if (savedChannels.length === 0) return;
            let prevIndex = currentPlayingIndex - 1;
            if (prevIndex < 0) prevIndex = savedChannels.length - 1; 
            playChannelByIndex(prevIndex);
        }

        async function backupData() {
            try {
                const data = {
                    categories: savedCategories,
                    channels: savedChannels
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "HERO_LIVE_01.JSON";
                a.click();
            } catch(e) {
                alert("Backup creation failed.");
            }
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.categories && Array.isArray(data.channels)) {
                        savedCategories = data.categories;
                        savedChannels = data.channels;
                        currentPlayingIndex = -1;
                        
                        sortSavedChannels(); // Auto sort restored data
                        
                        await putDBData('categories', savedCategories);
                        await putDBData('channels', savedChannels);
                        
                        renderCategoryDropdown();
                        renderChannels();
                        alert("Database Restored Successfully!");
                    } else {
                        alert("Invalid HERO_LIVE_01.JSON file format.");
                    }
                } catch (err) {
                    alert("Error reading file.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }
    </script>
