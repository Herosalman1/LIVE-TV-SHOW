<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>HeroSalman1 Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.youtube.com/iframe_api" async></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg-main: #07090e;
            --bg-sidebar: #0e131f;
            --bg-card: #151b2b;
            --accent-red: #e50914;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --text-main: #ffffff;
            --text-muted: #8c939d;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        /* ⚡ HIDE SCROLLBARS COMPLETELY */
        ::-webkit-scrollbar { display: none; width: 0; height: 0; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .header { 
            background: rgba(7, 9, 14, 0.95); 
            backdrop-filter: blur(20px);
            padding: 15px 25px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 100;
        }
        .header-brand { display: flex; align-items: center; font-size: 18px; font-weight: 700; color: #fff; }
        .header-brand i.fa-tv { margin-right: 12px; color: var(--accent-red); font-size: 20px; filter: drop-shadow(0 0 6px var(--accent-glow)); }
        .header-brand i.fa-bolt { margin-left: 12px; color: var(--accent-red); font-size: 20px; filter: drop-shadow(0 0 6px var(--accent-glow)); }
        
        .live-badge {
            display: flex; align-items: center; gap: 8px;
            background: rgba(229, 9, 20, 0.15); border: 1px solid rgba(229, 9, 20, 0.4);
            padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #ff4d4f; text-transform: uppercase;
        }
        .live-dot {
            margin-right: 8px;
            width: 7px; height: 7px; background: var(--accent-red); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red); animation: pulseLive 1.5s infinite;
        }
        @keyframes pulseLive {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(229, 9, 20, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
        }

        .main-container { display: flex; flex-direction: column; width: 100%; max-width: 1200px; margin: 0 auto; padding: 4px; gap: 10px; }
        
        .player-section { width: 100%; display: flex; flex-direction: column; align-items: center; order: 1; margin-bottom: 12px; }
        
        .now-playing { 
            width: 100%; max-width: 900px; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); 
            text-align: center; font-weight: 500; background: var(--bg-card); padding: 8px 12px; 
            border-radius: 8px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center;
        }
        .now-playing i { margin-right: 8px; }
        .now-playing span { color: #fff; font-weight: 600; text-transform: uppercase; margin-left: 8px; }

        .video-container { 
            width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; border-radius: 8px; 
            overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.6); border: 1px solid var(--border-color); 
            position: relative; touch-action: none;
        }

        .video-container:-webkit-full-screen { max-width: 100% !important; max-height: 100% !important; width: 100vw !important; height: 100vh !important; border-radius: 0 !important; margin: 0 !important; }
        .video-container:-moz-full-screen { max-width: 100% !important; max-height: 100% !important; width: 100vw !important; height: 100vh !important; border-radius: 0 !important; margin: 0 !important; }
        .video-container:-ms-fullscreen { max-width: 100% !important; max-height: 100% !important; width: 100vw !important; height: 100vh !important; border-radius: 0 !important; margin: 0 !important; }
        .video-container:fullscreen { max-width: 100% !important; max-height: 100% !important; width: 100vw !important; height: 100vh !important; border-radius: 0 !important; margin: 0 !important; }
        .video-container.mobile-pseudo-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            max-height: 100dvh !important;
            border-radius: 0 !important;
            margin: 0 !important;
            z-index: 9990 !important;
            background: #000 !important;
        }
        .video-container:fullscreen .yt-player-frame,
        .video-container:-webkit-full-screen .yt-player-frame,
        .video-container:-moz-full-screen .yt-player-frame,
        .video-container.mobile-pseudo-fullscreen .yt-player-frame,
        .video-container:-ms-fullscreen .yt-player-frame {
            width: 100% !important;
            height: 100% !important;
        }
        .video-container:fullscreen .yt-player-frame > div,
        .video-container:fullscreen .yt-player-frame iframe,
        .video-container:-webkit-full-screen .yt-player-frame > div,
        .video-container.mobile-pseudo-fullscreen > div,
        .video-container.mobile-pseudo-fullscreen iframe,
        .video-container:-webkit-full-screen .yt-player-frame iframe {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
        }
        
        video { width: 100%; height: 100%; outline: none; background: #000; object-fit: fill; display: block; pointer-events: none; }
        video::-webkit-media-controls { display: none !important; }
        video::-webkit-media-controls-enclosure { display: none !important; }
        .yt-player-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            display: none;
            z-index: 5;
            pointer-events: none;
        }
        .yt-player-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }

        /* ⚡ VIP POPUP TIMER, PLEASE WAIT & ERROR CENTERED */
        .stream-timer { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: transparent; color: #ffffff; text-align: center; 
            font-weight: 500; font-size: 14px; z-index: 50; display: none; 
            letter-spacing: 2px; font-family: 'Poppins', sans-serif; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.9); 
            white-space: nowrap; 
        }
        .error-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; color: #ff4d4f; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            z-index: 60; font-size: 24px; font-weight: 800; letter-spacing: 1px; 
            font-family: 'Poppins', sans-serif; text-align: center; padding: 20px;
        }
        .error-overlay i { font-size: 55px; margin-bottom: 15px; text-shadow: 0 0 15px rgba(229, 9, 20, 0.5); }

        .touch-catcher { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }

        /* ⚡ END OF VIDEO CENTER ACTION OVERLAY (⏮ ↺ ⏭ - CLEAN TRANSPARENT PNG-STYLE ICONS) */
        .end-screen-overlay {
            position: absolute;
            inset: 0;
            background: #000000;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 44px;
            z-index: 35;
            pointer-events: auto;
        }
        .end-screen-overlay.show {
            display: flex;
            animation: fadeInEndOverlay 0.2s ease;
        }
        @keyframes fadeInEndOverlay {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .end-action-btn {
            background: transparent !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.95));
            transition: transform 0.18s ease, filter 0.18s ease, color 0.18s ease;
        }
        .end-action-btn:hover,
        .end-action-btn:focus-visible {
            transform: scale(1.16);
            color: #ff2a3c;
            filter: drop-shadow(0 0 16px rgba(229, 9, 20, 0.85)) drop-shadow(0 4px 14px rgba(0, 0, 0, 0.95));
        }
        .end-action-btn:active {
            transform: scale(0.94);
        }
        .end-action-btn svg {
            width: 44px;
            height: 44px;
            display: block;
            fill: currentColor;
        }
        .end-action-btn.replay-btn svg {
            width: 54px;
            height: 54px;
        }
        @media (min-width: 900px) {
            .end-screen-overlay {
                gap: 64px;
            }
            .end-action-btn svg {
                width: 56px;
                height: 56px;
            }
            .end-action-btn.replay-btn svg {
                width: 68px;
                height: 68px;
            }
        }

        .custom-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; justify-content: space-between; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 20; }
        .custom-overlay.show { opacity: 1; pointer-events: none; }
        .overlay-center { display: flex; justify-content: center; align-items: center; flex: 1; pointer-events: none; }
        .overlay-btn { background: transparent; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.8)); pointer-events: auto; }
        .overlay-btn:active { transform: scale(0.9); color: #e50914; }
        .play-pause-btn { font-size: 60px; }
        .overlay-bottom { padding: 25px 30px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); pointer-events: auto; width: 100%; box-sizing: border-box; }
        .progress-container { width: 100%; display: flex; align-items: center; margin-bottom: 8px; }
        .seek-bar { -webkit-appearance: none; width: 100%; height: 5px; background: rgba(255,255,255,0.3); border-radius: 5px; outline: none; cursor: pointer; }
        .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .time-volume-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .time-text { color: #fff; font-size: 15px; font-weight: 500; font-family: 'Inter', sans-serif; letter-spacing: 0.5px;}
        .vol-btn { background: transparent; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 5px;}

        .player-controls-bar { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 900px; margin-top: 8px; background: var(--bg-card); border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; }
        .ctrl-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #fff; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: 1; margin: 0 6px; transition: 0.2s; white-space: nowrap; height: 38px; }
        .ctrl-btn i { margin: 0 8px; }
        .ctrl-btn.main-play { background: var(--accent-red); border-color: var(--accent-red); padding: 9px 16px; box-shadow: 0 3px 10px var(--accent-glow); flex: 1.2; }

        .sidebar { width: max-content; min-width: min(100%, 640px); max-width: min(100%, 700px); margin: 0 auto; background: var(--bg-sidebar); border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 45vh; overflow: hidden; order: 2; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .sidebar-tabs { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; border-bottom: 1px solid rgba(255, 255, 255, 0.14); background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.32)); margin-bottom: 4px; }
        .sidebar-tab { flex: 1; padding: 12px 6px; font-size: 11.5px; font-weight: 600; color: var(--text-muted); background: transparent; border: none; border-right: 1px solid rgba(255, 255, 255, 0.14); border-bottom: 2.5px solid transparent; cursor: pointer; transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease; font-family: 'Poppins', sans-serif; text-transform: uppercase; white-space: nowrap; letter-spacing: 0.4px; }
        .sidebar-tab:last-child { border-right: none; }
        .sidebar-tab:hover:not(.active) { color: #e2e8f0; background: rgba(255, 255, 255, 0.05); }
        .sidebar-tab.active { color: #fff; border-bottom: 2.5px solid var(--accent-red); background: linear-gradient(180deg, rgba(229, 9, 20, 0.18) 0%, rgba(229, 9, 20, 0.08) 100%); box-shadow: inset 0 -10px 18px -12px rgba(229, 9, 20, 0.75); }
        .sidebar-tab i { color: var(--accent-red); margin-right: 7px; }
        
        .channel-list-container { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 6px 18px 6px; -webkit-overflow-scrolling: touch; }
        .category-folder { margin-bottom: 6px; background: var(--bg-card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .category-header { padding: 10px 10px; background: rgba(0,0,0,0.15); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        .cat-count { font-size: 10px; background: rgba(229, 9, 20, 0.15); color: #ff4d4f; padding: 2px 6px; border-radius: 8px; font-weight: 600; border: 1px solid rgba(229, 9, 20, 0.3); }
        .category-content { display: none; padding: 3px; background: rgba(0,0,0,0.2); }
        .category-content.open { display: block; }
        .channel-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 8px 6px; margin-bottom: 4px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; gap: 5px; width: 100%; }
        .channel-item.active { background: rgba(229, 9, 20, 0.12); border-left: 3px solid var(--accent-red); border-color: rgba(229, 9, 20, 0.3); }
        .channel-item.active .channel-name { color: #fff; font-weight: 600; }
        .channel-name { font-weight: 500; font-size: 11.5px; color: var(--text-muted); flex: 1; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; min-width: 0; }
        .channel-name i { color: var(--accent-red); margin-right: 5px; }

        /* ⚡ ALIGNED RIGHT-SIDE BADGE + PLAY BUTTON */
        .item-right-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .ott-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.4px;
            line-height: 1;
            padding: 3.5px 5.5px;
            border-radius: 4px;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .badge-live {
            background: linear-gradient(135deg, #e50914 0%, #ff2a3c 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 2px 8px rgba(229, 9, 20, 0.55);
        }
        .badge-live::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffffff;
            margin-right: 4px;
            animation: pulseLive 1.4s infinite;
        }
        /* ⚡ UNIFORM SLATE COLOR MATCHING ADMIN PANEL (#5b687c) */
        .badge-offline {
            background: #5b687c;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        .play-btn { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--border-color); padding: 4px 7px; border-radius: 4px; font-size: 8.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; }


        /* ⚡ REAL SEARCH BOX LOOK AT THE BOTTOM */
        .search-folder-trigger {
            margin-top: 10px;
            margin-bottom: 14px;
            background: #080b12;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            padding: 9px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            cursor: text;
            color: #94a3b8;
            font-family: 'Inter', 'Poppins', sans-serif;
            font-weight: 400;
            font-size: 11px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.65), 0 2px 8px rgba(0, 0, 0, 0.35);
            transition: 0.2s ease;
            width: 100%;
            min-width: 0;
        }
        .search-folder-trigger-left {
            display: flex;
            align-items: center;
            min-width: 0;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-folder-trigger:hover, .search-folder-trigger:focus {
            border-color: rgba(255, 255, 255, 0.38);
            background: #0b101b;
            outline: none;
        }
        .search-folder-trigger-left i {
            color: #cbd5e1;
            margin-right: 9px;
            font-size: 12px;
            flex-shrink: 0;
        }
        .search-trigger-right-cue {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            color: #94a3b8;
            padding-left: 8px;
            border-left: 1px solid rgba(255, 255, 255, 0.12);
        }
        .search-trigger-right-cue i {
            margin: 0;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .search-trigger-right-cue i:hover {
            color: #ffffff;
        }

        .global-search-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #0e131f;
            align-items: stretch;
            justify-content: stretch;
            padding: 0;
        }
        .global-search-modal.open {
            display: flex;
        }
        .global-search-box {
            width: 100vw;
            max-width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-height: 100dvh;
            background: #0e131f;
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .global-search-header {
            padding: 10px 12px;
            background: #151b2b;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .global-search-title {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .global-search-title i {
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .global-search-close {
            background: #21262d;
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .global-search-close:hover {
            background: #30363d;
        }
        .global-search-input-wrap {
            padding: 10px 12px;
            background: #090d16;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .global-search-input {
            width: 100%;
            background: #151b2b;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 10px 13px;
            color: #ffffff;
            font-family: 'Inter', 'Poppins', sans-serif;
            font-size: 11px;
            font-weight: 400;
            outline: none;
        }
        .global-search-input::placeholder {
            color: #94a3b8;
            opacity: 1;
        }
        .global-search-input:focus {
            border-color: rgba(255, 255, 255, 0.24);
            box-shadow: none;
        }
        .global-search-meta {
            padding: 6px 12px;
            font-size: 10.5px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .global-search-results {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px 10px;
            -webkit-overflow-scrolling: touch;
        }
        .search-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151b2b;
            border: 1px solid var(--border-color);
            padding: 8px 8px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            gap: 6px;
            transition: 0.15s ease;
        }
        .search-result-item:hover {
            border-color: rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.04);
        }
        .search-result-title {
            font-size: 12px;
            font-weight: 500;
            color: #ffffff;
            flex: 0 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .search-result-title i {
            color: var(--accent-red);
            margin-right: 6px;
        }
        @media (min-width: 900px) {
            .search-folder-trigger { padding: 11px 16px; font-size: 12px; font-weight: 400; border-radius: 999px; }
            .global-search-modal { padding: 0; }
            .global-search-box { width: 100vw; max-width: 100vw; height: 100vh; height: 100dvh; max-height: 100dvh; border-radius: 0; border: none; }
            .global-search-header { padding: 14px 18px; gap: 10px; }
            .global-search-title { font-size: 16px; gap: 8px; letter-spacing: 0.5px; }
            .global-search-close { padding: 7px 14px; font-size: 11px; gap: 6px; border-radius: 7px; }
            .global-search-input-wrap { padding: 12px 18px; gap: 10px; }
            .global-search-input { font-size: 12px; padding: 11px 16px; }
            .global-search-meta { padding: 7px 18px; font-size: 11px; }
            .global-search-results { padding: 10px 18px; }
            .search-result-item { padding: 10px 12px; margin-bottom: 7px; gap: 8px; }
            .search-result-title { font-size: 14px; }
            .search-result-title i { margin-right: 7px; }
        }



        /* ⚡ STYLISH ARROW FROM ARCHIVE UPLOADER INSIDE SEARCH BOX */
        .stylish-arrow {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            min-width: 56px;
            position: relative;
            pointer-events: none;
            user-select: none;
        }
        .arrow-track {
            flex: 1;
            height: 3px;
            background: rgba(56, 189, 248, 0.24);
            border-radius: 999px;
            position: relative;
            overflow: hidden;
        }
        .arrow-track::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d4ff, #00ea77);
            border-radius: 999px;
            box-shadow: 0 0 10px rgba(0, 234, 119, 0.85);
            animation: pushRightFill 1.8s ease-in-out infinite;
        }
        .stylish-arrow::after {
            content: '➤';
            color: #00ea77;
            font-size: 17px;
            line-height: 1;
            margin-left: -2px;
            text-shadow: 0 0 12px rgba(0, 234, 119, 0.95);
            animation: arrowTipMove 1.8s ease-in-out infinite;
        }
        @keyframes pushRightFill {
            0% { left: 0%; width: 0%; opacity: 1; }
            70% { left: 0%; width: 100%; opacity: 1; }
            100% { left: 100%; width: 0%; opacity: 0.4; }
        }
        @keyframes arrowTipMove {
            0%, 60% { transform: translateX(0); }
            75% { transform: translateX(4px); }
            100% { transform: translateX(0); }
        }
        @media (max-width: 480px) {
            .stylish-arrow {
                flex: 0 0 48px;
                min-width: 44px;
            }
        }


        .search-row-arrow {
            flex: 1 1 auto;
            min-width: 48px;
            max-width: none;
            margin: 0 10px;
        }
        @media (min-width: 900px) {
            .search-row-arrow .stylish-arrow::after,
            .stylish-arrow.search-row-arrow::after {
                font-size: 19px;
            }
        }


        .search-input-box-shell {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        .search-input-box-shell .global-search-input {
            padding-right: 42px;
        }
        .voice-search-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            height: auto;
            padding: 4px 6px;
            border-radius: 0;
            border: none;
            background: transparent;
            color: #94a3b8;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            transition: color 0.2s ease;
        }
        .voice-search-btn:hover {
            background: transparent;
            border: none;
            color: #ffffff;
            transform: translateY(-50%);
        }
        .voice-search-btn.listening {
            background: transparent;
            border: none;
            color: #ff4d4f;
            transform: translateY(-50%);
            animation: none;
        }

        @media (min-width: 900px) {
            .header { padding: 15px 35px; }
            .header-brand { font-size: 20px; }
            .header-brand i.fa-tv { font-size: 22px; }
            .header-brand i.fa-bolt { font-size: 20px; }
            .main-container { max-width: 1500px; height: calc(100vh - 75px); flex-direction: row; overflow: hidden; padding: 25px; }
            .sidebar { margin: 0 30px 0 0; width: max-content; min-width: 550px; max-width: 700px; max-height: 100%; height: 100%; order: 1; border-radius: 14px; }
            .sidebar-tabs .sidebar-tab { font-size: 14px; padding: 15px 0; }
            .channel-list-container { padding: 16px 12px 22px 12px; }
            .category-folder { border-radius: 10px; margin-bottom: 10px; }
            .category-header { padding: 14px 18px; font-size: 15px; }
            .channel-item { padding: 12px 14px; margin-bottom: 8px; border-radius: 8px; gap: 10px; }
            .channel-name { font-size: 14px; }
            .channel-name i { margin-right: 8px; }
            .item-right-actions { gap: 8px; }
            .ott-badge { font-size: 9.5px; padding: 5px 8px; letter-spacing: 0.8px; }
            .play-btn { padding: 6px 14px; border-radius: 6px; font-size: 11px; }
            .player-section { flex: 1; height: 100%; justify-content: center; order: 2; margin-bottom: 0; }
            .video-container { max-width: 900px; max-height: 65vh; border-radius: 12px; }
            .now-playing, .player-controls-bar { max-width: 900px; border-radius: 12px; padding: 12px 20px; }
            .now-playing { font-size: 14px; margin-bottom: 12px; }
            .player-controls-bar { margin-top: 12px; }
            .ctrl-btn { padding: 10px 18px; font-size: 12px; height: 42px; margin: 0 8px; }
            .ctrl-btn.main-play { padding: 10px 26px; }
            .play-pause-btn { font-size: 60px; }
            .time-text { font-size: 14px; }
            .vol-btn { font-size: 20px; }
            .stream-timer { font-size: 18px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <i class="fa-solid fa-tv"></i> HeroSalman1 Is Live <i class="fa-solid fa-bolt"></i>
        </div>
        <div class="live-badge">
            <span class="live-dot"></span> LIVE
        </div>
    </div>

    <div class="main-container">
        
        <div class="player-section">
            <div class="now-playing" id="nowPlayingText">
                <i class="fa-solid fa-circle-play" style="color: var(--accent-red);"></i> Select a channel to stream...
            </div>
            
            <div class="video-container" id="videoContainer">
                <video id="tvPlayer" autoplay playsinline></video>
                <div id="ytPlayerHost" class="yt-player-frame"></div>
                <div class="stream-timer" id="popTimer"></div>
                <div class="error-overlay" id="popError">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>STREAM ERROR 404 ...</span>
                </div>
                <div class="touch-catcher" id="touchCatcher"></div>
                <div class="end-screen-overlay" id="endScreenOverlay" onclick="event.stopPropagation();">
                    <button type="button" class="end-action-btn" id="endPrevBtn" title="Previous Video" aria-label="Previous Video" onclick="handleEndPrev(event)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2.5v12H6V6zm4.5 6 8.5 6V6l-8.5 6z"/></svg>
                    </button>
                    <button type="button" class="end-action-btn replay-btn" id="endReplayBtn" title="Replay Video" aria-label="Replay Video" onclick="handleEndReplay(event)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    </button>
                    <button type="button" class="end-action-btn" id="endNextBtn" title="Next Video" aria-label="Next Video" onclick="handleEndNext(event)">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18l8.5-6L5 6v12zm10.5-12v12H18V6h-2.5z"/></svg>
                    </button>
                </div>

                <div class="custom-overlay" id="customOverlay">
                    <div style="flex:0.2;"></div>
                    <div class="overlay-center">
                        <button class="overlay-btn play-pause-btn" onclick="togglePausePlay(event)" id="overlayPlayBtn">
                            <i class="fa-solid fa-pause"></i>
                        </button>
                    </div>
                    <div class="overlay-bottom" onclick="event.stopPropagation();">
                        <div class="progress-container">
                            <input type="range" class="seek-bar" id="overlaySeekBar" value="0" step="0.1">
                        </div>
                        <div class="time-volume-row">
                            <span class="time-text" id="overlayTime">0:00 / 0:00</span>
                            <div>
                                <button class="vol-btn" onclick="toggleMute(event)" id="overlayMuteBtn"><i class="fa-solid fa-volume-high"></i></button>
                                <button class="vol-btn" onclick="toggleFullScreen(event)" style="margin-left:15px;"><i class="fa-solid fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="player-controls-bar">
                <button class="ctrl-btn" onclick="playPrevChannel()"><i class="fa-solid fa-backward-step"></i> Prev</button>
                <button class="ctrl-btn main-play" onclick="togglePausePlay()" id="playPauseBtn"><i class="fa-solid fa-pause" id="playPauseIcon"></i> <span id="playPauseText">Pause</span></button>
                <button class="ctrl-btn" onclick="playNextChannel()">Next <i class="fa-solid fa-forward-step"></i></button>
                <button class="ctrl-btn" onclick="toggleFullScreen()"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" id="tabLive" onclick="switchView('live')"><i class="fa-solid fa-tv"></i> Live TV</button>
                <button class="sidebar-tab" id="tabOffline" onclick="switchView('offline')"><i class="fa-solid fa-film"></i> Offline Stream</button>
                <button class="sidebar-tab" id="tabTrending" onclick="switchView('trending')"><i class="fa-solid fa-music"></i> Trending Song</button>
            </div>
            <div class="channel-list-container" id="channelList">
                <div style="text-align:center; color:var(--text-muted); padding:30px; font-size: 13px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px; margin-bottom: 8px; display: block; color: var(--accent-red);"></i> Loading Channels...
                </div>
            </div>
        </div>

    </div>

    <!-- ⚡ FULLSCREEN GLOBAL SEARCH MODAL -->
    <div class="global-search-modal" id="globalSearchModal" onclick="if(event.target===this) closeGlobalSearch()">
        <div class="global-search-box">
            <div class="global-search-header">
                <div class="global-search-title">
                    <i class="fa-solid fa-magnifying-glass"></i> SEARCH ALL TYPE'S CHANNEL
                </div>
                <button type="button" class="global-search-close" onclick="closeGlobalSearch()">
                    <i class="fa-solid fa-xmark"></i> CLOSED
                </button>
            </div>
            <div class="global-search-input-wrap">
                <div class="search-input-box-shell">
                    <input type="text" id="globalSearchInput" class="global-search-input" placeholder="जो आपको देखना है वो यहा इस Box में लिखे धन्यवाद !!" oninput="renderGlobalSearchResults()" autocomplete="off">
                    <button type="button" id="voiceSearchBtn" class="voice-search-btn" title="Bolkar Search Karein" aria-label="Voice Search" onclick="toggleVoiceSearch()">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </div>
            </div>
            <div class="global-search-meta" id="globalSearchMetaBar">
                <span id="globalSearchCount"></span>
                <span>Live TV + Offline Stream + Trending Song</span>
            </div>
            <div class="global-search-results" id="globalSearchResults"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('tvPlayer');
        const ytPlayerHost = document.getElementById('ytPlayerHost');
        let ytApiPlayer = null;
        let ytApiReady = Boolean(window.YT && window.YT.Player);
        let pendingYouTubePlay = null;
        let isYouTubeActive = false;
        let isYouTubePaused = false;
        let isYouTubeEnded = false;
        let ytProgressTimer = null;

        function startYouTubeProgressTimer() {
            clearInterval(ytProgressTimer);
            ytProgressTimer = setInterval(() => {
                if (isYouTubeActive && ytApiPlayer) {
                    updateProgressUI();
                }
            }, 500);
        }

        function stopYouTubeProgressTimer() {
            clearInterval(ytProgressTimer);
            ytProgressTimer = null;
        }

        window.onYouTubeIframeAPIReady = function() {
            ytApiReady = true;
            if (pendingYouTubePlay && isYouTubeActive) {
                const { ytId, url } = pendingYouTubePlay;
                pendingYouTubePlay = null;
                mountYouTubePlayer(ytId, url);
            }
        };

        function extractYouTubeId(url) {
            if (!url) return null;
            const patterns = [
                /(?:youtube\.com\/watch\?(?:.*&)?v=)([a-zA-Z0-9_-]{11})/i,
                /(?:youtu\.be\/)([a-zA-Z0-9_-]{11})/i,
                /(?:youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/i,
                /(?:youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/i,
                /(?:youtube\.com\/live\/)([a-zA-Z0-9_-]{11})/i
            ];
            for (const p of patterns) {
                const m = url.match(p);
                if (m && m[1]) return m[1];
            }
            return null;
        }

        function disableYouTubeCaptions(player) {
            if (!player) return;
            try { player.unloadModule('captions'); } catch (e) {}
            try { player.unloadModule('cc'); } catch (e) {}
        }

        function mountYouTubePlayer(ytId, originalUrl) {
            if (!ytPlayerHost) return;
            if (ytApiPlayer) {
                try { ytApiPlayer.destroy(); } catch (e) {}
                ytApiPlayer = null;
            }
            ytPlayerHost.innerHTML = '';
            ytPlayerHost.style.display = 'block';

            const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';

            if (window.YT && window.YT.Player && isHttp) {
                const innerDiv = document.createElement('div');
                innerDiv.id = 'ytPlayerInner_' + Date.now();
                innerDiv.style.width = '100%';
                innerDiv.style.height = '100%';
                ytPlayerHost.appendChild(innerDiv);

                const pVars = {
                    autoplay: 1,
                    rel: 0,
                    playsinline: 1,
                    iv_load_policy: 3,
                    fs: 1,
                    controls: 0,
                    disablekb: 1,
                    origin: window.location.origin
                };

                ytApiPlayer = new YT.Player(innerDiv.id, {
                    width: '100%',
                    height: '100%',
                    videoId: ytId,
                    host: 'https://www.youtube.com',
                    playerVars: pVars,
                    events: {
                        onReady: function(e) {
                            if (!isYouTubeActive) return;
                            try {
                                const ifr = e.target.getIframe();
                                if (ifr) ifr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
                            } catch (err) {}
                            disableYouTubeCaptions(e.target);
                            startYouTubeProgressTimer();
                            try { e.target.playVideo(); } catch (err) {}
                        },
                        onApiChange: function(e) {
                            disableYouTubeCaptions(e.target);
                        },
                        onStateChange: function(e) {
                            if (!isYouTubeActive) return;
                            if (e.data === 0) {
                                // Video Ended -> Solid black screen with ⏮ ↺ ⏭ buttons
                                isYouTubeEnded = true;
                                isYouTubePaused = true;
                                playPauseIcon.className = "fa-solid fa-play";
                                playPauseText.innerText = "Play";
                                overlayPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                                showEndScreenOverlay();
                            } else if (e.data === 1) {
                                isYouTubeEnded = false;
                                isYouTubePaused = false;
                                hideEndScreenOverlay();
                                disableYouTubeCaptions(e.target);
                                playPauseIcon.className = "fa-solid fa-pause";
                                playPauseText.innerText = "Pause";
                                overlayPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                                updateProgressUI();
                            } else if (e.data === 2) {
                                isYouTubePaused = true;
                                playPauseIcon.className = "fa-solid fa-play";
                                playPauseText.innerText = "Play";
                                overlayPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                            }
                        },
                        onError: function(e) {
                            if (!isYouTubeActive) return;
                            // Fallback to clean standard iframe if API player errors
                            if (ytApiPlayer) {
                                try { ytApiPlayer.destroy(); } catch (err) {}
                                ytApiPlayer = null;
                            }
                            ytPlayerHost.innerHTML = '';
                            const ifr = document.createElement('iframe');
                            ifr.referrerPolicy = 'strict-origin-when-cross-origin';
                            ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';
                            ifr.allowFullscreen = true;
                            ifr.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0&playsinline=1&iv_load_policy=3`;
                            ytPlayerHost.appendChild(ifr);
                        }
                    }
                });
            } else {
                // Clean direct iframe fallback (or if API still loading)
                const ifr = document.createElement('iframe');
                ifr.referrerPolicy = 'strict-origin-when-cross-origin';
                ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';
                ifr.allowFullscreen = true;
                ifr.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&playsinline=1&iv_load_policy=3`;
                ytPlayerHost.appendChild(ifr);

                if (isHttp && !ytApiReady) {
                    pendingYouTubePlay = { ytId, url: originalUrl };
                }
            }
        }

        function stopYouTubePlayer() {
            stopYouTubeProgressTimer();
            pendingYouTubePlay = null;
            isYouTubeActive = false;
            isYouTubePaused = false;
            isYouTubeEnded = false;
            if (ytApiPlayer) {
                try { ytApiPlayer.destroy(); } catch (e) {}
                ytApiPlayer = null;
            }
            if (ytPlayerHost) {
                ytPlayerHost.innerHTML = '';
                ytPlayerHost.style.display = 'none';
            }
            video.style.display = 'block';
            if (touchCatcher) touchCatcher.style.display = 'block';
        }
        const videoContainer = document.getElementById('videoContainer');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const channelListEl = document.getElementById('channelList');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const playPauseText = document.getElementById('playPauseText');
        
        const touchCatcher = document.getElementById('touchCatcher');
        const customOverlay = document.getElementById('customOverlay');
        const overlayPlayBtn = document.getElementById('overlayPlayBtn');
        const overlaySeekBar = document.getElementById('overlaySeekBar');
        const overlayTime = document.getElementById('overlayTime');
        const overlayMuteBtn = document.getElementById('overlayMuteBtn');
        const fullScreenBtn = document.getElementById('fullScreenBtn');
        const overlayBottom = document.getElementById('overlayBottom');
        
        const popTimer = document.getElementById('popTimer');
        const popError = document.getElementById('popError');
        const endScreenOverlay = document.getElementById('endScreenOverlay');

        function showEndScreenOverlay() {
            hideOverlay();
            if (endScreenOverlay) endScreenOverlay.classList.add('show');
        }

        function hideEndScreenOverlay() {
            if (endScreenOverlay) endScreenOverlay.classList.remove('show');
        }

        function getCategoryNeighbors() {
            if (savedChannels.length === 0 || currentPlayingIndex === -1) {
                return { prevIndex: -1, nextIndex: -1 };
            }
            const currentCh = savedChannels[currentPlayingIndex];
            const currentType = currentCh.streamType || 'live';
            const currentCategory = currentCh.category || "OTHER";

            const sameCatIndices = [];
            savedChannels.forEach((ch, idx) => {
                if ((ch.streamType || 'live') === currentType && (ch.category || "OTHER") === currentCategory) {
                    sameCatIndices.push(idx);
                }
            });

            if (sameCatIndices.length <= 1) {
                const prevAll = currentPlayingIndex - 1 < 0 ? savedChannels.length - 1 : currentPlayingIndex - 1;
                const nextAll = currentPlayingIndex + 1 >= savedChannels.length ? 0 : currentPlayingIndex + 1;
                return { prevIndex: prevAll, nextIndex: nextAll };
            }

            const pos = sameCatIndices.indexOf(currentPlayingIndex);
            const prevIndex = sameCatIndices[(pos - 1 + sameCatIndices.length) % sameCatIndices.length];
            const nextIndex = sameCatIndices[(pos + 1) % sameCatIndices.length];
            return { prevIndex, nextIndex };
        }

        function handleEndPrev(event) {
            if (event) event.stopPropagation();
            hideEndScreenOverlay();
            const { prevIndex } = getCategoryNeighbors();
            if (prevIndex !== -1) playChannelByIndex(prevIndex);
            else playPrevChannel();
        }

        function handleEndReplay(event) {
            if (event) event.stopPropagation();
            hideEndScreenOverlay();
            if (currentPlayingIndex !== -1 && savedChannels[currentPlayingIndex]) {
                if (isYouTubeActive) {
                    isYouTubeEnded = false;
                    isYouTubePaused = false;
                    playPauseIcon.className = "fa-solid fa-pause";
                    playPauseText.innerText = "Pause";
                    if (ytApiPlayer && typeof ytApiPlayer.seekTo === 'function') {
                        ytApiPlayer.seekTo(0, true);
                        ytApiPlayer.playVideo();
                    } else {
                        playChannelByIndex(currentPlayingIndex);
                    }
                    return;
                }
                video.currentTime = 0;
                updateProgressUI();
                video.play().catch(() => {
                    playChannelByIndex(currentPlayingIndex);
                });
            }
        }

        function handleEndNext(event) {
            if (event) event.stopPropagation();
            hideEndScreenOverlay();
            const { nextIndex } = getCategoryNeighbors();
            if (nextIndex !== -1) playChannelByIndex(nextIndex);
            else playNextChannel();
        }

        let pTime = null;
        let urlProbeController = null;
        let currentStreamToken = 0;
        let hlsInstance = null;
        let savedChannels = [];
        let currentPlayingIndex = -1;
        let overlayTimer; 
        let currentView = 'live'; 

        function getBadgeClass(badge) {
            return badge === "LIVE" ? "badge-live" : "badge-offline";
        }

        function getEffectiveBadge(ch) {
            if ((ch.streamType || 'live') === 'live') return "LIVE";
            if (ch.badge) return ch.badge;
            if (ch.isNew) return "NEW";
            return "";
        }

        // ⚡ 20 SEC TIMER -> THEN "⏱ Please Wait .." UNTIL VIDEO PLAYS (NO FALSE HEAD 404)
        function startPTimer() {
            clearInterval(pTime);
            currentStreamToken++;
            const token = currentStreamToken;

            if(popError) popError.style.display = 'none';
            let tl = 20;
            if(popTimer) {
                popTimer.innerHTML = '⏱ TIMER : ' + tl + ' SEC';
                popTimer.style.display = 'block';
            }

            pTime = setInterval(() => {
                if (token !== currentStreamToken) { clearInterval(pTime); return; }
                tl--;
                if(tl > 0) { 
                    if(popTimer) popTimer.innerHTML = '⏱ TIMER : ' + tl + ' SEC'; 
                } else { 
                    clearInterval(pTime); 
                    if(popTimer) {
                        popTimer.innerHTML = '⏱ Please Wait ..';
                        popTimer.style.display = 'block';
                    }
                }
            }, 1000);
        }

        let activePlayUrl = '';
        let hlsRetryCount = 0;

        function clearAllPopups() {
            clearInterval(pTime);
            if (urlProbeController) { urlProbeController.abort(); urlProbeController = null; }
            if (popTimer) popTimer.style.display = 'none';
            if (popError) popError.style.display = 'none';
        }

        function triggerError() {
            if (!activePlayUrl) return;
            clearInterval(pTime);
            if (urlProbeController) { urlProbeController.abort(); urlProbeController = null; }
            if (popTimer) popTimer.style.display = 'none';
            if (popError) popError.style.display = 'flex';
        }

        });

        async function loadChannelsData() {
            const RAW_JSON_URL = 'https://raw.githubusercontent.com/Herosalman1/LIVE-TV-SHOW/main/tools.json?t=' + Date.now();
            const API_JSON_URL = 'https://api.github.com/repos/Herosalman1/LIVE-TV-SHOW/contents/tools.json';
            const isLocalFile = window.location.protocol === 'file:';

            const sources = isLocalFile
                ? [RAW_JSON_URL, API_JSON_URL]
                : ['tools.json?t=' + Date.now(), RAW_JSON_URL, API_JSON_URL];

            for (const src of sources) {
                try {
                    const res = await fetch(src, { cache: 'no-store' });
                    if (!res.ok) continue;
                    const payload = await res.json();
                    let parsed = payload;
                    if (payload && typeof payload.content === 'string') {
                        parsed = JSON.parse(decodeURIComponent(escape(atob(payload.content.replace(/\n/g, '')))));
                    }
                    if (Array.isArray(parsed)) {
                        savedChannels = parsed;
                        try { localStorage.setItem('tv_cached_channels', JSON.stringify(parsed)); } catch (e) {}
                        renderChannels();
                        return;
                    }
                } catch (e) {
                    // Try next fallback source
                }
            }

            // Offline fallback from localStorage cache if network unavailable
            try {
                const cached = JSON.parse(localStorage.getItem('tv_cached_channels') || 'null');
                if (Array.isArray(cached) && cached.length > 0) {
                    savedChannels = cached;
                    renderChannels();
                    return;
                }
            } catch (e) {}

            channelListEl.innerHTML = '<div style="color:#ff4d4f; text-align:center; padding:30px;"><i class="fa-solid fa-triangle-exclamation"></i> Error loading channels! Please check internet or tools.json file.</div>';
        }

        loadChannelsData();

            currentView = type;
            document.getElementById('tabLive').className = type === 'live' ? 'sidebar-tab active' : 'sidebar-tab';
            document.getElementById('tabOffline').className = type === 'offline' ? 'sidebar-tab active' : 'sidebar-tab';
            document.getElementById('tabTrending').className = type === 'trending' ? 'sidebar-tab active' : 'sidebar-tab';
            renderChannels();
        }

        function toggleFolder(catId) {

        function renderChannels() {
            channelListEl.innerHTML = '';
            const categories = [];
            const viewChannels = savedChannels.filter(ch => (ch.streamType || 'live') === currentView);

            viewChannels.forEach(ch => {
                const cat = ch.category || "OTHER";
                if (!categories.includes(cat)) categories.push(cat);
            });

            if (categories.length === 0) {
                channelListEl.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px; font-size: 13px;">No ${currentView === 'live' ? 'Live TV' : (currentView === 'trending' ? 'Trending Song' : 'Offline Stream')} Channels Found.</div>`;
                const searchTrigger = document.createElement('div');
                searchTrigger.className = 'search-folder-trigger';
                searchTrigger.onclick = () => openGlobalSearch();
                searchTrigger.innerHTML = `
                    <span class="search-folder-trigger-left"><i class="fa-solid fa-magnifying-glass"></i> जो आपको देखना है वो यहा इस Box में लिखे धन्यवाद !!</span>
                    <span class="search-trigger-right-cue" onclick="event.stopPropagation(); openGlobalSearch(true);" title="Bolkar Search Karein"><i class="fa-solid fa-microphone"></i></span>
                `;
                channelListEl.appendChild(searchTrigger);
                return;
            }

            function getYearRank(str) {
                const m = String(str || '').match(/(19\d{2}|20\d{2})/);
                return m ? parseInt(m[1], 10) : null;
            }

            categories.forEach(cat => {
                const channelsInCat = viewChannels
                    .map((ch) => ({...ch, originalIndex: savedChannels.indexOf(ch)}))
                    .filter(c => (c.category || "OTHER") === cat)
                    .sort((a, b) => {
                        const aPin = (typeof a.pinOrder === 'number' && a.pinOrder > 0) ? a.pinOrder : Infinity;
                        const bPin = (typeof b.pinOrder === 'number' && b.pinOrder > 0) ? b.pinOrder : Infinity;
                        if (aPin !== bPin) return aPin - bPin;

                        const yrA = getYearRank(a.name);
                        const yrB = getYearRank(b.name);
                        if (yrA !== null && yrB !== null && yrA !== yrB) {
                            return yrA - yrB;
                        }
                        if (yrA !== null && yrB === null) return -1;
                        if (yrA === null && yrB !== null) return 1;

                        return a.name.localeCompare(b.name, 'en', { numeric: true, sensitivity: 'base' });
                    });

                if(channelsInCat.length === 0) return;

                const catId = cat.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase() + '-' + currentView;
                
                const folder = document.createElement('div');
                folder.className = 'category-folder';
                
                folder.innerHTML = `
                    <div class="category-header" onclick="toggleFolder('${catId}')">
                        <span><i class="fa-solid fa-folder" id="icon-${catId}" style="margin-right:8px; color:#e50914;"></i> ${cat}</span>
                        <span class="cat-count">${channelsInCat.length}</span>
                    </div>
                    <div class="category-content" id="folder-${catId}"></div>
                `;
                channelListEl.appendChild(folder);

                const contentEl = folder.querySelector('.category-content');
                channelsInCat.forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.setAttribute('data-index', ch.originalIndex);
                    item.onclick = () => playChannelByIndex(ch.originalIndex);

                    const effBadge = getEffectiveBadge(ch);
                    const badgeHTML = effBadge ? `<span class="ott-badge ${getBadgeClass(effBadge)}">${effBadge}</span>` : '';

                    item.innerHTML = `
                        <div class="channel-name" title="${ch.name}"><i class="fa-solid ${currentView === 'trending' ? 'fa-music' : 'fa-tv'}"></i> ${ch.name}</div>
                        <div class="item-right-actions">
                            ${badgeHTML}
                            <button class="play-btn">PLAY</button>
                        </div>
                    `;
                    contentEl.appendChild(item);
                });
            });

            // ⚡ BOTTOM TRIGGER RIGHT BELOW LAST FOLDER (E.G. CRIME INVESTIGATION)
            const searchTrigger = document.createElement('div');
            searchTrigger.className = 'search-folder-trigger';
            searchTrigger.setAttribute('tabindex', '0');
            searchTrigger.onclick = () => openGlobalSearch();
            searchTrigger.onkeydown = (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openGlobalSearch();
                }
            };
            searchTrigger.innerHTML = `
                <span class="search-folder-trigger-left"><i class="fa-solid fa-magnifying-glass"></i> Search or enter web address...</span>
                <span class="search-trigger-right-cue" onclick="event.stopPropagation(); openGlobalSearch(true);" title="Bolkar Search Karein"><i class="fa-solid fa-microphone"></i></span>
            `;
            channelListEl.appendChild(searchTrigger);
        }


        // ⚡ GLOBAL FULLSCREEN SEARCH SYSTEM (EMPTY ON OPEN, INSTANT SINGLE-CHAR MATCH ON TYPE)
        function openGlobalSearch(startVoice = false) {
            const modal = document.getElementById('globalSearchModal');
            const input = document.getElementById('globalSearchInput');
            const resultsEl = document.getElementById('globalSearchResults');
            const countEl = document.getElementById('globalSearchCount');
            modal.classList.add('open');
            input.value = '';
            if (resultsEl) resultsEl.innerHTML = '';
            if (countEl) countEl.textContent = '';
            setTimeout(() => {
                input.focus();
                if (startVoice) toggleVoiceSearch();
            }, 50);
        }


        // ⚡ VOICE SEARCH (BOLKAR SEARCH KAREIN) INSIDE SEARCH BOX
        let speechRecognizer = null;
        let isVoiceListening = false;

        async function refreshMicPermissionState() {
            try {
                if (navigator.permissions && navigator.permissions.query) {
                    const status = await navigator.permissions.query({ name: 'microphone' });
                    if (status.state === 'granted') {
                        localStorage.setItem('tv_mic_perm', 'granted');
                    } else if (status.state === 'denied') {
                        localStorage.setItem('tv_mic_perm', 'denied');
                    }
                    return status.state;
                }
            } catch (e) {}
            return localStorage.getItem('tv_mic_perm') || 'prompt';
        }

        function ensureSpeechRecognizer() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;
            if (speechRecognizer) return speechRecognizer;

            const rec = new SpeechRecognition();
            rec.lang = 'en-IN';
            rec.interimResults = true;
            rec.maxAlternatives = 1;

            rec.onstart = function() {
                isVoiceListening = true;
                localStorage.setItem('tv_mic_perm', 'granted');
                const btn = document.getElementById('voiceSearchBtn');
                const countEl = document.getElementById('globalSearchCount');
                if (btn) btn.classList.add('listening');
                if (countEl) countEl.textContent = '🎤 Bolkar search karein...';
            };

            rec.onresult = function(event) {
                const input = document.getElementById('globalSearchInput');
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                const cleanText = transcript.trim();
                if (input) {
                    input.value = cleanText;
                    renderGlobalSearchResults();
                }
            };

            rec.onerror = function(event) {
                const countEl = document.getElementById('globalSearchCount');
                isVoiceListening = false;
                const btn = document.getElementById('voiceSearchBtn');
                if (btn) btn.classList.remove('listening');
                if (countEl && event.error !== 'aborted') {
                    if (event.error === 'not-allowed') {
                        localStorage.setItem('tv_mic_perm', 'denied');
                        countEl.textContent = 'Mic permission Allow karein (ya browser site settings mein Allow set karein)';
                    } else {
                        countEl.textContent = 'Aawaz samajh nahi aayi, dobara bolein';
                    }
                }
            };

            rec.onend = function() {
                isVoiceListening = false;
                const btn = document.getElementById('voiceSearchBtn');
                if (btn) btn.classList.remove('listening');
            };

            speechRecognizer = rec;
            return speechRecognizer;
        }

        function stopVoiceSearch() {
            isVoiceListening = false;
            const btn = document.getElementById('voiceSearchBtn');
            if (btn) btn.classList.remove('listening');
            if (speechRecognizer) {
                try { speechRecognizer.abort(); } catch (e) {}
            }
        }

        async function toggleVoiceSearch() {
            const countEl = document.getElementById('globalSearchCount');
            const rec = ensureSpeechRecognizer();

            if (!rec) {
                if (countEl) countEl.textContent = 'Voice search not supported on this browser';
                return;
            }

            if (isVoiceListening) {
                stopVoiceSearch();
                return;
            }

            await refreshMicPermissionState();

            try {
                rec.start();
            } catch (e) {
                try {
                    rec.stop();
                    setTimeout(() => {
                        try { rec.start(); } catch (err) { stopVoiceSearch(); }
                    }, 80);
                } catch (err2) {
                    stopVoiceSearch();
                }
            }
        }

        function closeGlobalSearch() {
            stopVoiceSearch();
            document.getElementById('globalSearchModal').classList.remove('open');
        }

        function openFolderFromGlobalSearch(catName, targetType) {
            const folderType = targetType || 'live';
            closeGlobalSearch();
            if (currentView !== folderType) {
                switchView(folderType);
            }
            const catId = (catName || "OTHER").replace(/[^a-zA-Z0-9]/g, '-').toLowerCase() + '-' + folderType;
            const folderContent = document.getElementById('folder-' + catId);
            const folderIcon = document.getElementById('icon-' + catId);
            if (folderContent) {
                folderContent.classList.add('open');
                if (folderIcon) folderIcon.className = "fa-solid fa-folder-open";
                const parentFolder = folderContent.closest('.category-folder');
                if (parentFolder) {
                    parentFolder.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function playItemFromGlobalSearch(index) {
            if (index < 0 || index >= savedChannels.length) return;
            const ch = savedChannels[index];
            const targetType = ch.streamType || 'live';
            closeGlobalSearch();
            if (currentView !== targetType) {
                switchView(targetType);
            }
            const catId = (ch.category || "OTHER").replace(/[^a-zA-Z0-9]/g, '-').toLowerCase() + '-' + targetType;
            const folderContent = document.getElementById('folder-' + catId);
            const folderIcon = document.getElementById('icon-' + catId);
            if (folderContent && !folderContent.classList.contains('open')) {
                folderContent.classList.add('open');
                if (folderIcon) folderIcon.className = "fa-solid fa-folder-open";
            }
            playChannelByIndex(index);
        }

        function renderGlobalSearchResults() {
            const resultsEl = document.getElementById('globalSearchResults');
            const countEl = document.getElementById('globalSearchCount');
            const rawQuery = (document.getElementById('globalSearchInput').value || '').trim().toLowerCase();

            resultsEl.innerHTML = '';
            if (!rawQuery) {
                countEl.textContent = '';
                return;
            }

            function extractYearFromName(nameStr) {
                const m = (nameStr || '').match(/\b(19\d{2}|20\d{2})\b/);
                return m ? parseInt(m[1], 10) : null;
            }

            function compareByYearThenName(nameA, nameB) {
                const yA = extractYearFromName(nameA);
                const yB = extractYearFromName(nameB);
                if (yA !== null && yB !== null && yA !== yB) {
                    return yA - yB;
                }
                if (yA !== null && yB === null) return -1;
                if (yA === null && yB !== null) return 1;
                return (nameA || '').localeCompare(nameB || '', 'en', { numeric: true, sensitivity: 'base' });
            }

            const folderMap = new Map();
            savedChannels.forEach(ch => {
                const catName = (ch.category || "OTHER").trim();
                const streamType = ch.streamType || 'live';
                const key = `${streamType}::${catName.toLowerCase()}`;
                if (!folderMap.has(key)) {
                    folderMap.set(key, {
                        catName,
                        streamType
                    });
                }
            });

            const folderMatches = Array.from(folderMap.values())
                .filter(f => f.catName.toLowerCase().includes(rawQuery))
                .sort((a, b) => compareByYearThenName(a.catName, b.catName));

            const itemMatches = savedChannels
                .map((ch, idx) => ({ ch, idx }))
                .filter(({ ch }) => (ch.name || '').toLowerCase().includes(rawQuery))
                .sort((a, b) => compareByYearThenName(a.ch.name, b.ch.name));

            const totalMatches = folderMatches.length + itemMatches.length;
            countEl.textContent = `${totalMatches} result${totalMatches === 1 ? '' : 's'} found`;

            if (totalMatches === 0) {
                resultsEl.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:40px 15px; font-size:13px;">No match found for "${document.getElementById('globalSearchInput').value}"</div>`;
                return;
            }

            folderMatches.forEach(f => {
                const isTrending = f.streamType === 'trending';
                const isOffline = f.streamType === 'offline';
                const badgeLabel = isTrending ? 'TRENDING' : (isOffline ? 'OFFLINE' : 'LIVE');
                const badgeClass = (isOffline || isTrending) ? 'badge-offline' : 'badge-live';

                const row = document.createElement('div');
                row.className = 'search-result-item';
                row.onclick = () => openFolderFromGlobalSearch(f.catName, f.streamType);
                row.innerHTML = `
                    <div class="search-result-title" title="${f.catName}"><i class="fa-solid fa-folder" style="color:#e50914;"></i>${f.catName}</div>
                    <span class="stylish-arrow search-row-arrow"><span class="arrow-track"></span></span>
                    <div class="item-right-actions">
                        <span class="ott-badge ${badgeClass}">${badgeLabel}</span>
                        <button type="button" class="play-btn">OPEN</button>
                    </div>
                `;
                resultsEl.appendChild(row);
            });

            itemMatches.forEach(({ ch, idx }) => {
                const st = ch.streamType || 'live';
                const effBadge = getEffectiveBadge(ch);
                const badgeHTML = effBadge ? `<span class="ott-badge ${getBadgeClass(effBadge)}">${effBadge}</span>` : '';
                const iconClass = st === 'trending' ? 'fa-music' : (st === 'offline' ? 'fa-film' : 'fa-tv');

                const row = document.createElement('div');
                row.className = 'search-result-item';
                row.onclick = () => playItemFromGlobalSearch(idx);
                row.innerHTML = `
                    <div class="search-result-title" title="${ch.name}"><i class="fa-solid ${iconClass}"></i>${ch.name}</div>
                    <span class="stylish-arrow search-row-arrow"><span class="arrow-track"></span></span>
                    <div class="item-right-actions">
                        ${badgeHTML}
                        <button type="button" class="play-btn">PLAY</button>
                    </div>
                `;
                resultsEl.appendChild(row);
            });
        }

            if (e.key === 'Escape') {

        function playChannelByIndex(index) {
            if(index < 0 || index >= savedChannels.length) return;
            currentPlayingIndex = index;
