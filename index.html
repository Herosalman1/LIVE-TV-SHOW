                                .time-volume-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
                                .time-text { color: #fff; font-size: 15px; font-weight: 500; font-family: 'Inter', sans-serif; letter-spacing: 0.5px;}
                                .vol-btn { background: transparent; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 5px;}
                                @media (min-width: 900px) { .stream-timer { font-size: 18px; letter-spacing: 3px; } }
                            </style>
                        </head>
                        <body>
                            <div class="video-container" id="videoContainer">
                                <video id="video" autoplay playsinline></video>
                                <div class="stream-timer" id="popTimer"></div>
                                <div class="error-overlay" id="popError">
                                    <i class="fa-solid fa-triangle-exclamation"></i>
                                    <span>STREAM ERROR 404 ...</span>
                                </div>
                                <div class="touch-catcher" id="touchCatcher"></div>
                                <div class="custom-overlay" id="customOverlay">
                                    <div style="flex:0.2;"></div>
                                    <div class="overlay-center">
                                        <button class="overlay-btn play-pause-btn" id="overlayPlayBtn"><i class="fa-solid fa-pause"></i></button>
                                    </div>
                                    <div class="overlay-bottom" id="overlayBottom">
                                        <div class="progress-container"><input type="range" class="seek-bar" id="overlaySeekBar" value="0" step="0.1" tabindex="0"></div>
                                        <div class="time-volume-row">
                                            <span class="time-text" id="overlayTime">0:00 / 0:00</span>
                                            <div>
                                                <button class="vol-btn" id="overlayMuteBtn"><i class="fa-solid fa-volume-high"></i></button>
                                                <button class="vol-btn" id="fullScreenBtn" style="margin-left:25px;"><i class="fa-solid fa-expand"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <script>
                                const video = document.getElementById('video'); 
                                const videoSrc = "${url}"; 
                                const videoContainer = document.getElementById('videoContainer');
                                const touchCatcher = document.getElementById('touchCatcher');
                                const customOverlay = document.getElementById('customOverlay');
                                const overlayPlayBtn = document.getElementById('overlayPlayBtn');
                                const overlaySeekBar = document.getElementById('overlaySeekBar');
                                const overlayTime = document.getElementById('overlayTime');
                                const overlayMuteBtn = document.getElementById('overlayMuteBtn');
                                const fullScreenBtn = document.getElementById('fullScreenBtn');
                                const overlayBottom = document.getElementById('overlayBottom');
                                
                                const popTimer = document.getElementById('popTimer');
                                const popError = document.getElementById('popError');
                                let pTime = null;
                                let urlProbeController = null;

                                function startPTimer() {
                                    clearInterval(pTime);
                                    if (urlProbeController) { urlProbeController.abort(); urlProbeController = null; }
                                    if(popError) popError.style.display = 'none';
                                    let tl = 20;
                                    if(popTimer) {
                                        popTimer.innerHTML = '⏱ TIMER : ' + tl + ' SEC';
                                        popTimer.style.display = 'block';
                                    }

                                    pTime = setInterval(() => {
                                        tl--;
                                        if(tl > 0) { 
                                            if(popTimer) popTimer.innerHTML = '⏱ TIMER : ' + tl + ' SEC'; 
                                        } else { 
                                            clearInterval(pTime); 
                                            if(popTimer) {
                                                popTimer.innerHTML = '⏱ Please Wait ..';
                                                popTimer.style.display = 'block';
                                            }
                                        }
                                    }, 1000);
                                }
                                function popErr() { clearInterval(pTime); if (urlProbeController) { urlProbeController.abort(); urlProbeController = null; } if(popTimer) popTimer.style.display = 'none'; if(popError) popError.style.display = 'flex'; }

                                startPTimer();

                                video.addEventListener('playing', () => { clearInterval(pTime); if (urlProbeController) { urlProbeController.abort(); urlProbeController = null; } if(popTimer) popTimer.style.display = 'none'; if(popError) popError.style.display = 'none'; });
                                video.addEventListener('error', () => { popErr(); });

                                let overlayTimer;
                                let lastClickTime = 0;
                                let seekInterval = null;
                                let holdMultiplier = 0;

                                if (window.Hls && Hls.isSupported()) { 
                                    var hls = new Hls(); hls.loadSource(videoSrc); hls.attachMedia(video); 
                                    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play().catch(e=>console.log(e)); }); 
                                    hls.on(Hls.Events.ERROR, function(e, data) {
                                        if(data.fatal) {
                                            switch(data.type) {
                                                case Hls.ErrorTypes.NETWORK_ERROR: hls.destroy(); popErr(); break;
                                                case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                                                default: hls.destroy(); popErr(); break;
                                            }
                                        }
                                    });
                                } else if (video.canPlayType('application/vnd.apple.mpegurl')) { 
                                    video.src = videoSrc; video.addEventListener('loadedmetadata', function() { video.play().catch(e=>console.log(e)); }); 
                                } else {
                                    video.src = videoSrc; video.play().catch(e=>popErr());
                                }

                                function formatTime(sec) {
                                    if (isNaN(sec) || sec === Infinity) return "LIVE";
                                    let h = Math.floor(sec / 3600); let m = Math.floor((sec % 3600) / 60); let s = Math.floor(sec % 60);
                                    if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
                                    return m + ':' + (s < 10 ? '0' : '') + s;
                                }

                                function updateProgressUI() {
                                    if (!video.duration || isNaN(video.duration)) return;
                                    if (video.duration === Infinity) { overlaySeekBar.value = 100; overlayTime.innerText = "LIVE"; } 
                                    else { overlaySeekBar.value = (video.currentTime / video.duration) * 100; overlayTime.innerText = formatTime(video.currentTime) + ' / ' + formatTime(video.duration); }
                                }

                                video.addEventListener('timeupdate', updateProgressUI);
                                video.addEventListener('seeking', updateProgressUI);

                                function safeSeek(seconds) {
                                    let newTime = video.currentTime + seconds;
                                    if (!isNaN(video.duration) && video.duration !== Infinity && video.duration > 0) {
                                        newTime = Math.min(newTime, video.duration);
                                    }
                                    video.currentTime = Math.max(0, newTime);
                                    updateProgressUI(); 
                                    showOverlay();
                                }

                                function showOverlay() { 
                                    customOverlay.classList.add('show'); 
                                    clearTimeout(overlayTimer);
                                    if (!video.paused) {
                                        overlayTimer = setTimeout(() => { hideOverlay(); }, 1000); 
                                    }
                                }
                                function hideOverlay() { customOverlay.classList.remove('show'); }

                                function togglePausePlay() { 
                                    if (video.paused) { video.play(); } 
                                    else { video.pause(); showOverlay(); } 
                                }

                                if ('mediaSession' in navigator) {
                                    try {
                                        navigator.mediaSession.setActionHandler('play', () => { video.play(); });
                                        navigator.mediaSession.setActionHandler('pause', () => { video.pause(); showOverlay(); });
                                    } catch (e) {}
                                }

                                overlayPlayBtn.addEventListener('click', function(e) { e.stopPropagation(); togglePausePlay(); });
                                video.addEventListener('play', () => {
            hideEndScreenOverlay(); overlayPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; });
                                video.addEventListener('pause', () => { overlayPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; });

                                touchCatcher.addEventListener('click', function(e) {
                                    const currentTime = new Date().getTime(); const tapDelay = currentTime - lastClickTime;
                                    if (tapDelay < 350 && tapDelay > 0) {
                                        const rect = touchCatcher.getBoundingClientRect(); const tapX = e.clientX - rect.left;
                                        if (tapX > rect.width / 2) { safeSeek(10); } else { safeSeek(-10); } 
                                        lastClickTime = 0; 
                                    } else {
                                        if (customOverlay.classList.contains('show')) { hideOverlay(); } else { showOverlay(); }
                                        lastClickTime = currentTime;
                                    }
                                });

                                overlaySeekBar.addEventListener('input', () => { if (video.duration && video.duration !== Infinity && !isNaN(video.duration)) { video.currentTime = (overlaySeekBar.value / 100) * video.duration; updateProgressUI(); } showOverlay(); });
                                document.getElementById('overlayBottom').addEventListener('click', function(e) { e.stopPropagation(); });
                                
                                overlayMuteBtn.addEventListener('click', function(e) { e.stopPropagation(); video.muted = !video.muted; if(video.muted) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>'; else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; showOverlay(); });

                                function toggleFullScreen() {
                                    const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                                    if (!isFullScreen) {
                                        if (videoContainer.requestFullscreen) { videoContainer.requestFullscreen().then(lockLandscape).catch(e=>console.log(e)); } 
                                        else if (videoContainer.webkitRequestFullscreen) { videoContainer.webkitRequestFullscreen(); lockLandscape(); } 
                                    } else {
                                        if (document.exitFullscreen) { document.exitFullscreen().then(unlockOrientation).catch(e=>console.log(e)); } 
                                        else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); unlockOrientation(); }
                                    }
                                    showOverlay();
                                }
                                fullScreenBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleFullScreen(); });

                                function lockLandscape() { if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(e=>console.log(e)); } }
                                function unlockOrientation() { if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); } }

                                document.addEventListener('keydown', function(event) {
                                    const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                                    if (isFullScreen) {
                                        if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
                                            event.preventDefault();
                                        }
                                        
                                        // ⚡ TV REMOTE & KEYBOARD PLAY/PAUSE (Space, MediaPlayPause, Enter, Select)
                                        const k = event.key || '';
                                        const c = event.code || '';
                                        const kc = event.keyCode || 0;
                                        if (c === 'Space' || k === ' ' || k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause' || k === 'Pause' || k === 'Enter' || k === 'Select' || kc === 179 || kc === 19 || kc === 13 || kc === 32) {
                                            event.preventDefault();
                                            event.stopPropagation();
                                            togglePausePlay();
                                            return;
                                        }
                                        
                                        // ⚡ VOLUME CONTROL: + / - / F2 / F3
                                        if (event.key === '+' || event.key === '=' || event.key === 'F3') {
                                            event.preventDefault();
                                            video.volume = Math.min(1, video.volume + 0.05);
                                            if (video.volume > 0) { video.muted = false; overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; }
                                            showOverlay();
                                            return;
                                        }
                                        if (event.key === '-' || event.key === '_' || event.key === 'F2') {
                                            event.preventDefault();
                                            video.volume = Math.max(0, video.volume - 0.05);
                                            if (video.volume === 0) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                                            showOverlay();
                                            return;
                                        }
                                        if (k === 'AudioVolumeMute' || k === 'VolumeMute' || kc === 173) {
                                            event.preventDefault();
                                            video.muted = !video.muted;
                                            if(video.muted) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                                            else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                                            showOverlay();
                                            return;
                                        }

                                        if ((event.key === 'ArrowRight' || event.key === 'ArrowLeft') && !event.repeat) {
                                            if (seekInterval) clearInterval(seekInterval);
                                            holdMultiplier = 0;
                                            
                                            const direction = event.key === 'ArrowRight' ? 1 : -1;
                                            safeSeek(10 * direction); 
                                            
                                            seekInterval = setInterval(() => { 
                                                holdMultiplier++;
                                                let skipAmount = 10;
                                                if (holdMultiplier > 4) skipAmount = 20; 
                                                if (holdMultiplier > 10) skipAmount = 30; 
                                                safeSeek(skipAmount * direction); 
                                            }, 150);
                                        }
                                    }
                                });

                                document.addEventListener('keyup', function(event) {
                                    const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                                    if (isFullScreen) {
                                        if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
                                            if (seekInterval) { clearInterval(seekInterval); seekInterval = null; }
                                            holdMultiplier = 0;
                                            event.preventDefault();
                                        }
                                    }
                                });

                                document.addEventListener('wheel', function(event) {
                                    const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                                    if (isFullScreen || videoContainer.contains(event.target)) {
                                        event.preventDefault(); let currentVolume = video.volume;
                                        if (event.deltaY < 0) { currentVolume = Math.min(1, currentVolume + 0.05); } else if (event.deltaY > 0) { currentVolume = Math.max(0, currentVolume - 0.05); }
                                        video.volume = currentVolume;
                                        if (currentVolume === 0) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>'; else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                                    }
                                }, { passive: false });
                            <\/script>
                        </body>
                        </html>`;
                        
                        playerWindow.document.open();
                        playerWindow.document.write(htmlContent);
                        playerWindow.document.close();
                    }, 200);
                }
                return;
            }

            nowPlayingText.innerHTML = `<i class="fa-solid fa-circle-play" style="color: var(--accent-red); margin-right: 8px;"></i> Now Playing: <span style="margin-left: 8px;">${name}</span>`;
            
            activePlayUrl = '';
            hlsRetryCount = 0;
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            video.pause();
            video.removeAttribute('src');
            video.load();
            
            activePlayUrl = url;
            startPTimer();

            const lowerUrl = url.toLowerCase();
            const isDirectFile = /\.(mp4|mkv|webm|mov|avi|mp3|aac|ogg)(\?|#|$)/i.test(lowerUrl);

            function startNativePlayback(fallbackToHls) {
                if (activePlayUrl !== url) return;
                const onNativeErr = () => {
                    video.removeEventListener('error', onNativeErr);
                    if (activePlayUrl !== url) return;
                    if (fallbackToHls && Hls.isSupported()) {
                        startHlsPlayback(false);
                    } else {
                        triggerError();
                    }
                };
                video.addEventListener('error', onNativeErr, { once: true });
                video.src = url;
                video.load();
                video.play().catch(e => {
                    if (e && (e.name === 'NotAllowedError' || e.name === 'AbortError')) return;
                });
            }

            function startHlsPlayback(fallbackToNative) {
                if (activePlayUrl !== url) return;
                if (!Hls.isSupported()) {
                    startNativePlayback(false);
                    return;
                }
                hlsInstance = new Hls({
                    xhrSetup: function (xhr) { xhr.withCredentials = false; },
                    manifestLoadingMaxRetry: 3,
                    levelLoadingMaxRetry: 3,
                    fragLoadingMaxRetry: 3
                });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (activePlayUrl !== url) return;
                    if (data.fatal) {
                        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            hlsInstance.recoverMediaError();
                            return;
                        }
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR && hlsRetryCount < 2) {
                            hlsRetryCount++;
                            hlsInstance.startLoad();
                            return;
                        }
                        hlsInstance.destroy();
                        hlsInstance = null;
                        if (fallbackToNative) {
                            startNativePlayback(false);
                        } else {
                            triggerError();
                        }
                    }
                });
            }

            if (isDirectFile) {
                startNativePlayback(false);
            } else if (lowerUrl.includes('.m3u8')) {
                startHlsPlayback(true);
            } else if (Hls.isSupported()) {
                // Extensionless IPTV / Live stream URLs: try HLS first, auto-fallback to direct video if needed
                startHlsPlayback(true);
            } else {
                startNativePlayback(false);
            }
        }

        // ==========================================
        // ⚡ INSTANT UI SYNC LOGIC
        // ==========================================
        
        function formatTime(sec) {
            if (isNaN(sec) || sec === Infinity) return "LIVE";
            let h = Math.floor(sec / 3600);
            let m = Math.floor((sec % 3600) / 60);
            let s = Math.floor(sec % 60);
            if (h > 0) return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateProgressUI() {
            if (isYouTubeActive && ytApiPlayer && typeof ytApiPlayer.getDuration === 'function') {
                const dur = ytApiPlayer.getDuration();
                const cur = ytApiPlayer.getCurrentTime();
                if (!dur || isNaN(dur) || dur <= 0) return;
                overlaySeekBar.value = (cur / dur) * 100;
                overlayTime.innerText = `${formatTime(cur)} / ${formatTime(dur)}`;
                return;
            }
            if (!video.duration || isNaN(video.duration)) return; 

            if (video.duration === Infinity) {
                overlaySeekBar.value = 100;
                overlayTime.innerText = "LIVE";
            } else {
                overlaySeekBar.value = (video.currentTime / video.duration) * 100;
                overlayTime.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            }
        }

        video.addEventListener('timeupdate', updateProgressUI);
        video.addEventListener('seeking', updateProgressUI);

        function safeSeek(seconds, event) {
            if(event) event.stopPropagation();
            hideEndScreenOverlay();

            if (isYouTubeActive && ytApiPlayer && typeof ytApiPlayer.getCurrentTime === 'function') {
                const dur = ytApiPlayer.getDuration() || 0;
                let newTime = (ytApiPlayer.getCurrentTime() || 0) + seconds;
                if (dur > 0) newTime = Math.min(newTime, dur);
                newTime = Math.max(0, newTime);
                try { ytApiPlayer.seekTo(newTime, true); } catch (e) {}
                updateProgressUI();
                showOverlay();
                return;
            }
            
            let newTime = video.currentTime + seconds;
            
            if (!isNaN(video.duration) && video.duration !== Infinity && video.duration > 0) {
                newTime = Math.min(newTime, video.duration);
            }
            video.currentTime = Math.max(0, newTime);
            
            updateProgressUI(); 
            showOverlay();
        }

        let lastClickTime = 0;

        function showOverlay() { 
            customOverlay.classList.add('show'); 
            clearTimeout(overlayTimer);
            const isPausedNow = isYouTubeActive ? isYouTubePaused : video.paused;
            if (!isPausedNow) {
                overlayTimer = setTimeout(() => { hideOverlay(); }, 1000); 
            }
        }
        function hideOverlay() { customOverlay.classList.remove('show'); }

        touchCatcher.addEventListener('click', function(e) {
            const currentTime = new Date().getTime();
            const tapDelay = currentTime - lastClickTime;

            if (tapDelay < 350 && tapDelay > 0) {
                const rect = touchCatcher.getBoundingClientRect();
                const tapX = e.clientX - rect.left;
                if (tapX > rect.width / 2) { safeSeek(10); } 
                else { safeSeek(-10); } 
                lastClickTime = 0; 
            } else {
                if (customOverlay.classList.contains('show')) { hideOverlay(); }
                else { showOverlay(); }
                lastClickTime = currentTime;
            }
        });

        overlaySeekBar.addEventListener('input', () => {
            if (isYouTubeActive && ytApiPlayer && typeof ytApiPlayer.getDuration === 'function') {
                const dur = ytApiPlayer.getDuration();
                if (dur && !isNaN(dur) && dur > 0) {
                    const seekSec = (overlaySeekBar.value / 100) * dur;
                    try { ytApiPlayer.seekTo(seekSec, true); } catch (e) {}
                    overlayTime.innerText = `${formatTime(seekSec)} / ${formatTime(dur)}`;
                }
                showOverlay();
                return;
            }
            if (video.duration && video.duration !== Infinity && !isNaN(video.duration)) {
                video.currentTime = (overlaySeekBar.value / 100) * video.duration;
                updateProgressUI(); 
            }
            showOverlay(); 
        });
        
        function toggleMute(event) {
            if(event) event.stopPropagation();
            if (isYouTubeActive && ytApiPlayer && typeof ytApiPlayer.isMuted === 'function') {
                if (ytApiPlayer.isMuted()) {
                    ytApiPlayer.unMute();
                    overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                } else {
                    ytApiPlayer.mute();
                    overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                }
                showOverlay();
                return;
            }
            video.muted = !video.muted;
            if(video.muted) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            showOverlay();
        }

        function togglePausePlay(event) {
            if(event) event.stopPropagation();
            if (savedChannels.length === 0 || currentPlayingIndex === -1) return;

            if (isYouTubeActive && ytApiPlayer) {
                if (isYouTubeEnded) {
                    hideEndScreenOverlay();
                    isYouTubeEnded = false;
                    isYouTubePaused = false;
                    try { ytApiPlayer.seekTo(0, true); ytApiPlayer.playVideo(); } catch (e) {}
                    playPauseIcon.className = "fa-solid fa-pause";
                    playPauseText.innerText = "Pause";
                    overlayPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                    showOverlay();
                    return;
                }
                if (isYouTubePaused) {
                    try { ytApiPlayer.playVideo(); } catch (e) {}
                    isYouTubePaused = false;
                    playPauseIcon.className = "fa-solid fa-pause";
                    playPauseText.innerText = "Pause";
                    overlayPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                    showOverlay();
                } else {
                    try { ytApiPlayer.pauseVideo(); } catch (e) {}
                    isYouTubePaused = true;
                    playPauseIcon.className = "fa-solid fa-play";
                    playPauseText.innerText = "Play";
                    overlayPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                    showOverlay();
                }
                return;
            }

            if (video.paused) { 
                video.play();
                showOverlay();
            } else { 
                video.pause(); 
                showOverlay(); 
            }
        }

        if ('mediaSession' in navigator) {
            try {
                navigator.mediaSession.setActionHandler('play', () => {
                    if (savedChannels.length > 0 && currentPlayingIndex !== -1) video.play();
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    if (savedChannels.length > 0 && currentPlayingIndex !== -1) {
                        video.pause();
                        showOverlay();
                    }
                });
            } catch (e) {}
        }

        video.addEventListener('play', () => {
            playPauseIcon.className = "fa-solid fa-pause";
            playPauseText.innerText = "Pause";
            overlayPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        });

        video.addEventListener('pause', () => {
            playPauseIcon.className = "fa-solid fa-play";
            playPauseText.innerText = "Play";
            overlayPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        });

        function playNextChannel() {
            if(savedChannels.length === 0) return;
            let nextIndex = currentPlayingIndex + 1;
            if (nextIndex >= savedChannels.length) nextIndex = 0; 
            playChannelByIndex(nextIndex);
        }

        function playPrevChannel() {
            if(savedChannels.length === 0) return;
            let prevIndex = currentPlayingIndex - 1;
            if (prevIndex < 0) prevIndex = savedChannels.length - 1; 
            playChannelByIndex(prevIndex);
        }

        let isMobilePseudoFullScreen = false;

        function enterMobilePseudoFS() {
            isMobilePseudoFullScreen = true;
            videoContainer.classList.add('mobile-pseudo-fullscreen');
            document.documentElement.style.overflow = 'hidden';
            document.body.style.overflow = 'hidden';
            lockLandscape();
            setTimeout(syncYouTubeFullscreenSize, 80);
            setTimeout(syncYouTubeFullscreenSize, 260);
        }

        function exitMobilePseudoFS() {
            isMobilePseudoFullScreen = false;
            videoContainer.classList.remove('mobile-pseudo-fullscreen');
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
            unlockOrientation();
            if (seekInterval) { clearInterval(seekInterval); seekInterval = null; }
            holdMultiplier = 0;
            hideOverlay();
            setTimeout(syncYouTubeFullscreenSize, 80);
        }

        function isAnyFullScreenActive() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.msFullscreenElement ||
                isMobilePseudoFullScreen
            );
        }

        function toggleFullScreen(event) {
            if(event) event.stopPropagation();

            if (!isAnyFullScreenActive()) {
                const reqFs = videoContainer.requestFullscreen || videoContainer.webkitRequestFullscreen || videoContainer.msRequestFullscreen;
                if (reqFs) {
                    try {
                        const promise = reqFs.call(videoContainer);
                        if (promise && typeof promise.then === 'function') {
                            promise.then(() => {
                                lockLandscape();
                                setTimeout(syncYouTubeFullscreenSize, 120);
                            }).catch(() => {
                                enterMobilePseudoFS();
                            });
                        } else {
                            lockLandscape();
                            setTimeout(() => {
                                const nativeFs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                                if (!nativeFs) enterMobilePseudoFS();
                                else syncYouTubeFullscreenSize();
                            }, 180);
                        }
                    } catch (e) {
                        enterMobilePseudoFS();
                    }
                } else {
                    enterMobilePseudoFS();
                }
            } else {
                if (isMobilePseudoFullScreen) {
                    exitMobilePseudoFS();
                }
                const exitFs = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
                if (exitFs && (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement)) {
                    try {
                        const p = exitFs.call(document);
                        if (p && typeof p.then === 'function') {
                            p.then(unlockOrientation).catch(e=>console.log(e));
                        } else {
                            unlockOrientation();
                        }
                    } catch (e) {}
                }
            }
            setTimeout(syncYouTubeFullscreenSize, 140);
            showOverlay();
        }

        function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(error) {
                    console.log('Orientation lock failed:', error);
                });
            }
        }

        function unlockOrientation() {
            if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); }
        }

        function syncYouTubeFullscreenSize() {
            if (!isYouTubeActive || !ytPlayerHost) return;
            const ifr = ytPlayerHost.querySelector('iframe');
            if (!ifr) return;
            const rect = videoContainer.getBoundingClientRect();
            const w = Math.max(1, Math.round(rect.width || window.innerWidth));
            const h = Math.max(1, Math.round(rect.height || window.innerHeight));
            ifr.style.width = '100%';
            ifr.style.height = '100%';
            ifr.setAttribute('width', String(w));
            ifr.setAttribute('height', String(h));
            if (ytApiPlayer && typeof ytApiPlayer.setSize === 'function') {
                try { ytApiPlayer.setSize(w, h); } catch (e) {}
            }
        }

        // ⚡ TV FULLSCREEN EXIT FIX: Reset intervals and restore focus to dashboard
        function handleFullScreenChange() {
            const nativeFs = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (nativeFs && isMobilePseudoFullScreen) {
                isMobilePseudoFullScreen = false;
                videoContainer.classList.remove('mobile-pseudo-fullscreen');
                document.documentElement.style.overflow = '';
                document.body.style.overflow = '';
            }
            const isFullScreen = Boolean(nativeFs || isMobilePseudoFullScreen);
            setTimeout(syncYouTubeFullscreenSize, 80);
            setTimeout(syncYouTubeFullscreenSize, 260);
            if (!isFullScreen) {
                unlockOrientation();
                if (seekInterval) { clearInterval(seekInterval); seekInterval = null; }
                holdMultiplier = 0;
                hideOverlay();
                if (document.activeElement && videoContainer.contains(document.activeElement)) {
                    document.activeElement.blur();
                }
                const activeItem = document.querySelector('.channel-item.active');
                if (activeItem) {
                    activeItem.setAttribute('tabindex', '0');
                    activeItem.focus();
                } else if (channelListEl) {
                    channelListEl.setAttribute('tabindex', '0');
                    channelListEl.focus();
                }
            }
        }

        document.addEventListener('fullscreenchange', handleFullScreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullScreenChange);
        document.addEventListener('msfullscreenchange', handleFullScreenChange);
        window.addEventListener('orientationchange', () => {
            if (isAnyFullScreenActive()) {
                setTimeout(syncYouTubeFullscreenSize, 150);
                setTimeout(syncYouTubeFullscreenSize, 400);
            }
        });
        window.addEventListener('resize', () => {
            if (isAnyFullScreenActive()) {
                syncYouTubeFullscreenSize();
            }
        });
        
        video.addEventListener('ended', function() {
            if (savedChannels.length === 0 || currentPlayingIndex === -1) return;
            showEndScreenOverlay();
        });

        // ==========================================
        // ⚡ TV / DESKTOP SETTINGS (Fullscreen Hold-to-Seek & Arrow Keys Only)
        // ==========================================
        let seekInterval = null;
        let holdMultiplier = 0;

        function checkIsActuallyFullScreen() {
            if (isMobilePseudoFullScreen) return true;
            const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (!fsEl) return false;
            const rect = videoContainer.getBoundingClientRect();
            return rect.width >= window.innerWidth - 5 && rect.height >= window.innerHeight - 5;
        }

        document.addEventListener('keydown', function(event) {
            if (checkIsActuallyFullScreen()) {
                if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
                    event.preventDefault(); 
                }
                
                // ⚡ TV REMOTE & KEYBOARD PLAY/PAUSE (Space, MediaPlayPause, Enter, Select)
                const k = event.key || '';
                const c = event.code || '';
                const kc = event.keyCode || 0;
                if (c === 'Space' || k === ' ' || k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause' || k === 'Pause' || k === 'Enter' || k === 'Select' || kc === 179 || kc === 19 || kc === 13 || kc === 32) {
                    event.preventDefault();
                    event.stopPropagation();
                    togglePausePlay();
                    return;
                }
                
                // ⚡ VOLUME CONTROL: + / - / F2 / F3
                if (event.key === '+' || event.key === '=' || event.key === 'F3') {
                    event.preventDefault();
                    if (isYouTubeActive && ytApiPlayer && typeof ytApiPlayer.getVolume === 'function') {
                        const nv = Math.min(100, (ytApiPlayer.getVolume() || 0) + 5);
                        ytApiPlayer.unMute();
                        ytApiPlayer.setVolume(nv);
                        overlayMuteBtn.innerHTML = nv === 0 ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
                    } else {
                        video.volume = Math.min(1, video.volume + 0.05);
                        if (video.volume > 0) { video.muted = false; overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; }
                    }
                    showOverlay();
                    return;
                }
                if (event.key === '-' || event.key === '_' || event.key === 'F2') {
                    event.preventDefault();
                    if (isYouTubeActive && ytApiPlayer && typeof ytApiPlayer.getVolume === 'function') {
                        const nv = Math.max(0, (ytApiPlayer.getVolume() || 0) - 5);
                        ytApiPlayer.setVolume(nv);
                        overlayMuteBtn.innerHTML = nv === 0 ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
                    } else {
                        video.volume = Math.max(0, video.volume - 0.05);
                        if (video.volume === 0) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                    }
                    showOverlay();
                    return;
                }
                if (k === 'AudioVolumeMute' || k === 'VolumeMute' || kc === 173) {
                    event.preventDefault();
                    toggleMute();
                    return;
                }

                if ((event.key === 'ArrowRight' || event.key === 'ArrowLeft') && !event.repeat) {
                    if (seekInterval) clearInterval(seekInterval);
                    holdMultiplier = 0;
                    
                    const direction = event.key === 'ArrowRight' ? 1 : -1;
                    safeSeek(10 * direction); 
                    
                    seekInterval = setInterval(() => { 
                        if (!checkIsActuallyFullScreen()) {
                            clearInterval(seekInterval);
                            seekInterval = null;
                            holdMultiplier = 0;
                            return;
                        }
                        holdMultiplier++;
                        let skipAmount = 10;
                        
                        if (holdMultiplier > 4) skipAmount = 20; 
                        if (holdMultiplier > 10) skipAmount = 30; 
                        
                        safeSeek(skipAmount * direction); 
                    }, 150);
                }
            } else {
                if (seekInterval) {
                    clearInterval(seekInterval);
                    seekInterval = null;
                    holdMultiplier = 0;
                }
            }
        });

        document.addEventListener('keyup', function(event) {
            if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
                if (seekInterval) { clearInterval(seekInterval); seekInterval = null; }
                holdMultiplier = 0;
                if (checkIsActuallyFullScreen()) {
                    event.preventDefault();
                }
            }
        });

        window.addEventListener('blur', function() {
            if (seekInterval) { clearInterval(seekInterval); seekInterval = null; }
            holdMultiplier = 0;
        });

        document.addEventListener('wheel', function(event) {
            if (checkIsActuallyFullScreen() || videoContainer.contains(event.target)) {
                event.preventDefault(); 
                if (isYouTubeActive && ytApiPlayer && typeof ytApiPlayer.getVolume === 'function') {
                    let v = ytApiPlayer.getVolume() || 0;
                    if (event.deltaY < 0) v = Math.min(100, v + 5);
                    else if (event.deltaY > 0) v = Math.max(0, v - 5);
                    if (v > 0) ytApiPlayer.unMute();
                    ytApiPlayer.setVolume(v);
                    overlayMuteBtn.innerHTML = v === 0 ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
                    return;
                }
                let currentVolume = video.volume;
                if (event.deltaY < 0) { currentVolume = Math.min(1, currentVolume + 0.05); } 
                else if (event.deltaY > 0) { currentVolume = Math.max(0, currentVolume - 0.05); }
                video.volume = currentVolume;
                
                if (currentVolume === 0) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        }, { passive: false }); 

    </script>
</body>
