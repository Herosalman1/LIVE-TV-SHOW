<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeroSalman1 Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg-main: #07090e;
            --bg-sidebar: #0e131f;
            --bg-card: #151b2b;
            --accent-red: #e50914;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --text-main: #ffffff;
            --text-muted: #8c939d;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #212b3d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #324158; }

        /* Professional Header */
        .header { 
            background: rgba(7, 9, 14, 0.95); 
            backdrop-filter: blur(20px);
            padding: 15px 30px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; top: 0; z-index: 100;
        }
        .header-brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        
        /* Red Glowing TV & Red Glowing Electric Icon */
        .header-brand i.fa-tv { 
            color: var(--accent-red); 
            font-size: 22px; 
            filter: drop-shadow(0 0 8px var(--accent-glow)); 
        }
        .header-brand i.fa-bolt { 
            color: var(--accent-red); 
            font-size: 20px; 
            filter: drop-shadow(0 0 8px var(--accent-glow)); 
            margin-left: 2px;
        }
        
        /* Professional Live Badge */
        .live-badge {
            display: flex; align-items: center; gap: 8px;
            background: rgba(229, 9, 20, 0.15); border: 1px solid rgba(229, 9, 20, 0.4);
            padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #ff4d4f; text-transform: uppercase; letter-spacing: 1px;
        }
        .live-dot {
            width: 8px; height: 8px; background: var(--accent-red); border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-red); animation: pulseLive 1.5s infinite;
        }
        @keyframes pulseLive {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(229, 9, 20, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
        }

        .main-container { display: flex; flex-direction: column; width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px; gap: 20px; }
        
        .player-section { width: 100%; display: flex; flex-direction: column; align-items: center; order: 1; }
        
        .now-playing { 
            width: 100%; max-width: 900px; margin-bottom: 12px; font-size: 14px; color: var(--text-muted); 
            text-align: center; font-weight: 500; background: var(--bg-card); padding: 12px 20px; 
            border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .now-playing span { color: #fff; font-weight: 600; text-transform: uppercase; }

        .video-container { width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 1px solid var(--border-color); }
        video { width: 100%; height: 100%; outline: none; background: #000; object-fit: fill; display: block;}

        .player-controls-bar { display: flex; justify-content: center; width: 100%; max-width: 900px; margin-top: 12px; background: var(--bg-card); border: 1px solid var(--border-color); padding: 12px 20px; border-radius: 12px; }
        .ctrl-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #fff; padding: 8px 22px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin: 0 6px; transition: 0.2s; }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255,255,255,0.2); }
        .ctrl-btn.main-play { background: var(--accent-red); border-color: var(--accent-red); padding: 8px 30px; box-shadow: 0 4px 15px var(--accent-glow); }
        .ctrl-btn.main-play:hover { background: #f40612; }

        /* Professional Sidebar & Folders */
        .sidebar { width: 100%; background: var(--bg-sidebar); border-radius: 14px; border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 45vh; overflow: hidden; order: 2; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .sidebar-title { padding: 14px 20px; font-size: 14px; font-weight: 600; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-color); color: #fff; display: flex; align-items: center; gap: 10px; }
        .sidebar-title i { color: var(--accent-red); }
        .channel-list-container { overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
        
        .category-folder { margin-bottom: 8px; background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); }
        .category-header { padding: 12px 16px; background: rgba(0,0,0,0.15); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff; transition: 0.2s; }
        .category-header:hover { background: rgba(255,255,255,0.03); }
        .cat-count { font-size: 11px; background: rgba(229, 9, 20, 0.15); color: #ff4d4f; padding: 2px 8px; border-radius: 10px; font-weight: 600; border: 1px solid rgba(229, 9, 20, 0.3); }
        
        .category-content { display: none; padding: 8px; background: rgba(0,0,0,0.2); }
        .category-content.open { display: block; }

        .channel-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 10px 14px; margin-bottom: 6px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .channel-item:hover { background: rgba(255,255,255,0.06); border-color: var(--border-color); }
        .channel-item.active { background: rgba(229, 9, 20, 0.12); border-left: 3px solid var(--accent-red); border-color: rgba(229, 9, 20, 0.3); }
        .channel-item.active .channel-name { color: #fff; font-weight: 600; }
        
        .channel-name { font-weight: 500; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .channel-item.active .channel-name i { color: var(--accent-red); }
        .play-btn { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--border-color); padding: 5px 14px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .play-btn:hover { background: var(--accent-red); border-color: var(--accent-red); }

        /* PC / Desktop View */
        @media (min-width: 900px) {
            .header { padding: 15px 35px; }
            .main-container { max-width: 1300px; height: calc(100vh - 75px); flex-direction: row; overflow: hidden; padding: 25px; gap: 25px; }
            .sidebar { width: 420px; min-width: 420px; max-height: 100%; height: 100%; margin-top: 0; order: 1; }
            .player-section { flex: 1; height: 100%; justify-content: center; order: 2; }
            .video-container { max-width: 900px; max-height: 65vh; }
            .now-playing, .player-controls-bar { max-width: 900px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <i class="fa-solid fa-tv"></i> HeroSalman1 Is Live <i class="fa-solid fa-bolt"></i>
        </div>
        <div class="live-badge">
            <span class="live-dot"></span> LIVE
        </div>
    </div>

    <div class="main-container">
        
        <div class="player-section">
            <div class="now-playing" id="nowPlayingText">
                <i class="fa-solid fa-circle-play" style="color: var(--accent-red);"></i> Select a channel to stream...
            </div>
            
            <div class="video-container">
                <video id="tvPlayer" controls autoplay></video>
            </div>
            
            <div class="player-controls-bar">
                <button class="ctrl-btn" onclick="playPrevChannel()"><i class="fa-solid fa-backward-step"></i> Prev</button>
                <button class="ctrl-btn main-play" onclick="togglePausePlay()" id="playPauseBtn"><i class="fa-solid fa-pause" id="playPauseIcon"></i> Pause</button>
                <button class="ctrl-btn" onclick="playNextChannel()">Next <i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-title">
                <i class="fa-solid fa-folder-tree"></i> Channel Categories
            </div>
            <div class="channel-list-container" id="channelList">
                <div style="text-align:center; color:var(--text-muted); padding:30px; font-size: 13px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px; margin-bottom: 8px; display: block; color: var(--accent-red);"></i> Loading Channels...
                </div>
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('tvPlayer');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const channelListEl = document.getElementById('channelList');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        
        let hlsInstance = null;
        let savedChannels = [];
        let currentPlayingIndex = -1;

        fetch('tools.json')
            .then(res => res.json())
            .then(data => {
                savedChannels = data;
                renderChannels();
            })
            .catch(err => {
                channelListEl.innerHTML = '<div style="color:#ff4d4f; text-align:center; padding:30px;"><i class="fa-solid fa-triangle-exclamation"></i> Error loading channels! Please check tools.json file.</div>';
            });

        function toggleFolder(catId) {
            const content = document.getElementById('folder-' + catId);
            content.classList.toggle('open');
            const icon = document.getElementById('icon-' + catId);
            if(content.classList.contains('open')) {
                icon.className = "fa-solid fa-folder-open";
            } else {
                icon.className = "fa-solid fa-folder";
            }
        }

        function renderChannels() {
            channelListEl.innerHTML = '';
            
            const categories = [];
            savedChannels.forEach(ch => {
                const cat = ch.category || "OTHER";
                if (!categories.includes(cat)) categories.push(cat);
            });

            categories.forEach(cat => {
                const channelsInCat = savedChannels.map((ch, idx) => ({...ch, originalIndex: idx})).filter(c => (c.category || "OTHER") === cat);
                if(channelsInCat.length === 0) return;

                const catId = cat.replace(/\s+/g, '-').toLowerCase();
                const folder = document.createElement('div');
                folder.className = 'category-folder';
                
                folder.innerHTML = `
                    <div class="category-header" onclick="toggleFolder('${catId}')">
                        <span><i class="fa-solid fa-folder" id="icon-${catId}" style="margin-right:8px; color:#e50914;"></i> ${cat}</span>
                        <span class="cat-count">${channelsInCat.length}</span>
                    </div>
                    <div class="category-content" id="folder-${catId}"></div>
                `;
                channelListEl.appendChild(folder);

                const contentEl = folder.querySelector('.category-content');
                channelsInCat.forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.setAttribute('data-index', ch.originalIndex);
                    item.onclick = () => playChannelByIndex(ch.originalIndex);

                    item.innerHTML = `
                        <span class="channel-name"><i class="fa-solid fa-tv"></i> ${ch.name}</span>
                        <button class="play-btn">PLAY</button>
                    `;
                    contentEl.appendChild(item);
                });
            });
        }

        function playChannelByIndex(index) {
            if(index < 0 || index >= savedChannels.length) return;
            currentPlayingIndex = index;
            const ch = savedChannels[index];
            
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.channel-item[data-index="${index}"]`);
            if(activeItem) activeItem.classList.add('active');

            playStream(ch.url, ch.name);
        }

        function playStream(url, name) {
            nowPlayingText.innerHTML = `<i class="fa-solid fa-circle-play" style="color: var(--accent-red);"></i> Now Playing: <span>${name}</span>`;
            if (hlsInstance) hlsInstance.destroy();

            if (Hls.isSupported() && url.includes('.m3u8')) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Auto-play blocked"));
                    playPauseIcon.className = "fa-solid fa-pause";
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Auto-play blocked"));
                    playPauseIcon.className = "fa-solid fa-pause";
                });
            } else {
                nowPlayingText.innerHTML = `<span style="color:#ff4d4f;">Error: Format not supported.</span>`;
            }
        }

        function togglePausePlay() {
            if (video.paused) { 
                video.play(); 
                playPauseIcon.className = "fa-solid fa-pause";
            } else { 
                video.pause(); 
                playPauseIcon.className = "fa-solid fa-play";
            }
        }

        function playNextChannel() {
            if(savedChannels.length === 0) return;
            let nextIndex = currentPlayingIndex + 1;
            if (nextIndex >= savedChannels.length) nextIndex = 0; 
            playChannelByIndex(nextIndex);
        }

        function playPrevChannel() {
            if(savedChannels.length === 0) return;
            let prevIndex = currentPlayingIndex - 1;
            if (prevIndex < 0) prevIndex = savedChannels.length - 1; 
            playChannelByIndex(prevIndex);
        }
    </script>
</body>
</html>
