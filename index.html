<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>HeroSalman1 Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg-main: #07090e;
            --bg-sidebar: #0e131f;
            --bg-card: #151b2b;
            --accent-red: #e50914;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --text-main: #ffffff;
            --text-muted: #8c939d;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #212b3d; border-radius: 10px; }

        .header { 
            background: rgba(7, 9, 14, 0.95); 
            backdrop-filter: blur(20px);
            padding: 15px 25px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; top: 0; z-index: 100;
        }
        .header-brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; color: #fff; }
        .header-brand i.fa-tv, .header-brand i.fa-bolt { color: var(--accent-red); font-size: 20px; filter: drop-shadow(0 0 6px var(--accent-glow)); }
        
        .live-badge {
            display: flex; align-items: center; gap: 8px;
            background: rgba(229, 9, 20, 0.15); border: 1px solid rgba(229, 9, 20, 0.4);
            padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #ff4d4f; text-transform: uppercase;
        }
        .live-dot {
            width: 7px; height: 7px; background: var(--accent-red); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red); animation: pulseLive 1.5s infinite;
        }
        @keyframes pulseLive {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(229, 9, 20, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
        }

        .main-container { display: flex; flex-direction: column; width: 100%; max-width: 1200px; margin: 0 auto; padding: 10px; gap: 12px; }
        
        .player-section { width: 100%; display: flex; flex-direction: column; align-items: center; order: 1; }
        
        .now-playing { 
            width: 100%; max-width: 900px; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); 
            text-align: center; font-weight: 500; background: var(--bg-card); padding: 8px 12px; 
            border-radius: 8px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .now-playing span { color: #fff; font-weight: 600; text-transform: uppercase; }

        .video-container { width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.05); position: relative; }
        
        .video-container:fullscreen { max-width: 100% !important; max-height: 100% !important; border-radius: 0 !important; border: none !important; box-shadow: none !important; }
        .video-container:-webkit-full-screen { max-width: 100% !important; max-height: 100% !important; border-radius: 0 !important; border: none !important; box-shadow: none !important; }
        
        .tv-fullscreen-fallback {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            z-index: 999999 !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
            background: #000 !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        video { width: 100%; height: 100%; outline: none; background: #000; object-fit: contain; display: block; transition: all 0.3s ease; transform: scale(1); }
        video::-webkit-media-controls-fullscreen-button { display: none !important; }

        .player-controls-bar { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%; 
            max-width: 900px; 
            margin-top: 8px; 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            padding: 8px 12px; 
            border-radius: 8px; 
            gap: 8px; 
        }
        
        .ctrl-btn { 
            background: rgba(255, 255, 255, 0.04); 
            border: 1px solid rgba(255, 255, 255, 0.04); 
            color: #a3a9b5; 
            flex: 1; 
            max-width: 65px;
            height: 38px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s ease; 
        }
        
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
        
        .ctrl-btn.main-play { 
            background: var(--accent-red); 
            border: none;
            color: #fff; 
            flex: 1.5; 
            max-width: 100px;
            height: 40px; 
            border-radius: 6px; 
            box-shadow: 0 4px 15px var(--accent-glow); 
            font-size: 18px; 
            margin: 0;
        }
        
        .ctrl-btn.main-play:hover { background: #ff1a2b; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6); }

        .sidebar { width: 100%; background: var(--bg-sidebar); border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 45vh; overflow: hidden; order: 2; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .sidebar-title { padding: 12px 15px; font-size: 13px; font-weight: 600; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-color); color: #fff; display: flex; align-items: center; gap: 8px; }
        .sidebar-title i { color: var(--accent-red); }
        .channel-list-container { overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }
        
        .category-folder { margin-bottom: 8px; background: var(--bg-card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); transition: 0.2s; }
        .category-header { padding: 12px 14px; background: rgba(0,0,0,0.15); font-weight: 600; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff; transition: background 0.2s; }
        .category-header:hover { background: rgba(255,255,255,0.03); }
        .cat-count { font-size: 10px; background: rgba(229, 9, 20, 0.15); color: #ff4d4f; padding: 2px 8px; border-radius: 12px; font-weight: 700; border: 1px solid rgba(229, 9, 20, 0.3); }
        
        .category-content { display: none; padding: 8px; background: rgba(0,0,0,0.2); }
        .category-content.open { display: block; }

        .channel-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 10px 12px; margin-bottom: 6px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; gap: 10px; overflow: hidden;}
        .channel-item:hover { background: rgba(255,255,255,0.05); }
        .channel-item.active { background: rgba(229, 9, 20, 0.12); border-left: 3px solid var(--accent-red); border-color: rgba(229, 9, 20, 0.3); }
        .channel-item.active .channel-name { color: #fff; font-weight: 600; }
        
        .channel-name { font-weight: 500; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .channel-name i { flex-shrink: 0; color: var(--accent-red); }
        
        .play-btn { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--border-color); padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .channel-item:hover .play-btn { background: rgba(255,255,255,0.15); }

        @media (min-width: 900px) {
            .header { padding: 15px 35px; }
            .header-brand { font-size: 20px; gap: 12px; }
            .header-brand i.fa-tv { font-size: 22px; }
            .header-brand i.fa-bolt { font-size: 20px; }
            .main-container { max-width: 1550px; height: calc(100vh - 75px); flex-direction: row; overflow: hidden; padding: 25px; gap: 25px; }
            
            .sidebar { width: 520px; min-width: 520px; flex: 0 0 520px; max-height: 100%; height: 100%; margin-top: 0; order: 1; border-radius: 14px; }
            
            .sidebar-title { padding: 16px 20px; font-size: 15px; }
            .channel-list-container { padding: 15px; }
            .category-folder { border-radius: 10px; margin-bottom: 10px; }
            .category-header { padding: 14px 18px; font-size: 14px; }
            .channel-item { padding: 12px 16px; margin-bottom: 8px; }
            .channel-name { font-size: 14px; }
            .player-section { flex: 1; height: 100%; justify-content: center; order: 2; overflow: hidden; }
            .video-container { max-width: 950px; max-height: 65vh; border-radius: 14px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
            
            .now-playing { max-width: 950px; border-radius: 10px; padding: 12px 20px; font-size: 14px; margin-bottom: 12px; }
            
            .player-controls-bar { max-width: 950px; padding: 12px 20px; gap: 15px; margin-top: 12px; border-radius: 10px; }
            
            .ctrl-btn { max-width: 80px; height: 44px; font-size: 18px; border-radius: 8px; }
            .ctrl-btn.main-play { max-width: 120px; height: 48px; font-size: 22px; border-radius: 8px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <i class="fa-solid fa-tv"></i> HeroSalman1 Is Live <i class="fa-solid fa-bolt"></i>
        </div>
        <div class="live-badge">
            <span class="live-dot"></span> LIVE
        </div>
    </div>

    <div class="main-container">
        
        <div class="player-section">
            <div class="now-playing" id="nowPlayingText">
                <i class="fa-solid fa-circle-play" style="color: var(--accent-red);"></i> Select a channel to stream...
            </div>
            
            <div class="video-container" id="vidContainer">
                <video id="tvPlayer" controls autoplay></video>
            </div>
            
            <div class="player-controls-bar">
                <button class="ctrl-btn" onclick="skipVideo(-10); this.blur();" title="Skip -10s"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="ctrl-btn" onclick="playPrevChannel(); this.blur();" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
                
                <button class="ctrl-btn main-play" onclick="togglePausePlay(); this.blur();" id="playPauseBtn" title="Play/Pause"><i class="fa-solid fa-pause" id="playPauseIcon"></i></button>
                
                <button class="ctrl-btn" onclick="playNextChannel(); this.blur();" title="Next"><i class="fa-solid fa-forward-step"></i></button>
                <button class="ctrl-btn" onclick="skipVideo(10); this.blur();" title="Skip +10s"><i class="fa-solid fa-rotate-right"></i></button>
                
                <button class="ctrl-btn" onclick="toggleVideoFit(); this.blur();" title="Change Video Fit"><i class="fa-solid fa-crop-simple"></i></button>
                
                <button class="ctrl-btn" onclick="toggleFullScreen(); this.blur();" title="Full Screen"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-title">
                <i class="fa-solid fa-folder-tree"></i> Channel Categories
            </div>
            <div class="channel-list-container" id="channelList">
                <div style="text-align:center; color:var(--text-muted); padding:30px; font-size: 13px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px; margin-bottom: 8px; display: block; color: var(--accent-red);"></i> Loading Channels...
                </div>
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('tvPlayer');
        const vidContainer = document.getElementById('vidContainer');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const channelListEl = document.getElementById('channelList');
        const playPauseIcon = document.getElementById('playPauseIcon');
        
        let hlsInstance = null;
        let savedChannels = [];
        let currentPlayingIndex = -1;

        let fitModes = [
            { fit: 'contain', scale: 1 },       
            { fit: 'fill', scale: 1 },          
            { fit: 'cover', scale: 1 },         
            { fit: 'contain', scale: 1.35 }     
        ];
        let fitIndex = 0;

        // HANDLE EXTERNAL STREAM URL FROM SCRIPT (For Tampermonkey PLAYER 2 Button)
        const urlParams = new URLSearchParams(window.location.search);
        const externalStreamUrl = urlParams.get('stream');

        fetch('tools.json')
            .then(res => res.json())
            .then(data => {
                savedChannels = data;
                renderChannels();
                if(externalStreamUrl) {
                    playStream(externalStreamUrl, "Captured Stream");
                }
            })
            .catch(err => {
                channelListEl.innerHTML = '<div style="color:#ff4d4f; text-align:center; padding:30px;"><i class="fa-solid fa-triangle-exclamation"></i> Error loading channels! Please check tools.json file.</div>';
            });

        function toggleFolder(catId) {
            const content = document.getElementById('folder-' + catId);
            content.classList.toggle('open');
            const icon = document.getElementById('icon-' + catId);
            if(content.classList.contains('open')) {
                icon.className = "fa-solid fa-folder-open";
            } else {
                icon.className = "fa-solid fa-folder";
            }
        }

        function renderChannels() {
            channelListEl.innerHTML = '';
            
            const categories = [];
            savedChannels.forEach(ch => {
                const cat = ch.category || "OTHER";
                if (!categories.includes(cat)) categories.push(cat);
            });

            categories.forEach(cat => {
                const channelsInCat = savedChannels
                    .map((ch, idx) => ({...ch, originalIndex: idx}))
                    .filter(c => (c.category || "OTHER") === cat)
                    .sort((a, b) => a.name.localeCompare(b.name, 'hi', { numeric: true, sensitivity: 'base' }));

                if(channelsInCat.length === 0) return;

                const catId = cat.replace(/\s+/g, '-').toLowerCase();
                const folder = document.createElement('div');
                folder.className = 'category-folder';
                
                folder.innerHTML = `
                    <div class="category-header" onclick="toggleFolder('${catId}')">
                        <span><i class="fa-solid fa-folder" id="icon-${catId}" style="margin-right:8px; color:#e50914;"></i> ${cat}</span>
                        <span class="cat-count">${channelsInCat.length}</span>
                    </div>
                    <div class="category-content" id="folder-${catId}"></div>
                `;
                channelListEl.appendChild(folder);

                const contentEl = folder.querySelector('.category-content');
                channelsInCat.forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.setAttribute('data-index', ch.originalIndex);
                    item.onclick = () => playChannelByIndex(ch.originalIndex);

                    item.innerHTML = `
                        <span class="channel-name"><i class="fa-solid fa-tv"></i> ${ch.name}</span>
                        <button class="play-btn">PLAY</button>
                    `;
                    contentEl.appendChild(item);
                });
            });
        }

        function playChannelByIndex(index) {
            if(index < 0 || index >= savedChannels.length) return;
            currentPlayingIndex = index;
            const ch = savedChannels[index];
            
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.channel-item[data-index="${index}"]`);
            if(activeItem) activeItem.classList.add('active');

            playStream(ch.url, ch.name);
        }

        function playStream(url, name) {
            fitIndex = 0;
            video.style.objectFit = fitModes[0].fit;
            video.style.transform = `scale(${fitModes[0].scale})`;

            nowPlayingText.innerHTML = `<i class="fa-solid fa-circle-play" style="color: var(--accent-red);"></i> Now Playing: <span>${name}</span>`;
            
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            // REDIRECT HATA DIYA - SAB YAHI PLAY HOGA
            if (url.includes('.mp4') || url.endsWith('.mp4') || (!url.includes('.m3u8') && url.startsWith('http'))) {
                video.src = url;
                video.load();
                video.play().catch(e => console.log("Auto-play blocked"));
                playPauseIcon.className = "fa-solid fa-pause";
            } 
            else if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    xhrSetup: function (xhr, url) {
                        xhr.withCredentials = false;
                    }
                });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Auto-play blocked"));
                    playPauseIcon.className = "fa-solid fa-pause";
                });
                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                hlsInstance.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Auto-play blocked"));
                    playPauseIcon.className = "fa-solid fa-pause";
                });
            } else {
                video.src = url;
                video.load();
                video.play().catch(e => {
                    nowPlayingText.innerHTML = `<span style="color:#ff4d4f;">Error: Format not supported on this browser.</span>`;
                });
            }
        }

        function togglePausePlay() {
            if (video.paused) { 
                video.play(); 
                playPauseIcon.className = "fa-solid fa-pause";
            } else { 
                video.pause(); 
                playPauseIcon.className = "fa-solid fa-play";
            }
        }

        function playNextChannel() {
            if(savedChannels.length === 0) return;
            let nextIndex = currentPlayingIndex + 1;
            if (nextIndex >= savedChannels.length) nextIndex = 0; 
            playChannelByIndex(nextIndex);
        }

        function playPrevChannel() {
            if(savedChannels.length === 0) return;
            let prevIndex = currentPlayingIndex - 1;
            if (prevIndex < 0) prevIndex = savedChannels.length - 1; 
            playChannelByIndex(prevIndex);
        }

        function skipVideo(seconds) {
            if (video && video.duration) {
                video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + seconds));
            }
        }
        
        function toggleVideoFit() {
            fitIndex = (fitIndex + 1) % fitModes.length;
            video.style.objectFit = fitModes[fitIndex].fit;
            video.style.transform = `scale(${fitModes[fitIndex].scale})`;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (vidContainer.requestFullscreen) {
                    vidContainer.requestFullscreen();
                } else if (vidContainer.webkitRequestFullscreen) {
                    vidContainer.webkitRequestFullscreen();
                } else if (vidContainer.msRequestFullscreen) {
                    vidContainer.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        video.addEventListener('ended', function() {
            if (savedChannels.length === 0 || currentPlayingIndex === -1) return;

            const currentChannel = savedChannels[currentPlayingIndex];
            const currentCategory = currentChannel.category || "OTHER";

            let nextIndex = -1;
            
            for (let i = currentPlayingIndex + 1; i < savedChannels.length; i++) {
                const checkCat = savedChannels[i].category || "OTHER";
                if (checkCat === currentCategory) {
                    nextIndex = i;
                    break;
                }
            }
            
            if (nextIndex === -1) {
                for (let i = 0; i < currentPlayingIndex; i++) {
                    const checkCat = savedChannels[i].category || "OTHER";
                    if (checkCat === currentCategory) {
                        nextIndex = i;
                        break;
                    }
                }
            }

            if (nextIndex !== -1) {
                playChannelByIndex(nextIndex);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (!video || (!video.src && !video.currentSrc)) return;

            switch(e.key) {
                case 'Enter':
                case ' ':
                    togglePausePlay();
                    e.preventDefault();
                    break;
            }
        });
    </script>
</body>
</html>
