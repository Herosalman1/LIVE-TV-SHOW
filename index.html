<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>HeroSalman1 Live TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg-main: #07090e;
            --bg-sidebar: #0e131f;
            --bg-card: #151b2b;
            --accent-red: #e50914;
            --accent-glow: rgba(229, 9, 20, 0.4);
            --text-main: #ffffff;
            --text-muted: #8c939d;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        /* ⚡ HIDE SCROLLBARS COMPLETELY */
        ::-webkit-scrollbar { display: none; width: 0; height: 0; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .header { 
            background: rgba(7, 9, 14, 0.95); 
            backdrop-filter: blur(20px);
            padding: 15px 25px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 100;
        }
        .header-brand { display: flex; align-items: center; font-size: 18px; font-weight: 700; color: #fff; }
        .header-brand i.fa-tv { margin-right: 12px; color: var(--accent-red); font-size: 20px; filter: drop-shadow(0 0 6px var(--accent-glow)); }
        .header-brand i.fa-bolt { margin-left: 12px; color: var(--accent-red); font-size: 20px; filter: drop-shadow(0 0 6px var(--accent-glow)); }
        
        .live-badge {
            display: flex; align-items: center; gap: 8px;
            background: rgba(229, 9, 20, 0.15); border: 1px solid rgba(229, 9, 20, 0.4);
            padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #ff4d4f; text-transform: uppercase;
        }
        .live-dot {
            margin-right: 8px;
            width: 7px; height: 7px; background: var(--accent-red); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red); animation: pulseLive 1.5s infinite;
        }
        @keyframes pulseLive {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(229, 9, 20, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
        }

        .main-container { display: flex; flex-direction: column; width: 100%; max-width: 1200px; margin: 0 auto; padding: 10px; gap: 12px; }
        
        .player-section { width: 100%; display: flex; flex-direction: column; align-items: center; order: 1; margin-bottom: 12px; }
        
        .now-playing { 
            width: 100%; max-width: 900px; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); 
            text-align: center; font-weight: 500; background: var(--bg-card); padding: 8px 12px; 
            border-radius: 8px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center;
        }
        .now-playing i { margin-right: 8px; }
        .now-playing span { color: #fff; font-weight: 600; text-transform: uppercase; margin-left: 8px; }

        .video-container { 
            width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; border-radius: 8px; 
            overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.6); border: 1px solid var(--border-color); 
            position: relative; touch-action: none;
        }

        .video-container:-webkit-full-screen { max-width: 100% !important; max-height: 100% !important; width: 100vw !important; height: 100vh !important; border-radius: 0 !important; margin: 0 !important; }
        .video-container:-moz-full-screen { max-width: 100% !important; max-height: 100% !important; width: 100vw !important; height: 100vh !important; border-radius: 0 !important; margin: 0 !important; }
        .video-container:-ms-fullscreen { max-width: 100% !important; max-height: 100% !important; width: 100vw !important; height: 100vh !important; border-radius: 0 !important; margin: 0 !important; }
        .video-container:fullscreen { max-width: 100% !important; max-height: 100% !important; width: 100vw !important; height: 100vh !important; border-radius: 0 !important; margin: 0 !important; }
        
        video { width: 100%; height: 100%; outline: none; background: #000; object-fit: fill; display: block; pointer-events: none; }
        video::-webkit-media-controls { display: none !important; }
        video::-webkit-media-controls-enclosure { display: none !important; }

        /* ⚡ VIP POPUP TIMER */
        .stream-timer { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: transparent; color: #ffffff; text-align: center; 
            font-weight: 500; font-size: 14px; z-index: 50; display: none; 
            letter-spacing: 2px; font-family: 'Poppins', sans-serif; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.9); 
            white-space: nowrap; 
        }
        .error-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff4d4f; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 60; font-size: 24px; font-weight: 800; letter-spacing: 1px; font-family: 'Poppins', sans-serif; text-align: center; padding: 20px;}
        .error-overlay i { font-size: 55px; margin-bottom: 15px; text-shadow: 0 0 15px rgba(229, 9, 20, 0.5); }

        .touch-catcher { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .custom-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; justify-content: space-between; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 20; }
        .custom-overlay.show { opacity: 1; pointer-events: none; }
        .overlay-center { display: flex; justify-content: center; align-items: center; gap: 40px; flex: 1; pointer-events: none; }
        .overlay-btn { background: transparent; border: none; color: #fff; font-size: 28px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.8)); pointer-events: auto; }
        .overlay-btn:active { transform: scale(0.9); color: #e50914; }
        .play-pause-btn { font-size: 60px; }
        .overlay-bottom { padding: 25px 30px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); pointer-events: auto; width: 100%; box-sizing: border-box; }
        .progress-container { width: 100%; display: flex; align-items: center; margin-bottom: 12px; }
        .seek-bar { -webkit-appearance: none; width: 100%; height: 5px; background: rgba(255,255,255,0.3); border-radius: 5px; outline: none; cursor: pointer; }
        .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .time-volume-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .time-text { color: #fff; font-size: 15px; font-weight: 500; font-family: 'Inter', sans-serif; letter-spacing: 0.5px;}
        .vol-btn { background: transparent; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 5px;}

        .player-controls-bar { display: flex; justify-content: center; align-items: center; width: 100%; max-width: 900px; margin-top: 8px; background: var(--bg-card); border: 1px solid var(--border-color); padding: 8px; border-radius: 8px; }
        .ctrl-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #fff; padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: 1; margin: 0 6px; transition: 0.2s; white-space: nowrap; height: 38px; }
        .ctrl-btn i { margin: 0 8px; }
        .ctrl-btn.main-play { background: var(--accent-red); border-color: var(--accent-red); padding: 9px 16px; box-shadow: 0 3px 10px var(--accent-glow); flex: 1.2; }

        .sidebar { width: 100%; background: var(--bg-sidebar); border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 45vh; overflow: hidden; order: 2; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .sidebar-tabs { display: flex; width: 100%; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.2); }
        .sidebar-tab { flex: 1; padding: 12px 0; font-size: 13px; font-weight: 600; color: var(--text-muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: 0.3s; font-family: 'Poppins', sans-serif; text-transform: uppercase;}
        .sidebar-tab.active { color: #fff; border-bottom: 2px solid var(--accent-red); background: rgba(229, 9, 20, 0.1); }
        .sidebar-tab i { color: var(--accent-red); margin-right: 8px; }
        
        .channel-list-container { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
        .category-folder { margin-bottom: 6px; background: var(--bg-card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .category-header { padding: 10px 12px; background: rgba(0,0,0,0.15); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        .cat-count { font-size: 10px; background: rgba(229, 9, 20, 0.15); color: #ff4d4f; padding: 2px 6px; border-radius: 8px; font-weight: 600; border: 1px solid rgba(229, 9, 20, 0.3); }
        .category-content { display: none; padding: 6px; background: rgba(0,0,0,0.2); }
        .category-content.open { display: block; }
        .channel-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 8px 10px; margin-bottom: 4px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; gap: 10px; }
        .channel-item.active { background: rgba(229, 9, 20, 0.12); border-left: 3px solid var(--accent-red); border-color: rgba(229, 9, 20, 0.3); }
        .channel-item.active .channel-name { color: #fff; font-weight: 600; }
        .channel-name { font-weight: 500; font-size: 12px; color: var(--text-muted); flex: 1; display: flex; align-items: center; line-height: 1.4; word-break: break-word; }
        .channel-name i { color: var(--accent-red); margin-right: 8px; flex-shrink: 0; }
        .play-btn { margin-left: 10px; background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 4px; font-size: 9px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

        @media (min-width: 900px) {
            .header { padding: 15px 35px; }
            .header-brand { font-size: 20px; }
            .header-brand i.fa-tv { font-size: 22px; }
            .header-brand i.fa-bolt { font-size: 20px; }
            .main-container { max-width: 1500px; height: calc(100vh - 75px); flex-direction: row; overflow: hidden; padding: 25px; }
            .sidebar { margin-right: 30px; width: 550px; min-width: 550px; max-height: 100%; height: 100%; margin-top: 0; order: 1; border-radius: 14px; }
            .sidebar-tabs .sidebar-tab { font-size: 14px; padding: 15px 0; }
            .channel-list-container { padding: 12px; }
            .category-folder { border-radius: 10px; margin-bottom: 10px; }
            .category-header { padding: 14px 18px; font-size: 15px; }
            .channel-item { padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; }
            .channel-name { font-size: 14px; }
            .play-btn { padding: 6px 14px; border-radius: 6px; font-size: 11px; }
            .player-section { flex: 1; height: 100%; justify-content: center; order: 2; margin-bottom: 0; }
            .video-container { max-width: 900px; max-height: 65vh; border-radius: 12px; }
            .now-playing, .player-controls-bar { max-width: 900px; border-radius: 12px; padding: 12px 20px; }
            .now-playing { font-size: 14px; margin-bottom: 12px; }
            .player-controls-bar { margin-top: 12px; }
            .ctrl-btn { padding: 10px 18px; font-size: 12px; height: 42px; margin: 0 8px; }
            .ctrl-btn.main-play { padding: 10px 26px; }
            .play-pause-btn { font-size: 60px; }
            .time-text { font-size: 14px; }
            .vol-btn { font-size: 20px; }
            .stream-timer { font-size: 18px; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-brand">
            <i class="fa-solid fa-tv"></i> HeroSalman1 Is Live <i class="fa-solid fa-bolt"></i>
        </div>
        <div class="live-badge">
            <span class="live-dot"></span> LIVE
        </div>
    </div>

    <div class="main-container">
        
        <div class="player-section">
            <div class="now-playing" id="nowPlayingText">
                <i class="fa-solid fa-circle-play" style="color: var(--accent-red);"></i> Select a channel to stream...
            </div>
            
            <div class="video-container" id="videoContainer">
                <video id="tvPlayer" autoplay playsinline></video>
                <div class="stream-timer" id="popTimer"></div>
                <div class="error-overlay" id="popError">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>STREAM ERROR 404 ...</span>
                </div>
                <div class="touch-catcher" id="touchCatcher"></div>
                <div class="custom-overlay" id="customOverlay">
                    <div style="flex:0.2;"></div>
                    <div class="overlay-center">
                        <button class="overlay-btn play-pause-btn" id="overlayPlayBtn"><i class="fa-solid fa-pause"></i></button>
                    </div>
                    <div class="overlay-bottom" id="overlayBottom">
                        <div class="progress-container"><input type="range" class="seek-bar" id="overlaySeekBar" value="0" step="0.1" tabindex="0"></div>
                        <div class="time-volume-row">
                            <span class="time-text" id="overlayTime">0:00 / 0:00</span>
                            <div>
                                <button class="vol-btn" id="overlayMuteBtn"><i class="fa-solid fa-volume-high"></i></button>
                                <button class="vol-btn" id="fullScreenBtn" style="margin-left:25px;"><i class="fa-solid fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="player-controls-bar">
                <button class="ctrl-btn" onclick="playPrevChannel()"><i class="fa-solid fa-backward-step"></i> Prev</button>
                <button class="ctrl-btn main-play" onclick="togglePausePlay()" id="playPauseBtn"><i class="fa-solid fa-pause" id="playPauseIcon"></i> <span id="playPauseText">Pause</span></button>
                <button class="ctrl-btn" onclick="playNextChannel()">Next <i class="fa-solid fa-forward-step"></i></button>
                <button class="ctrl-btn" onclick="toggleFullScreen()"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-tabs">
                <button class="sidebar-tab active" id="tabLive" onclick="switchView('live')"><i class="fa-solid fa-tv"></i> Live TV</button>
                <button class="sidebar-tab" id="tabOffline" onclick="switchView('offline')"><i class="fa-solid fa-film"></i> Offline Stream</button>
            </div>
            <div class="channel-list-container" id="channelList">
                <div style="text-align:center; color:var(--text-muted); padding:30px; font-size: 13px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 20px; margin-bottom: 8px; display: block; color: var(--accent-red);"></i> Loading Channels...
                </div>
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('tvPlayer'); 
        const videoContainer = document.getElementById('videoContainer');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const channelListEl = document.getElementById('channelList');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const playPauseText = document.getElementById('playPauseText');
        
        const touchCatcher = document.getElementById('touchCatcher');
        const customOverlay = document.getElementById('customOverlay');
        const overlayPlayBtn = document.getElementById('overlayPlayBtn');
        const overlaySeekBar = document.getElementById('overlaySeekBar');
        const overlayTime = document.getElementById('overlayTime');
        const overlayMuteBtn = document.getElementById('overlayMuteBtn');
        const fullScreenBtn = document.getElementById('fullScreenBtn');
        const overlayBottom = document.getElementById('overlayBottom');
        
        const popTimer = document.getElementById('popTimer');
        const popError = document.getElementById('popError');
        let pTime = null;
        let fastForwardTimer = null;
        let currentTl = 20;
        let isFastForwarding = false;
        
        let hlsInstance = null;
        let savedChannels = [];
        let currentPlayingIndex = -1;
        let overlayTimer; 
        let currentView = 'live'; 

        // ⚡ VIP FAST-FORWARD TIMER LOGIC
        function startPTimer() {
            clearInterval(pTime);
            clearInterval(fastForwardTimer);
            isFastForwarding = false;
            currentTl = 20;
            if(popError) popError.style.display = 'none';
            if(popTimer) {
                popTimer.innerHTML = '<i class="fa-solid fa-hourglass-half fa-spin" style="margin-right:12px; opacity:0.8;"></i> TIMER : ' + currentTl + ' SEC';
                popTimer.style.display = 'block';
            }
            pTime = setInterval(() => {
                if(isFastForwarding) return;
                currentTl--;
                if(currentTl > 0) { 
                    if(popTimer) popTimer.innerHTML = '<i class="fa-solid fa-hourglass-half fa-spin" style="margin-right:12px; opacity:0.8;"></i> TIMER : ' + currentTl + ' SEC'; 
                } else { 
                    clearInterval(pTime); 
                    if(popTimer) popTimer.style.display = 'none'; 
                    triggerError(); 
                }
            }, 1000);
        }

        function triggerError() { 
            clearInterval(pTime); 
            clearInterval(fastForwardTimer);
            isFastForwarding = false;
            if(popTimer) popTimer.style.display = 'none'; 
            if(popError) popError.style.display = 'flex'; 
        }

        function fastForwardTimerToZero() {
            if (isFastForwarding) return;
            isFastForwarding = true;
            clearInterval(pTime);
            
            // ⚡ Video background mein chalegi aur hum timer ko ekdum speed mein (30ms per number) hide karenge
            if (currentTl > 0) {
                fastForwardTimer = setInterval(() => {
                    currentTl--;
                    if(currentTl > 0) {
                        if(popTimer) popTimer.innerHTML = '<i class="fa-solid fa-hourglass-half fa-spin" style="margin-right:12px; opacity:0.8;"></i> TIMER : ' + currentTl + ' SEC';
                    } else {
                        clearInterval(fastForwardTimer);
                        if(popTimer) popTimer.style.display = 'none';
                    }
                }, 30); 
            } else {
                if(popTimer) popTimer.style.display = 'none';
            }
        }

        video.addEventListener('playing', () => { 
            // Jaise hi original video actually chalna shuru karegi screen par (buffering ke baad)
            // Ussi ekdum precise millisecond par timer speed se ghoom kar hide hoga!
            fastForwardTimerToZero();
        });
        
        video.addEventListener('error', () => { triggerError(); });

        fetch('tools.json')
            .then(res => res.json())
            .then(data => {
                savedChannels = data;
                renderChannels();
            })
            .catch(err => {
                channelListEl.innerHTML = '<div style="color:#ff4d4f; text-align:center; padding:30px;"><i class="fa-solid fa-triangle-exclamation"></i> Error loading channels! Please check tools.json file.</div>';
            });

        function switchView(type) {
            currentView = type;
            document.getElementById('tabLive').className = type === 'live' ? 'sidebar-tab active' : 'sidebar-tab';
            document.getElementById('tabOffline').className = type === 'offline' ? 'sidebar-tab active' : 'sidebar-tab';
            renderChannels();
        }

        function toggleFolder(catId) {
            const content = document.getElementById('folder-' + catId);
            content.classList.toggle('open');
            const icon = document.getElementById('icon-' + catId);
            if(content.classList.contains('open')) { icon.className = "fa-solid fa-folder-open"; } 
            else { icon.className = "fa-solid fa-folder"; }
        }

        function renderChannels() {
            channelListEl.innerHTML = '';
            const categories = [];
            
            const viewChannels = savedChannels.filter(ch => (ch.streamType || 'live') === currentView);

            viewChannels.forEach(ch => {
                const cat = ch.category || "OTHER";
                if (!categories.includes(cat)) categories.push(cat);
            });

            if (categories.length === 0) {
                channelListEl.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:30px; font-size: 13px;">No ${currentView === 'live' ? 'Live TV' : 'Offline Stream'} Channels Found.</div>`;
                return;
            }

            categories.forEach(cat => {
                const channelsInCat = viewChannels
                    .map((ch) => ({...ch, originalIndex: savedChannels.indexOf(ch)}))
                    .filter(c => (c.category || "OTHER") === cat)
                    .sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true, sensitivity: 'base' }));

                if(channelsInCat.length === 0) return;

                const catId = cat.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase() + '-' + currentView;
                
                const folder = document.createElement('div');
                folder.className = 'category-folder';
                
                folder.innerHTML = `
                    <div class="category-header" onclick="toggleFolder('${catId}')">
                        <span><i class="fa-solid fa-folder" id="icon-${catId}" style="margin-right:8px; color:#e50914;"></i> ${cat}</span>
                        <span class="cat-count">${channelsInCat.length}</span>
                    </div>
                    <div class="category-content" id="folder-${catId}"></div>
                `;
                channelListEl.appendChild(folder);

                const contentEl = folder.querySelector('.category-content');
                channelsInCat.forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.setAttribute('data-index', ch.originalIndex);
                    item.onclick = () => playChannelByIndex(ch.originalIndex);

                    item.innerHTML = `
                        <div class="channel-name" title="${ch.name}"><i class="fa-solid fa-tv"></i> ${ch.name}</div>
                        <button class="play-btn">PLAY</button>
                    `;
                    contentEl.appendChild(item);
                });
            });
        }

        function playChannelByIndex(index) {
            if(index < 0 || index >= savedChannels.length) return;
            currentPlayingIndex = index;
            const ch = savedChannels[index];
            
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.channel-item[data-index="${index}"]`);
            if(activeItem) activeItem.classList.add('active');

            playStream(ch.url, ch.name);
        }

        function playStream(url, name) {
            overlaySeekBar.value = 0;
            overlayTime.innerText = "0:00 / 0:00";
            hideOverlay(); 

            if (url.includes('t.me/') || url.includes('telegram.dog/')) {
                nowPlayingText.innerHTML = `<i class="fa-solid fa-paper-plane" style="color: #0088cc; margin-right: 8px;"></i> Opening Telegram: <span style="margin-left: 8px;">${name}</span>`;
                if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                video.pause(); video.removeAttribute('src'); video.load();

                let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                if (isMobile) {
                    let cleanUrl = url.replace(/^https?:\/\/(t\.me|telegram\.dog)\//i, '');

                } else {
                    const playerWindow = window.open('about:blank', '_blank');
                    setTimeout(() => {
                        const htmlContent = `<!DOCTYPE html>

                            <style>

                                /* VIP POPUP TIMER */
                                .stream-timer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: transparent; color: #ffffff; text-align: center; font-weight: 500; font-size: 14px; z-index: 50; display: none; letter-spacing: 2px; font-family: 'Poppins', sans-serif; text-shadow: 0 4px 15px rgba(0,0,0,0.9); white-space: nowrap;}
                                .error-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #ff4d4f; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 60; font-size: 24px; font-weight: 800; letter-spacing: 1px; font-family: 'Poppins', sans-serif; text-align: center; padding: 20px;}
                                .error-overlay i { font-size: 55px; margin-bottom: 15px; text-shadow: 0 0 15px rgba(229, 9, 20, 0.5); }

                                .touch-catcher { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
                                .custom-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); display: flex; flex-direction: column; justify-content: space-between; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 20; }
                                .custom-overlay.show { opacity: 1; pointer-events: none; }
                                .overlay-center { display: flex; justify-content: center; align-items: center; flex: 1; pointer-events: none; }
                                .overlay-btn { background: transparent; border: none; color: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.8)); pointer-events: auto; }
                                .overlay-btn:active { transform: scale(0.9); color: #e50914; }
                                .play-pause-btn { font-size: 60px; }
                                .overlay-bottom { padding: 25px 30px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); pointer-events: auto; width: 100%; box-sizing: border-box; }
                                .progress-container { width: 100%; display: flex; align-items: center; margin-bottom: 12px; }
                                .seek-bar { -webkit-appearance: none; width: 100%; height: 5px; background: rgba(255,255,255,0.3); border-radius: 5px; outline: none; cursor: pointer; }
                                .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
                                .time-volume-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
                                .time-text { color: #fff; font-size: 15px; font-weight: 500; font-family: 'Inter', sans-serif; letter-spacing: 0.5px;}
                                .vol-btn { background: transparent; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 5px;}
                            </style>
                        </head>
                        <body>
                            <div class="video-container" id="videoContainer">
                                <video id="video" autoplay playsinline></video>
                                <div class="stream-timer" id="popTimer"></div>

                                    <i class="fa-solid fa-triangle-exclamation"></i>
                                    <span>STREAM ERROR 404 ...</span>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <script>
                                const video = document.getElementById('video'); 
                                const videoSrc = "${url}"; 
                                const videoContainer = document.getElementById('videoContainer');
                                const touchCatcher = document.getElementById('touchCatcher');
                                const customOverlay = document.getElementById('customOverlay');
                                const overlayPlayBtn = document.getElementById('overlayPlayBtn');
                                const overlaySeekBar = document.getElementById('overlaySeekBar');
                                const overlayTime = document.getElementById('overlayTime');
                                const overlayMuteBtn = document.getElementById('overlayMuteBtn');
                                const fullScreenBtn = document.getElementById('fullScreenBtn');
                                const overlayBottom = document.getElementById('overlayBottom');
                                
                                let overlayTimer;
                                let lastClickTime = 0;
                                let seekInterval = null;
                                let holdMultiplier = 0;
                                
                                const popTimer = document.getElementById('popTimer');
                                const popError = document.getElementById('popError');
                                let pTime = null;
                                let fastForwardTimer = null;
                                let currentTl = 20;
                                let isFastForwarding = false;

                                function startPTimer() {
                                    clearInterval(pTime);
                                    clearInterval(fastForwardTimer);
                                    isFastForwarding = false;
                                    currentTl = 20;
                                    if(popError) popError.style.display = 'none';
                                    if(popTimer) {
                                        popTimer.innerHTML = '<i class="fa-solid fa-hourglass-half fa-spin" style="margin-right:12px; opacity:0.8;"></i> TIMER : ' + currentTl + ' SEC';
                                        popTimer.style.display = 'block';
                                    }
                                    pTime = setInterval(() => {
                                        if(isFastForwarding) return;
                                        currentTl--;
                                        if(currentTl > 0) { 
                                            if(popTimer) popTimer.innerHTML = '<i class="fa-solid fa-hourglass-half fa-spin" style="margin-right:12px; opacity:0.8;"></i> TIMER : ' + currentTl + ' SEC'; 
                                        } else { 
                                            clearInterval(pTime); 
                                            if(popTimer) popTimer.style.display = 'none'; 
                                            triggerError(); 
                                        }
                                    }, 1000);
                                }
                                
                                function triggerError() { 
                                    clearInterval(pTime); 
                                    clearInterval(fastForwardTimer);
                                    isFastForwarding = false;
                                    if(popTimer) popTimer.style.display = 'none'; 
                                    if(popError) popError.style.display = 'flex'; 
                                }

                                function fastForwardTimerToZero() {
                                    if (isFastForwarding) return;
                                    isFastForwarding = true;
                                    clearInterval(pTime);
                                    
                                    if (currentTl > 0) {
                                        fastForwardTimer = setInterval(() => {
                                            currentTl--;
                                            if(currentTl > 0) {
                                                if(popTimer) popTimer.innerHTML = '<i class="fa-solid fa-hourglass-half fa-spin" style="margin-right:12px; opacity:0.8;"></i> TIMER : ' + currentTl + ' SEC';
                                            } else {
                                                clearInterval(fastForwardTimer);
                                                if(popTimer) popTimer.style.display = 'none';
                                            }
                                        }, 30); 
                                    } else {
                                        if(popTimer) popTimer.style.display = 'none';
                                    }
                                }

                                video.addEventListener('playing', () => { 
                                    fastForwardTimerToZero();
                                });
                                
                                video.addEventListener('error', () => { triggerError(); });

                                if (window.Hls && Hls.isSupported()) { 
                                    var hls = new Hls(); hls.loadSource(videoSrc); hls.attachMedia(video); 
                                    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play().catch(e=>console.log(e)); }); 
                                    hls.on(Hls.Events.ERROR, function(e, data) {
                                        if(data.fatal) {
                                            switch(data.type) {
                                                case Hls.ErrorTypes.NETWORK_ERROR: hls.destroy(); triggerError(); break;
                                                case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                                                default: hls.destroy(); triggerError(); break;
                                            }
                                        }
                                    });
                                } else if (video.canPlayType('application/vnd.apple.mpegurl')) { 
                                    video.src = videoSrc; video.addEventListener('loadedmetadata', function() { video.play().catch(e=>console.log(e)); }); 
                                } else {
                                    video.src = videoSrc; video.play().catch(e=>triggerError());
                                }

                                function formatTime(sec) {
                                    if (isNaN(sec) || sec === Infinity) return "LIVE";
                                    let h = Math.floor(sec / 3600); let m = Math.floor((sec % 3600) / 60); let s = Math.floor(sec % 60);
                                    if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
                                    return m + ':' + (s < 10 ? '0' : '') + s;
                                }

                                function updateProgressUI() {
                                    if (!video.duration || isNaN(video.duration)) return;
                                    if (video.duration === Infinity) { overlaySeekBar.value = 100; overlayTime.innerText = "LIVE"; } 
                                    else { overlaySeekBar.value = (video.currentTime / video.duration) * 100; overlayTime.innerText = formatTime(video.currentTime) + ' / ' + formatTime(video.duration); }
                                }

                                video.addEventListener('timeupdate', updateProgressUI);
                                video.addEventListener('seeking', updateProgressUI);

                                function safeSeek(seconds) {
                                    let newTime = video.currentTime + seconds;
                                    if (!isNaN(video.duration) && video.duration !== Infinity && video.duration > 0) {
                                        newTime = Math.min(newTime, video.duration);
                                    }
                                    video.currentTime = Math.max(0, newTime);
                                    updateProgressUI(); 
                                    showOverlay();
                                }

                                function showOverlay() { 
                                    customOverlay.classList.add('show'); 
                                    clearTimeout(overlayTimer);
                                    if (!video.paused) {
                                        overlayTimer = setTimeout(() => { hideOverlay(); }, 1000); 
                                    }
                                }
                                function hideOverlay() { customOverlay.classList.remove('show'); }

                                function togglePausePlay() { 
                                    if (video.paused) { video.play(); } 
                                    else { video.pause(); showOverlay(); } 
                                }

                                overlayPlayBtn.addEventListener('click', function(e) { e.stopPropagation(); togglePausePlay(); });
                                video.addEventListener('play', () => { overlayPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>'; });
                                video.addEventListener('pause', () => { overlayPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>'; });

                                touchCatcher.addEventListener('click', function(e) {
                                    const currentTime = new Date().getTime(); const tapDelay = currentTime - lastClickTime;
                                    if (tapDelay < 350 && tapDelay > 0) {
                                        const rect = touchCatcher.getBoundingClientRect(); const tapX = e.clientX - rect.left;
                                        if (tapX > rect.width / 2) { safeSeek(10); } else { safeSeek(-10); } 
                                        lastClickTime = 0; 
                                    } else {
                                        if (customOverlay.classList.contains('show')) { hideOverlay(); } else { showOverlay(); }
                                        lastClickTime = currentTime;
                                    }
                                });

                                overlaySeekBar.addEventListener('input', () => { if (video.duration && video.duration !== Infinity && !isNaN(video.duration)) { video.currentTime = (overlaySeekBar.value / 100) * video.duration; updateProgressUI(); } showOverlay(); });
                                document.getElementById('overlayBottom').addEventListener('click', function(e) { e.stopPropagation(); });
                                
                                overlayMuteBtn.addEventListener('click', function(e) { e.stopPropagation(); video.muted = !video.muted; if(video.muted) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>'; else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; showOverlay(); });

                                function toggleFullScreen() {
                                    const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                                    if (!isFullScreen) {
                                        if (videoContainer.requestFullscreen) { videoContainer.requestFullscreen().then(lockLandscape).catch(e=>console.log(e)); } 
                                        else if (videoContainer.webkitRequestFullscreen) { videoContainer.webkitRequestFullscreen(); lockLandscape(); } 
                                    } else {
                                        if (document.exitFullscreen) { document.exitFullscreen().then(unlockOrientation).catch(e=>console.log(e)); } 
                                        else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); unlockOrientation(); }
                                    }
                                    showOverlay();
                                }
                                fullScreenBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleFullScreen(); });

                                function lockLandscape() { if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(function(error) {
                                    console.log('Orientation lock failed:', error);
                                }); } }
                                function unlockOrientation() { if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); } }

                                document.addEventListener('keydown', function(event) {
                                    const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                                    if (isFullScreen) {
                                        if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
                                            event.preventDefault();
                                        }
                                        
                                        // ⚡ SPACE BAR: Play/Pause (Prevent page scroll)
                                        if (event.code === 'Space') {
                                            event.preventDefault();
                                            togglePausePlay();
                                            return;
                                        }
                                        
                                        // ⚡ VOLUME CONTROL: + / - / F2 / F3 / F4
                                        if (event.key === '+' || event.key === '=' || event.key === 'F3') {
                                            event.preventDefault();
                                            video.volume = Math.min(1, video.volume + 0.05);
                                            if (video.volume > 0) { video.muted = false; overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; }
                                            showOverlay();
                                            return;
                                        }
                                        if (event.key === '-' || event.key === '_' || event.key === 'F2') {
                                            event.preventDefault();
                                            video.volume = Math.max(0, video.volume - 0.05);
                                            if (video.volume === 0) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                                            showOverlay();
                                            return;
                                        }
                                        if (event.key === 'F4') {
                                            event.preventDefault();
                                            video.muted = !video.muted;
                                            if(video.muted) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                                            else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                                            showOverlay();
                                            return;
                                        }

                                        if ((event.key === 'ArrowRight' || event.key === 'ArrowLeft') && !event.repeat) {
                                            if (seekInterval) clearInterval(seekInterval);
                                            holdMultiplier = 0;
                                            
                                            const direction = event.key === 'ArrowRight' ? 1 : -1;
                                            safeSeek(10 * direction); 
                                            
                                            seekInterval = setInterval(() => { 
                                                holdMultiplier++;
                                                let skipAmount = 10;
                                                if (holdMultiplier > 4) skipAmount = 20; 
                                                if (holdMultiplier > 10) skipAmount = 30; 
                                                safeSeek(skipAmount * direction); 
                                            }, 150);
                                        }
                                    }
                                });

                                document.addEventListener('keyup', function(event) {
                                    const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                                    if (isFullScreen) {
                                        if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
                                            if (seekInterval) { clearInterval(seekInterval); seekInterval = null; }
                                            holdMultiplier = 0;
                                            event.preventDefault();
                                        }
                                    }
                                });

                                document.addEventListener('wheel', function(event) {
                                    const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                                    if (isFullScreen || videoContainer.contains(event.target)) {
                                        event.preventDefault(); let currentVolume = video.volume;
                                        if (event.deltaY < 0) { currentVolume = Math.min(1, currentVolume + 0.05); } else if (event.deltaY > 0) { currentVolume = Math.max(0, currentVolume - 0.05); }
                                        video.volume = currentVolume;
                                        if (currentVolume === 0) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>'; else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                                    }
                                }, { passive: false });
                            <\/script>
                        </body>
                        </html>`;
                        
                        playerWindow.document.open();
                        playerWindow.document.write(htmlContent);
                        playerWindow.document.close();
                    }, 200);
                }
                return;
            }

            nowPlayingText.innerHTML = `<i class="fa-solid fa-circle-play" style="color: var(--accent-red); margin-right: 8px;"></i> Now Playing: <span style="margin-left: 8px;">${name}</span>`;
            
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            
            // ⚡ START TIMER ON LOAD
            startPTimer();

            if (url.includes('.mp4') || url.endsWith('.mp4') || (!url.includes('.m3u8') && url.startsWith('http'))) {
                video.src = url; video.load(); video.play().catch(e => console.log("Auto-play blocked"));
            } 
            else if (Hls.isSupported()) {
                hlsInstance = new Hls({ xhrSetup: function (xhr, url) { xhr.withCredentials = false; } });
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(e => console.log("Auto-play blocked")); });
                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR: 
                                hlsInstance.destroy(); 
                                triggerError();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR: 
                                hlsInstance.recoverMediaError(); 
                                break;
                            default: 
                                hlsInstance.destroy(); 
                                triggerError();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => { video.play().catch(e => console.log("Auto-play blocked")); });
            } else {
                video.src = url; video.load();
                video.play().catch(e => { triggerError(); });
            }
        }

        // ==========================================
        // ⚡ INSTANT UI SYNC LOGIC
        // ==========================================
        
        function formatTime(sec) {
            if (isNaN(sec) || sec === Infinity) return "LIVE";
            let h = Math.floor(sec / 3600);
            let m = Math.floor((sec % 3600) / 60);
            let s = Math.floor(sec % 60);
            if (h > 0) return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateProgressUI() {
            if (!video.duration || isNaN(video.duration)) return; 

            if (video.duration === Infinity) {
                overlaySeekBar.value = 100;
                overlayTime.innerText = "LIVE";
            } else {
                overlaySeekBar.value = (video.currentTime / video.duration) * 100;
                overlayTime.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            }
        }

        video.addEventListener('timeupdate', updateProgressUI);
        video.addEventListener('seeking', updateProgressUI);

        function safeSeek(seconds, event) {
            if(event) event.stopPropagation(); 
            
            let newTime = video.currentTime + seconds;
            
            // Allow seeking past buffer. Just don't seek past total duration if it's known.
            if (!isNaN(video.duration) && video.duration !== Infinity && video.duration > 0) {
                newTime = Math.min(newTime, video.duration);
            }
            video.currentTime = Math.max(0, newTime);
            
            updateProgressUI(); 
            showOverlay();
        }

        let lastClickTime = 0;

        function showOverlay() { 
            customOverlay.classList.add('show'); 
            clearTimeout(overlayTimer);
            if (!video.paused) {
                overlayTimer = setTimeout(() => { hideOverlay(); }, 1000); 
            }
        }
        function hideOverlay() { customOverlay.classList.remove('show'); }

        touchCatcher.addEventListener('click', function(e) {
            const currentTime = new Date().getTime();
            const tapDelay = currentTime - lastClickTime;

            if (tapDelay < 350 && tapDelay > 0) {
                const rect = touchCatcher.getBoundingClientRect();
                const tapX = e.clientX - rect.left;
                if (tapX > rect.width / 2) { safeSeek(10); } 
                else { safeSeek(-10); } 
                lastClickTime = 0; 
            } else {
                if (customOverlay.classList.contains('show')) { hideOverlay(); }
                else { showOverlay(); }
                lastClickTime = currentTime;
            }
        });

        overlaySeekBar.addEventListener('input', () => {
            if (video.duration && video.duration !== Infinity && !isNaN(video.duration)) {
                video.currentTime = (overlaySeekBar.value / 100) * video.duration;
                updateProgressUI(); 
            }
            showOverlay(); 
        });
        
        function toggleMute(event) {
            if(event) event.stopPropagation();
            video.muted = !video.muted;
            if(video.muted) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            showOverlay();
        }

        function togglePausePlay(event) {
            if(event) event.stopPropagation();
            if (savedChannels.length === 0 || currentPlayingIndex === -1) return;

            if (video.paused) { 
                video.play();
            } else { 
                video.pause(); 
                showOverlay(); 
            }
        }

        video.addEventListener('play', () => {
            playPauseIcon.className = "fa-solid fa-pause";
            playPauseText.innerText = "Pause";
            overlayPlayBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        });

        video.addEventListener('pause', () => {
            playPauseIcon.className = "fa-solid fa-play";
            playPauseText.innerText = "Play";
            overlayPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        });

        function playNextChannel() {
            if(savedChannels.length === 0) return;
            let nextIndex = currentPlayingIndex + 1;
            if (nextIndex >= savedChannels.length) nextIndex = 0; 
            playChannelByIndex(nextIndex);
        }

        function playPrevChannel() {
            if(savedChannels.length === 0) return;
            let prevIndex = currentPlayingIndex - 1;
            if (prevIndex < 0) prevIndex = savedChannels.length - 1; 
            playChannelByIndex(prevIndex);
        }

        function toggleFullScreen(event) {
            if(event) event.stopPropagation();
            const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            
            if (!isFullScreen) {
                if (videoContainer.requestFullscreen) {
                    videoContainer.requestFullscreen().then(lockLandscape).catch(e=>console.log(e));
                } else if (videoContainer.webkitRequestFullscreen) {
                    videoContainer.webkitRequestFullscreen(); lockLandscape();
                } else if (videoContainer.msRequestFullscreen) {
                    videoContainer.msRequestFullscreen(); lockLandscape();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(unlockOrientation).catch(e=>console.log(e));
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen(); unlockOrientation();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen(); unlockOrientation();
                }
            }
            showOverlay();
        }

        function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(error) {
                    console.log('Orientation lock failed:', error);
                });
            }
        }

        function unlockOrientation() {
            if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); }
        }

        document.addEventListener('fullscreenchange', function() { if (!document.fullscreenElement) unlockOrientation(); });
        document.addEventListener('webkitfullscreenchange', function() { if (!document.webkitFullscreenElement) unlockOrientation(); });
        
        video.addEventListener('ended', function() {
            if (savedChannels.length === 0 || currentPlayingIndex === -1) return;
            const currentCategory = savedChannels[currentPlayingIndex].category || "OTHER";
            let nextIndex = -1;
            
            for (let i = currentPlayingIndex + 1; i < savedChannels.length; i++) {
                if ((savedChannels[i].category || "OTHER") === currentCategory) { nextIndex = i; break; }
            }
            if (nextIndex === -1) {
                for (let i = 0; i < currentPlayingIndex; i++) {
                    if ((savedChannels[i].category || "OTHER") === currentCategory) { nextIndex = i; break; }
                }
            }
            if (nextIndex !== -1) { playChannelByIndex(nextIndex); }
        });

        // ==========================================
        // ⚡ TV / DESKTOP SETTINGS (Fullscreen Hold-to-Seek & Arrow Keys Only)
        // ==========================================
        let seekInterval = null;
        let holdMultiplier = 0;

        document.addEventListener('keydown', function(event) {
            const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (isFullScreen) {
                if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
                    event.preventDefault(); 
                }
                
                // ⚡ SPACE BAR: Play/Pause (Prevent page scroll)
                if (event.code === 'Space') {
                    event.preventDefault();
                    togglePausePlay();
                    return;
                }
                
                // ⚡ VOLUME CONTROL: + / - / F2 / F3 / F4
                if (event.key === '+' || event.key === '=' || event.key === 'F3') {
                    event.preventDefault();
                    video.volume = Math.min(1, video.volume + 0.05);
                    if (video.volume > 0) { video.muted = false; overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>'; }
                    showOverlay();
                    return;
                }
                if (event.key === '-' || event.key === '_' || event.key === 'F2') {
                    event.preventDefault();
                    video.volume = Math.max(0, video.volume - 0.05);
                    if (video.volume === 0) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                    showOverlay();
                    return;
                }
                if (event.key === 'F4') {
                    event.preventDefault();
                    toggleMute();
                    return;
                }

                if ((event.key === 'ArrowRight' || event.key === 'ArrowLeft') && !event.repeat) {
                    if (seekInterval) clearInterval(seekInterval);
                    holdMultiplier = 0;
                    
                    const direction = event.key === 'ArrowRight' ? 1 : -1;
                    safeSeek(10 * direction); 
                    
                    seekInterval = setInterval(() => { 
                        holdMultiplier++;
                        let skipAmount = 10;
                        
                        if (holdMultiplier > 4) skipAmount = 20; 
                        if (holdMultiplier > 10) skipAmount = 30; 
                        
                        safeSeek(skipAmount * direction); 
                    }, 150);
                }
            }
        });

        document.addEventListener('keyup', function(event) {
            const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (isFullScreen) {
                if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
                    if (seekInterval) { clearInterval(seekInterval); seekInterval = null; }
                    holdMultiplier = 0;
                    event.preventDefault();
                }
            }
        });

        document.addEventListener('wheel', function(event) {
            const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (isFullScreen || videoContainer.contains(event.target)) {
                event.preventDefault(); 
                let currentVolume = video.volume;
                if (event.deltaY < 0) { currentVolume = Math.min(1, currentVolume + 0.05); } 
                else if (event.deltaY > 0) { currentVolume = Math.max(0, currentVolume - 0.05); }
                video.volume = currentVolume;
                
                if (currentVolume === 0) overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
                else overlayMuteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        }, { passive: false }); 

    </script>
</body>
