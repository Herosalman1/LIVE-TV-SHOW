<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Live TV Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-sidebar: rgba(17, 24, 39, 0.75);
            --bg-card: rgba(255, 255, 255, 0.03);
            --primary-gradient: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #f8fafc;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: radial-gradient(circle at top right, #1a233a, var(--bg-main)); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        /* Compact Header without LIVE TV badge */
        .header { background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(15px); padding: 10px 20px; font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}
        .header-title { background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 16px; }

        /* Mobile First Layout: Player first at the top */
        .main-container { display: flex; flex-direction: column; width: 100%; max-width: 900px; margin: 0 auto; padding: 10px; gap: 10px; }
        
        .player-section { width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        .now-playing { width: 100%; margin-bottom: 8px; font-size: 13px; color: #fff; text-align: center; font-weight: 500; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .now-playing span { color: #00f2fe; font-weight: 700; text-transform: uppercase; }

        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.08); }
        video { width: 100%; height: 100%; outline: none; background: #000; object-fit: fill; display: block;}

        .player-controls-bar { display: flex; justify-content: center; width: 100%; margin-top: 8px; background: #151b2b; border: 1px solid rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 25px; }
        .ctrl-btn { background: rgba(255, 255, 255, 0.08); border: none; color: #fff; padding: 6px 16px; border-radius: 15px; cursor: pointer; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 5px; margin: 0 4px;}
        .ctrl-btn.main-play { background: var(--primary-gradient); color: #000; padding: 6px 24px; }

        /* Sidebar / Folders Container below player on mobile */
        .sidebar { width: 100%; background: var(--bg-sidebar); border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 40vh; overflow: hidden; margin-top: 5px;}
        .sidebar-title { padding: 10px 15px; font-size: 13px; font-weight: 600; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border-color); color: #00f2fe; }
        .channel-list-container { overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
        
        .category-folder { margin-bottom: 6px; background: rgba(255,255,255,0.02); border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); }
        .category-header { padding: 10px 12px; background: rgba(0,0,0,0.2); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .cat-count { font-size: 10px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 8px; color: #00f2fe;}
        
        .category-content { display: none; padding: 6px; background: rgba(0,0,0,0.1); }
        .category-content.open { display: block; }

        .channel-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 8px 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; }
        .channel-item.active { background: rgba(0, 242, 254, 0.15); border-left: 3px solid #00f2fe; }
        .channel-item.active .channel-name { color: #00f2fe; font-weight: 600; }
        
        .channel-name { font-weight: 500; font-size: 12px; color: #e2e8f0; }
        .play-btn { background: #10b981; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer; }

        /* PC / Desktop View (Left Sidebar, Right Player Side-by-side) */
        @media (min-width: 900px) {
            .header { padding: 15px 30px; }
            .header-title { font-size: 22px; }
            .main-container { max-width: 1200px; height: calc(100vh - 65px); flex-direction: row; overflow: hidden; padding: 20px; gap: 20px; }
            .sidebar { width: 400px; min-width: 400px; max-height: 100%; height: 100%; margin-top: 0; order: 1; }
            .player-section { flex: 1; height: 100%; justify-content: center; order: 2; }
            .video-container { max-width: 850px; max-height: 60vh; }
            .now-playing, .player-controls-bar { max-width: 850px; }
            .now-playing { font-size: 16px; padding: 12px 30px; border-radius: 30px; margin-bottom: 15px; }
            .player-controls-bar { padding: 15px 25px; border-radius: 40px; margin-top: 20px; }
            .ctrl-btn { padding: 10px 25px; border-radius: 30px; font-size: 13px; margin: 0 10px; }
            .ctrl-btn.main-play { padding: 10px 35px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">⚡ HeroSalman1 Is Live</div>
    </div>

    <div class="main-container">
        
        <!-- Player Section comes first on Mobile so it stays on top -->
        <div class="player-section">
            <div class="now-playing" id="nowPlayingText">Select a channel to play...</div>
            
            <div class="video-container">
                <video id="tvPlayer" controls autoplay></video>
            </div>
            
            <div class="player-controls-bar">
                <button class="ctrl-btn" onclick="playPrevChannel()">Prev</button>
                <button class="ctrl-btn main-play" onclick="togglePausePlay()" id="playPauseBtn">Pause</button>
                <button class="ctrl-btn" onclick="playNextChannel()">Next</button>
            </div>
        </div>

        <!-- Folders/Channels list below player on mobile, left side on PC -->
        <div class="sidebar">
            <div class="sidebar-title">📁 All Channels Categories</div>
            <div class="channel-list-container" id="channelList">
                <div style="text-align:center; color:#00f2fe; padding:20px; font-size: 13px;">Loading Channels...</div>
            </div>
        </div>

    </div>

    <script>
        const video = document.getElementById('tvPlayer');
        const nowPlayingText = document.getElementById('nowPlayingText');
        const channelListEl = document.getElementById('channelList');
        const playPauseBtn = document.getElementById('playPauseBtn');
        
        let hlsInstance = null;
        let savedChannels = [];
        let savedCategories = [];
        let currentPlayingIndex = -1;

        fetch('tools.json')
            .then(res => res.json())
            .then(data => {
                savedChannels = data;
                
                let catSet = new Set();
                savedChannels.forEach(ch => {
                    if(!ch.category) ch.category = "OTHER";
                    catSet.add(ch.category);
                });
                savedCategories = Array.from(catSet).sort();
                
                renderChannels();
            })
            .catch(err => {
                channelListEl.innerHTML = '<div style="color:#f43f5e; text-align:center; padding:20px;">Error loading channels!</div>';
            });

        function toggleFolder(catId) {
            const content = document.getElementById('folder-' + catId);
            content.classList.toggle('open');
        }

        function renderChannels() {
            channelListEl.innerHTML = '';

            savedCategories.forEach(cat => {
                const channelsInCat = savedChannels.map((ch, idx) => ({...ch, originalIndex: idx})).filter(c => c.category === cat);
                if(channelsInCat.length === 0) return;

                const catId = cat.replace(/\s+/g, '-').toLowerCase();
                
                const folder = document.createElement('div');
                folder.className = 'category-folder';
                
                folder.innerHTML = `
                    <div class="category-header" onclick="toggleFolder('${catId}')">
                        <span>📁 ${cat}</span>
                        <span class="cat-count">${channelsInCat.length}</span>
                    </div>
                    <div class="category-content" id="folder-${catId}"></div>
                `;
                channelListEl.appendChild(folder);

                const contentEl = folder.querySelector('.category-content');

                channelsInCat.forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.setAttribute('data-index', ch.originalIndex);
                    item.onclick = () => playChannelByIndex(ch.originalIndex);

                    item.innerHTML = `
                        <span class="channel-name">📺 ${ch.name}</span>
                        <button class="play-btn">PLAY</button>
                    `;
                    contentEl.appendChild(item);
                });
            });
        }

        function playChannelByIndex(index) {
            if(index < 0 || index >= savedChannels.length) return;
            currentPlayingIndex = index;
            const ch = savedChannels[index];
            
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.channel-item[data-index="${index}"]`);
            if(activeItem) activeItem.classList.add('active');

            playStream(ch.url, ch.name);
        }

        function playStream(url, name) {
            nowPlayingText.innerHTML = `Now Playing: <span>${name}</span>`;

            if (hlsInstance) hlsInstance.destroy();

            if (Hls.isSupported() && url.includes('.m3u8')) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Auto-play blocked"));
                    playPauseBtn.innerText = "Pause";
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Auto-play blocked"));
                    playPauseBtn.innerText = "Pause";
                });
            } else {
                nowPlayingText.innerHTML = `<span style="color:#f43f5e;">Error: Format not supported.</span>`;
            }
        }

        function togglePausePlay() {
            if (video.paused) {
                video.play();
                playPauseBtn.innerText = "Pause";
            } else {
                video.pause();
                playPauseBtn.innerText = "Play";
            }
        }

        function playNextChannel() {
            if(savedChannels.length === 0) return;
            let nextIndex = currentPlayingIndex + 1;
            if (nextIndex >= savedChannels.length) nextIndex = 0; 
            playChannelByIndex(nextIndex);
        }

        function playPrevChannel() {
            if(savedChannels.length === 0) return;
            let prevIndex = currentPlayingIndex - 1;
            if (prevIndex < 0) prevIndex = savedChannels.length - 1; 
            playChannelByIndex(prevIndex);
        }
    </script>
</body>
</html>
